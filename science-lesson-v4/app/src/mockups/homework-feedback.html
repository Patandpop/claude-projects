<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last week's homework slide and the whole-class feedback sheet (mock-ups)</title>
<style>
  :root { --navy:#0D1B5E; --navy2:#152347; --gold:#FABB2E; --bg:#EDF2FA; --donow:#0D1B5E; --amber:#E65100; --green:#1B5E20; --teal:#00838F; --red:#B71C1C; --grey:#5d6a7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1b2233; color:#e8edf5; font:15px/1.4 "Trebuchet MS",Trebuchet,system-ui,sans-serif; }
  header { padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#0f1420; position:sticky; top:0; z-index:3; }
  header b { font-size:17px; margin-right:8px; }
  header button { font:inherit; padding:8px 12px; border-radius:9px; border:1px solid #3a4661; background:#182134; color:#e8edf5; }
  header button[aria-pressed="true"] { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .note { padding:10px 14px; color:#b8c2d6; max-width:1100px; }
  .note b { color:#fff; }
  #stage { padding:10px; display:flex; justify-content:center; }
  .frame { position:relative; transform-origin:top left; }
  /* ---------- the slide (13.33 x 7.5 in at 100 px/in) ---------- */
  .slide { width:1333px; height:750px; background:var(--bg); position:relative; overflow:hidden; color:#111; font-family:"Trebuchet MS",Trebuchet,sans-serif; }
  .nav { display:flex; height:55px; } .nav div { flex:1; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; background:var(--navy2); letter-spacing:.04em; }
  .nav div.on { background:var(--donow); font-weight:700; font-size:15px; }
  .acc { height:4px; background:var(--gold); }
  .bar { margin-top:12px; height:38px; background:var(--donow); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; letter-spacing:.02em; }
  .foot { position:absolute; left:0; right:0; bottom:0; height:35px; background:var(--navy); color:#fff; display:flex; align-items:center; padding:0 14px; font-size:15px; }
  .foot b { margin-right:8px; } .foot i { color:#dfe6f5; }
  .body { position:absolute; left:45px; right:45px; top:121px; bottom:47px; }
  .box { border:2px solid var(--gold); background:#fff; border-radius:4px; padding:14px 16px; }
  .navybox { background:var(--navy); color:#fff; border-radius:4px; padding:12px 16px; }
  .ring { width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#fff; flex:none; }
  .r-red { background:var(--red); } .r-amb { background:var(--amber); } .r-grn { background:var(--green); }
  .q { font-size:21px; line-height:1.3; }
  .ans { background:var(--navy); color:#fff; padding:10px 12px; border-radius:4px; font-size:21px; font-weight:700; margin-top:10px; }
  .wrong { margin-top:12px; font-size:18px; color:#333; } .wrong b { color:var(--amber); }
  .why { font-size:17px; color:#444; margin-top:6px; font-style:italic; }
  .click { position:absolute; right:10px; top:8px; font-size:11px; color:var(--grey); border:1px dashed var(--grey); border-radius:4px; padding:1px 5px; }
  .optbar { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:19px; }
  .optbar .l { width:34px; height:34px; border-radius:50%; background:#dfe6f5; display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
  .optbar .b { flex:1; height:30px; background:#e4e9f3; border-radius:4px; position:relative; }
  .optbar .b i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:#9aa6c0; }
  .optbar.right .b i { background:var(--gold); } .optbar.right .l { background:var(--gold); }
  .optbar.wrong .b i { background:var(--amber); }
  .optbar .n { width:120px; text-align:right; font-weight:700; }
  table.t { width:100%; border-collapse:collapse; font-size:17px; }
  table.t th { text-align:left; background:var(--navy); color:#fff; padding:8px 10px; font-size:15px; }
  table.t td { padding:9px 10px; border-bottom:1px solid #d9e0ee; vertical-align:top; }
  .pct { font-weight:800; } .pct.red { color:var(--red); } .pct.amb { color:var(--amber); } .pct.grn { color:var(--green); }
  /* ---------- the A4 sheet (210 x 297 mm at 4 px/mm) ---------- */
  .sheet { width:840px; height:1188px; background:#fff; color:#111; position:relative; padding:40px 44px; font-family:"Trebuchet MS",Trebuchet,sans-serif; font-size:15px; }
  .sh-head { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid var(--navy); padding-bottom:8px; }
  .sh-head h1 { margin:0; font-size:22px; color:var(--navy); } .sh-head .meta { text-align:right; color:#333; font-size:14px; line-height:1.4; }
  .sh-sec { margin-top:16px; }
  .sh-sec h2 { margin:0 0 6px; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--navy); display:inline-block; padding:3px 10px; border-radius:3px; }
  .sh-sec h2.g { background:var(--green); } .sh-sec h2.a { background:var(--amber); } .sh-sec h2.t { background:var(--teal); }
  .sh-box { border:1.5px solid var(--navy); border-radius:4px; padding:10px 12px; }
  .sh-box.dotted { border-style:dashed; min-height:110px; }
  .sh-row { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid #e3e8f2; }
  .sh-row:last-child { border-bottom:0; }
  .sh-row .p { width:54px; font-weight:800; font-size:18px; flex:none; }
  .sh-row .p.red { color:var(--red); } .sh-row .p.grn { color:var(--green); } .sh-row .p.amb { color:var(--amber); }
  .sh-row .x { flex:1; } .sh-row .x b { color:var(--navy); }
  .sh-row .x .w { color:#333; font-size:14px; } .sh-row .x .w b { color:var(--amber); }
  .task { display:flex; gap:8px; padding:6px 0; } .task .n { width:24px; font-weight:800; }
  .lines { height:46px; background:repeating-linear-gradient(#fff 0 22px,#c9d2e3 22px 23px); margin-top:4px; }
  .strip { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px; }
  .strip .k { width:36px; font-weight:700; } .strip .bar { flex:1; height:16px; background:#e9edf5; border-radius:3px; position:relative; margin:0; }
  .strip .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
  .strip .v { width:44px; text-align:right; font-weight:700; }
  .spec { display:grid; grid-template-columns:1fr; gap:6px; }
  .spec div { padding:8px 10px; border-radius:4px; color:#fff; font-size:14px; display:flex; justify-content:space-between; }
  .s-g { background:var(--green); } .s-a { background:#F9A825; color:#111 !important; } .s-r { background:var(--red); } .s-q { background:#9aa6c0; }
  .tiny { font-size:12px; color:#666; }
  .sh-foot { position:absolute; left:44px; right:44px; bottom:28px; font-size:12px; color:#666; border-top:1px solid #d9e0ee; padding-top:6px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<header>
  <b>Slide: last week's homework</b>
  <button data-v="sA" aria-pressed="true">A three cards</button><button data-v="sB">B one at a time</button><button data-v="sC">C table and fix</button>
  <b style="margin-left:18px">Sheet: whole-class feedback</b>
  <button data-v="pA">A four boxes</button><button data-v="pB">B question strip</button><button data-v="pC">C spec colours</button>
</header>
<div class="note" id="note"></div>
<div id="stage"><div class="frame" id="frame"></div></div>

<script>
(function () {
  'use strict';
  // made-up class numbers for a made-up class; the wording is what the builder would write from the planner's Results and MCQ Votes tabs
  var CLS = '10C2', TITLE = 'Energy stores and transfers', DUE = 'Fri 23 Oct', DONE = 24, SIZE = 28, LATE = 3, AVG = 61;
  var Q = [
    { n: 4, text: 'A 2 kg ball is lifted 3 m. Gravitational field strength is 10 N/kg. Calculate the energy stored in the gravitational store.', pct: 38, right: '60 J', wrong: '6 J', wrongN: 9, why: 'Mass and height were multiplied but g was left out (or 2 x 3 was divided by 10).', kind: 'number' },
    { n: 7, text: 'Which energy store empties as a stretched spring returns to its original length?', pct: 46, right: 'B  Elastic potential', wrong: 'C  Kinetic', wrongN: 8, why: 'They named the store that fills (kinetic) instead of the one that empties.', kind: 'mcq', opts: [['A', 'Thermal', 2], ['B', 'Elastic potential', 11], ['C', 'Kinetic', 8], ['D', 'Chemical', 3]] },
    { n: 2, text: 'State what is meant by "dissipated" energy.', pct: 54, right: 'Energy transferred to the surroundings (usually by heating) so it is no longer useful.', wrong: 'Energy that is lost or destroyed', wrongN: 7, why: 'Energy is never destroyed. The word they need is "spread out" or "transferred to the surroundings".', kind: 'written' }
  ];
  var WELL = [{ n: 1, text: 'Name the eight energy stores', pct: 92 }, { n: 5, text: 'Describe the energy transfer when a kettle boils', pct: 85 }, { n: 3, text: 'Efficiency = useful output / total input', pct: 79 }];
  var ring = function (p) { return '<div class="ring ' + (p < 50 ? 'r-red' : p < 75 ? 'r-amb' : 'r-grn') + '">' + p + '%</div>'; };
  var pc = function (p) { return '<span class="pct ' + (p < 50 ? 'red' : p < 75 ? 'amb' : 'grn') + '">' + p + '%</span>'; };
  var chrome = function (body, barText) {
    return '<div class="slide"><div class="nav"><div class="on">DO NOW</div><div>ENGAGE</div><div>LEARN</div><div>BUILD</div><div>APPLY</div><div>REVIEW</div></div><div class="acc"></div>' +
      '<div class="bar">' + barText + '</div><div class="body">' + body + '</div>' +
      '<div class="foot"><b>Learning objective:</b><i>Calculate changes in energy stores and explain where energy is dissipated</i></div></div>';
  };

  var V = {
    sA: {
      note: '<b>Slide A, three cards.</b> After the Do Now answers, one slide: the three most-missed questions from last week\'s homework side by side. Each card: the question, the class\'s % in a coloured ring, the right answer (appears on click, whole box), then the answer most of them gave and one line on why it is wrong. Numbers are class counts only, never names. Good when he wants it over in two minutes.',
      html: function () {
        return chrome('<div style="display:flex;gap:18px;height:100%">' + Q.map(function (q) {
          return '<div class="box" style="flex:1;position:relative"><span class="click">click</span><div style="display:flex;gap:12px;align-items:center">' + ring(q.pct) + '<div style="font-size:15px;color:#555">Question ' + q.n + '<br><b style="color:#111">' + q.pct + '% of marks</b></div></div>' +
            '<p class="q">' + q.text + '</p><div class="ans">' + q.right + '</div><p class="wrong">' + q.wrongN + ' of ' + DONE + ' put <b>' + q.wrong + '</b></p><p class="why">' + q.why + '</p></div>';
        }).join('') + '</div>', 'DO NOW · LAST WEEK’S HOMEWORK · ' + TITLE + ' · ' + DONE + ' of ' + SIZE + ' did it');
      }
    },
    sB: {
      note: '<b>Slide B, one at a time.</b> Three slides, one question each (this is 2 of 3). The question big, every answer the class gave as a bar with its count (gold = right, orange = the common wrong one), the right answer and the why appear on click. For a typed-number question the bars are the answers given; for a written one they are the mark points hit. Slower, but the bars make pupils look for themselves.',
      html: function () {
        var q = Q[1];
        return chrome('<div style="display:flex;gap:18px;height:100%"><div class="box" style="flex:1.3;position:relative"><span class="click">click for the answer</span><div style="font-size:15px;color:#555">Question ' + q.n + ' · 2 of 3 · ' + q.pct + '% right</div><p class="q" style="font-size:24px;margin:10px 0 18px">' + q.text + '</p>' +
          q.opts.map(function (o) { var cls = o[0] === 'B' ? 'right' : o[0] === 'C' ? 'wrong' : ''; return '<div class="optbar ' + cls + '"><div class="l">' + o[0] + '</div><div style="width:190px">' + o[1] + '</div><div class="b"><i style="width:' + Math.round(100 * o[2] / DONE) + '%"></i></div><div class="n">' + o[2] + ' pupils</div></div>'; }).join('') +
          '</div><div style="flex:1;display:flex;flex-direction:column;gap:14px"><div class="navybox" style="flex:1"><div style="font-size:15px;color:#dfe6f5">THE ANSWER</div><div style="font-size:26px;font-weight:700;margin-top:6px">B  Elastic potential</div><p style="font-size:17px;margin:12px 0 0">The spring’s elastic store <b>empties</b>; the kinetic store <b>fills</b>. The question asks which one empties.</p></div>' +
          '<div class="box" style="flex:1"><div style="font-size:15px;color:#555">WHY 8 PICKED C</div><p class="q" style="margin:6px 0 0">' + q.why + '</p><p style="margin:10px 0 0;font-size:17px"><b>Whiteboards:</b> a bow is released. Which store empties? Which fills?</p></div></div></div>',
          'DO NOW · LAST WEEK’S HOMEWORK · QUESTION 7');
      }
    },
    sC: {
      note: '<b>Slide C, table and fix.</b> One slide: a compact table of the three most-missed questions (class %, the common wrong answer, why) on the left, and on the right a "Fix it now" box with one fresh question on the weakest spot for whiteboards, its answer on click. The table is quick to read from the front; the fix makes the slide do some teaching, not just reporting.',
      html: function () {
        return chrome('<div style="display:flex;gap:18px;height:100%"><div class="box" style="flex:1.5;padding:0;overflow:hidden"><table class="t"><tr><th style="width:36px">Q</th><th>Question</th><th style="width:70px">Class</th><th style="width:150px">Most put</th><th>Why it is wrong</th></tr>' +
          Q.map(function (q) { return '<tr><td><b>' + q.n + '</b></td><td>' + q.text + '<br><span style="color:var(--green);font-weight:700">' + q.right + '</span></td><td>' + pc(q.pct) + '</td><td style="color:var(--amber);font-weight:700">' + q.wrong + '<br><span class="tiny">' + q.wrongN + ' of ' + DONE + '</span></td><td style="font-size:15px">' + q.why + '</td></tr>'; }).join('') +
          '</table><div style="padding:8px 10px;font-size:14px;color:#555">' + DONE + ' of ' + SIZE + ' did it · ' + LATE + ' late · class average ' + AVG + '% · went well: Q1 (92%), Q5 (85%)</div></div>' +
          '<div style="flex:1;display:flex;flex-direction:column;gap:14px"><div class="box" style="flex:1;position:relative"><span class="click">click</span><div style="font-size:15px;color:#555">FIX IT NOW · whiteboards</div><p class="q" style="font-size:22px;margin:8px 0">A 5 kg bag is lifted onto a shelf 2 m high (g = 10 N/kg). How much energy is in its gravitational store?</p><div class="ans">E = m g h = 5 × 10 × 2 = 100 J</div><p class="why" style="margin-top:10px">Three numbers multiply. If your answer is 10 J you left out g.</p></div>' +
          '<div class="navybox"><b>Next:</b> the spring question comes back in the multiple choice block today.</div></div></div>',
          'DO NOW · LAST WEEK’S HOMEWORK · ' + TITLE);
      }
    },
    pA: {
      note: '<b>Sheet A, four boxes.</b> One A4 page per class, printed after a marked test or key homework and stuck in books. Header with the class numbers. "What went well" (the three best questions), "Even better if" (the three most missed, with the right answer, the common wrong answer and why), "Now do this" (three short questions aimed at the misses, answered under the sheet), and a dashed box where each pupil writes their own target. Class counts only; no names anywhere.',
      html: function () {
        return '<div class="sheet"><div class="sh-head"><div><h1>' + CLS + ' · ' + TITLE + '</h1><div style="color:#333">Whole-class feedback · homework due ' + DUE + '</div></div><div class="meta">' + DONE + ' of ' + SIZE + ' handed in · ' + LATE + ' late<br>class average <b>' + AVG + '%</b> · best question 92%</div></div>' +
          '<div class="sh-sec"><h2 class="g">What went well</h2><div class="sh-box">' + WELL.map(function (w) { return '<div class="sh-row"><div class="p grn">' + w.pct + '%</div><div class="x"><b>Q' + w.n + '</b> ' + w.text + '</div></div>'; }).join('') + '</div></div>' +
          '<div class="sh-sec"><h2 class="a">Even better if</h2><div class="sh-box">' + Q.map(function (q) { return '<div class="sh-row"><div class="p ' + (q.pct < 50 ? 'red' : 'amb') + '">' + q.pct + '%</div><div class="x"><b>Q' + q.n + '</b> ' + q.text + '<br><span style="color:var(--green)"><b style="color:var(--green)">Answer:</b> ' + q.right + '</span><div class="w">' + q.wrongN + ' of ' + DONE + ' put <b>' + q.wrong + '</b>. ' + q.why + '</div></div></div>'; }).join('') + '</div></div>' +
          '<div class="sh-sec"><h2 class="t">Now do this (in your book, green pen)</h2><div class="sh-box">' +
          '<div class="task"><div class="n">1</div><div>A 5 kg bag is lifted 2 m (g = 10 N/kg). Calculate the energy in its gravitational store. Show the three numbers you multiply.</div></div>' +
          '<div class="task"><div class="n">2</div><div>A bow is released. Name the store that empties and the store that fills.</div></div>' +
          '<div class="task"><div class="n">3</div><div>A phone gets warm while charging. Describe where the "wasted" energy goes, without using the word "lost".</div></div></div></div>' +
          '<div class="sh-sec"><h2>My target from this</h2><div class="sh-box dotted"><div class="lines" style="height:92px"></div></div></div>' +
          '<div class="sh-foot"><span>Beechen Cliff Science · made from the class’s results, no individual marks on this sheet</span><span>' + CLS + ' · ' + TITLE + '</span></div></div>';
      }
    },
    pB: {
      note: '<b>Sheet B, question strip.</b> The whole homework at a glance: one line per question with a bar of the class %, so pupils see the shape of the test (green, amber, red). Under it only the red ones get the answer, the common wrong answer and why, then the task. More honest about the whole paper, less room for the task.',
      html: function () {
        var all = [{ n: 1, pct: 92 }, { n: 2, pct: 54 }, { n: 3, pct: 79 }, { n: 4, pct: 38 }, { n: 5, pct: 85 }, { n: 6, pct: 71 }, { n: 7, pct: 46 }, { n: 8, pct: 66 }, { n: 9, pct: 58 }, { n: 10, pct: 74 }];
        var col = function (p) { return p < 50 ? 'var(--red)' : p < 75 ? 'var(--amber)' : 'var(--green)'; };
        return '<div class="sheet"><div class="sh-head"><div><h1>' + CLS + ' · ' + TITLE + '</h1><div style="color:#333">Whole-class feedback · homework due ' + DUE + '</div></div><div class="meta">' + DONE + ' of ' + SIZE + ' handed in · ' + LATE + ' late<br>class average <b>' + AVG + '%</b></div></div>' +
          '<div class="sh-sec"><h2>How the class did, question by question</h2><div class="sh-box">' + all.map(function (q) { return '<div class="strip"><div class="k">Q' + q.n + '</div><div class="bar"><i style="width:' + q.pct + '%;background:' + col(q.pct) + '"></i></div><div class="v">' + q.pct + '%</div></div>'; }).join('') + '<div class="tiny" style="margin-top:6px">Green 75% or more of the marks, amber 50 to 74, red under 50. Marks across the whole class, not yours.</div></div></div>' +
          '<div class="sh-sec"><h2 class="a">The red ones</h2><div class="sh-box">' + Q.slice(0, 2).map(function (q) { return '<div class="sh-row"><div class="p red">Q' + q.n + '</div><div class="x">' + q.text + '<br><span style="color:var(--green)"><b style="color:var(--green)">Answer:</b> ' + q.right + '</span><div class="w">Most common wrong answer: <b>' + q.wrong + '</b>. ' + q.why + '</div></div></div>'; }).join('') + '</div></div>' +
          '<div class="sh-sec"><h2 class="t">Now do this</h2><div class="sh-box"><div class="task"><div class="n">1</div><div>A 5 kg bag is lifted 2 m (g = 10 N/kg). Calculate the energy in its gravitational store.</div></div><div class="task"><div class="n">2</div><div>A bow is released. Name the store that empties and the store that fills.</div></div><div class="lines" style="height:69px"></div></div></div>' +
          '<div class="sh-foot"><span>Beechen Cliff Science · class results only</span><span>' + CLS + ' · ' + TITLE + '</span></div></div>';
      }
    },
    pC: {
      note: '<b>Sheet C, spec colours.</b> Left: the parts of the specification this homework covered, coloured by the memory map (green remembered, amber fading, red due back), so the sheet also says what to revise. Right: the three misses with answer and why. Then the task and a box for the pupil\'s own target. Ties the sheet to the memory map; needs the map\'s spec codes on the homework (Lane B has the index).',
      html: function () {
        return '<div class="sheet"><div class="sh-head"><div><h1>' + CLS + ' · ' + TITLE + '</h1><div style="color:#333">Whole-class feedback · homework due ' + DUE + '</div></div><div class="meta">' + DONE + ' of ' + SIZE + ' handed in · class average <b>' + AVG + '%</b></div></div>' +
          '<div style="display:flex;gap:16px"><div class="sh-sec" style="flex:1"><h2>What this covered</h2><div class="spec">' +
          '<div class="s-g"><span>6.1.1.1 Energy stores and systems</span><b>92%</b></div><div class="s-g"><span>6.1.1.2 Changes in energy (kinetic)</span><b>81%</b></div><div class="s-r"><span>6.1.1.2 Changes in energy (gravitational)</span><b>38%</b></div><div class="s-a"><span>6.1.1.2 Elastic potential energy</span><b>58%</b></div><div class="s-a"><span>6.1.2.2 Dissipation of energy</span><b>54%</b></div><div class="s-g"><span>6.1.1.4 Efficiency</span><b>79%</b></div></div><div class="tiny" style="margin-top:6px">Colours from the class memory map on ' + DUE + '. Red parts come back in the next Do Now.</div></div>' +
          '<div class="sh-sec" style="flex:1.3"><h2 class="a">Even better if</h2><div class="sh-box">' + Q.map(function (q) { return '<div class="sh-row"><div class="p ' + (q.pct < 50 ? 'red' : 'amb') + '">' + q.pct + '%</div><div class="x"><b>Q' + q.n + '</b> ' + q.text + '<br><span style="color:var(--green)"><b style="color:var(--green)">Answer:</b> ' + q.right + '</span><div class="w">Most put <b>' + q.wrong + '</b>. ' + q.why + '</div></div></div>'; }).join('') + '</div></div></div>' +
          '<div class="sh-sec"><h2 class="t">Now do this</h2><div class="sh-box"><div class="task"><div class="n">1</div><div>A 5 kg bag is lifted 2 m (g = 10 N/kg). Calculate the energy in its gravitational store. Show the three numbers you multiply.</div></div><div class="task"><div class="n">2</div><div>A bow is released. Name the store that empties and the store that fills.</div></div><div class="task"><div class="n">3</div><div>A phone gets warm while charging. Describe where the energy goes, without the word "lost".</div></div></div></div>' +
          '<div class="sh-sec"><h2>My target from this</h2><div class="sh-box dotted"><div class="lines" style="height:69px"></div></div></div>' +
          '<div class="sh-foot"><span>Beechen Cliff Science · class results only</span><span>' + CLS + ' · ' + TITLE + '</span></div></div>';
      }
    }
  };
  var frame = document.getElementById('frame'), note = document.getElementById('note');
  function fit() {
    var w = frame.firstChild ? frame.firstChild.offsetWidth : 1333, h = frame.firstChild ? frame.firstChild.offsetHeight : 750;
    var s = Math.min((window.innerWidth - 20) / w, 1);
    frame.style.transform = 'scale(' + s + ')'; frame.style.width = w + 'px'; frame.style.height = h + 'px';
    document.getElementById('stage').style.height = (h * s + 20) + 'px';
  }
  function show(k) {
    frame.innerHTML = V[k].html(); note.innerHTML = V[k].note;
    document.querySelectorAll('header button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === k)); });
    fit();
  }
  document.querySelector('header').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.v); });
  window.addEventListener('resize', fit);
  show('sA');
})();
</script>
