<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ulhu Big Moments II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* One dark look by design (the drowned temple). Every theme hook repeats the same dark tokens. */
:root{color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298;--sea:#5ef2a0;--honey:#ffd56a;--wax:#b8322a;
--gx:'Grenze Gotisch',Georgia,serif;--ax:'Atkinson Hyperlegible',system-ui,sans-serif;--fx:'IM Fell English',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298}}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298}
*{box-sizing:border-box}
html,body{margin:0;background:#0a100e;color:#e8e1cf;font:15px/1.45 var(--ax)}
main{max-width:412px;margin:0 auto;padding:16px}
h1{font:700 30px/1.1 var(--gx);color:#ffd56a;margin:4px 0 6px}
h2{font:700 24px/1.1 var(--gx);color:#5ef2a0;margin:28px 0 4px}
.intro,.gi{color:#8fa298;margin:0 0 10px}
.card{background:#101a17;border:1px solid #24443a;border-radius:10px;padding:10px;margin:14px 0}
.card h3{margin:0 0 2px;font:700 18px var(--ax);color:#e8e1cf}.card h3 b{color:#ffd56a;margin-right:6px}
.cap{margin:0 0 8px;color:#b9c4bc;font-size:14px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font:700 14px var(--ax);color:#0a100e;background:#5ef2a0;border:0;border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer}
button.alt{background:#2a3d36;color:#e8e1cf}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
/* stage */
.stage{position:relative;height:290px;border-radius:8px;overflow:hidden;background:#02070a;border:1px solid #0d1f19}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.cam>canvas.bg{position:absolute;inset:0;width:100%;height:100%}
.ulhu{position:absolute;left:calc(50% - 48px);bottom:22px;width:96px;height:96px;transform-origin:50% 85%}
.ulhu img{width:96px;height:96px;display:block}
.vial{position:absolute;left:14px;top:14px;width:30px;height:52px;border:3px solid #cfe9df;border-top-width:5px;border-radius:3px 3px 8px 8px;background:#06110d;overflow:hidden}
.vial i{position:absolute;left:0;right:0;bottom:0;height:100%;background:repeating-linear-gradient(0deg,#3fd38a 0 3px,#5ef2a0 3px 6px);box-shadow:0 0 10px #5ef2a0}
.vial.cr{border-color:#7d8f88}
.hpl{position:absolute;left:8px;top:70px;width:44px;text-align:center;font:700 11px var(--ax);color:#cfe9df;text-shadow:0 1px 0 #000}
.plq{position:absolute;right:12px;top:12px;width:132px;padding:6px 6px 7px;text-align:center;background:linear-gradient(#2b3a34,#18231f);border:2px solid #0a120f;box-shadow:inset 0 0 0 2px #3d5249,0 3px 0 #050a08}
.plq .num{font:700 30px/1 var(--gx);color:#ffd56a;text-shadow:0 2px 0 #000;position:relative;display:inline-block;min-width:40px}
.plq .ttl{font:italic 13px var(--fx);color:#e8e1cf}
.plq .crk{position:absolute;inset:0;opacity:0;background:linear-gradient(115deg,transparent 46%,#050a08 47% 49%,transparent 50%),linear-gradient(60deg,transparent 60%,#050a08 61% 62%,transparent 63%)}
.fx{position:absolute;inset:0;pointer-events:none}
.say{position:absolute;left:10px;right:10px;bottom:8px;padding:6px 10px;background:#e9dbb4;color:#2a1a12;font:italic 14px/1.3 var(--fx);border-radius:3px;opacity:0;box-shadow:0 2px 0 #000}
.lab{position:absolute;left:0;right:0;top:44%;text-align:center;font:italic 17px var(--fx);color:#e8e1cf;opacity:0;text-shadow:0 2px 6px #000}
.big{position:absolute;left:0;right:0;top:36%;text-align:center;font:700 34px var(--gx);color:#ffd56a;opacity:0;text-shadow:0 0 18px rgba(255,213,106,.8),0 2px 0 #000}
/* level up */
.fall{position:absolute;top:0;height:100%;transform-origin:50% 0;transform:scaleY(0);background:repeating-linear-gradient(180deg,rgba(190,255,230,.55) 0 5px,rgba(94,242,160,.32) 5px 14px,rgba(40,160,120,.12) 14px 22px);background-size:100% 44px;animation:flow .5s linear infinite;mix-blend-mode:screen}
@keyframes flow{to{background-position:0 44px}}
.pool{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,rgba(94,242,160,.55));opacity:0}
.ember{position:absolute;width:7px;height:7px;background:#fff6c8;box-shadow:0 0 6px 3px #ff9a3a,0 0 14px 6px rgba(255,120,40,.6);opacity:0}
.burn{position:absolute;inset:0;color:#fff2b0;text-shadow:0 0 8px #ff8a2a,0 0 16px #ff5a1a;clip-path:inset(0 100% 0 0)}
.ring{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid #5ef2a0;border-radius:50%;opacity:0}
.mote{position:absolute;width:4px;height:4px;background:#5ef2a0;box-shadow:0 0 6px #5ef2a0}
/* faint */
.shard{position:absolute;width:5px;height:5px;background:rgba(220,245,235,.9)}
.ink{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,#03110b 0 40%,rgba(10,40,26,.95) 60%,rgba(40,120,80,0) 72%);transform:scale(0)}
.rbub{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(200,255,230,.55);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(120,200,170,.08) 60%);display:grid;place-items:center}
.rbub canvas{width:16px;height:16px}
.beam{position:absolute;top:-20px;width:70px;height:340px;left:calc(50% - 35px);background:linear-gradient(180deg,rgba(255,250,215,.55),rgba(255,250,215,0));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);opacity:0;mix-blend-mode:screen}
/* The Call panel with the three stars */
.call{margin-top:8px;padding:10px;background:#0c1512;border:1px solid #24443a;border-radius:8px}
.call .hd{font:700 15px var(--gx);color:#8fa298;letter-spacing:.08em;text-align:center;margin-bottom:6px}
.stars{display:flex;justify-content:space-around;align-items:center}
.stars canvas{width:96px;height:96px;transition:filter .6s}
.stars canvas.on{filter:drop-shadow(0 0 8px rgba(255,215,140,.75))}
.rits{margin-top:8px;display:grid;gap:5px}
.rit{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#142420;border:1px solid #24443a;border-radius:5px;font-size:14px}
.rit .sk{width:16px;height:16px;border:2px solid #5d7a70;border-radius:3px}
.rit.on{background:#1b3a2e;border-color:#5ef2a0}.rit.on .sk{background:#5ef2a0;border-color:#5ef2a0}
.back{margin-top:6px;text-align:center;font:italic 14px var(--fx);color:#ffd56a;min-height:20px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.states div{text-align:center;font-size:12px;color:#8fa298}
.states .row{display:flex;justify-content:center;gap:1px}
.states canvas{width:28px;height:28px}
.states canvas.on{filter:drop-shadow(0 0 3px rgba(255,215,140,.8))}
/* gate */
.gate{position:absolute;inset:0;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50%;background-size:cover}
.door.l{left:0;border-right:2px solid #000}.door.r{right:0;border-left:2px solid #000}
.door canvas{width:100%;height:100%}
.arch{position:absolute;left:14px;right:14px;top:84px;text-align:center;padding:10px 6px;background:rgba(0,0,0,.6);border:1px solid rgba(110,200,255,.6);box-shadow:0 0 24px rgba(110,200,255,.45);opacity:0}
.arch .dn{font:700 12px var(--ax);letter-spacing:.3em;color:#9ed8ff}
.arch .dt{font:700 32px/1 var(--gx);color:#fff;text-shadow:0 0 14px rgba(110,200,255,.9),0 2px 0 #000;margin-top:4px;min-height:32px}
.arch .dt span{opacity:0;display:inline-block}
.arch .dm{font:italic 13px var(--fx);color:rgba(255,255,255,.85);margin-top:4px;opacity:0}
.seam{position:absolute;top:0;bottom:0;left:calc(50% - 2px);width:4px;background:#d8f2ff;box-shadow:0 0 12px 6px rgba(140,210,255,.8);opacity:0}
.flood{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(170,225,255,.9),rgba(40,110,160,.3) 60%,transparent);opacity:0}
.spark{position:absolute;width:3px;height:3px;background:#fff3c0;box-shadow:0 0 4px #ffcf5a}
@media (prefers-reduced-motion:reduce){.fall{animation:none}}
</style>
</head>
<body>
<main id="main">
<h1>Ulhu's Big Moments, round two</h1>
<p class="intro">Three refinements of each pick: LU2 The Falls, FA2 Ink in the Water, DP3 The Gate. Press Replay on any card. The faint cards also replay the slow recovery and show the three Rise again stars at 0, 1, 2 and 3 lit.</p>
</main>
<script>
(function () {
'use strict';
const ULHU = /*__ULHU__*/;
const STOP = { stop: true };
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function spawn(p, cls, css, html) { const e = el('div', cls, html); if (css) e.style.cssText = css; p.appendChild(e); return e; }
function rng(seed) { return function () { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pen(ctx) { return (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }; }

/* ---------- timeline: every animation and wait belongs to one run, Replay kills it ---------- */
function TL() { this.anims = []; this.timers = []; this.dead = false; }
TL.prototype.a = function (e, kf, d, o) { if (this.dead) throw STOP; o = o || {}; const an = e.animate(kf, { duration: RM ? 1 : d, delay: RM ? 0 : (o.delay || 0), easing: o.ease || 'ease', fill: 'forwards', iterations: o.it || 1 }); this.anims.push(an); return an; };
TL.prototype.wait = function (ms) { return new Promise((res, rej) => { if (this.dead) return rej(STOP); this.timers.push(setTimeout(() => this.dead ? rej(STOP) : res(), RM ? 1 : ms)); }); };
TL.prototype.kill = function () { this.dead = true; this.anims.forEach((a) => a.cancel()); this.timers.forEach(clearTimeout); };

/* ---------- the drowned-temple backdrop, drawn in pixels ---------- */
const PAL = {
  shallows: { top: '#1f7a5a', bot: '#07211a', far: '#174d3e', mid: '#1b3a31', hi: '#30604f', lo: '#0f221c', ledge: '#28392f', lhi: '#43604f', moss: '#3fae6a', shaft: 'rgba(150,255,205,.10)' },
  twilight: { top: '#1f6f8a', bot: '#061a2a', far: '#12405a', mid: '#173246', hi: '#2b5a76', lo: '#0b1a26', ledge: '#243440', lhi: '#3d5a6e', moss: '#3a8f9a', shaft: 'rgba(150,220,255,.10)' },
  grey: { top: '#26302d', bot: '#070a09', far: '#1c2422', mid: '#161d1b', hi: '#2a3431', lo: '#0c100f', ledge: '#232a28', lhi: '#38423f', moss: '#3b4a44', shaft: 'rgba(200,210,205,.05)' }
};
function drawBg(cv, pal, seed) {
  const W = 128, H = 97; cv.width = W; cv.height = H; const ctx = cv.getContext('2d'), R = pen(ctx), r = rng(seed || 7);
  for (let y = 0; y < H; y++) { const k = y / H; ctx.fillStyle = mix(pal.top, pal.bot, k); ctx.fillRect(0, y, W, 1); if (y % 2 === 0) for (let x = (y / 2) % 2; x < W; x += 4) if (r() < .25) R(x, y, 1, 1, mix(pal.top, pal.bot, Math.min(1, k + .06))); }
  for (let i = 0; i < 4; i++) { ctx.fillStyle = pal.shaft; ctx.beginPath(); const x = 10 + i * 30 + r() * 10; ctx.moveTo(x, 0); ctx.lineTo(x + 8, 0); ctx.lineTo(x + 26, H); ctx.lineTo(x + 12, H); ctx.fill(); }
  for (let i = 0; i < 9; i++) { const x = r() * W, w = 5 + Math.floor(r() * 7), h = 18 + Math.floor(r() * 30); R(x, 78 - h, w, h, pal.far); R(x, 78 - h, 1, h, pal.hi); if (r() < .5) R(x - 2, 78 - h, w + 4, 2, pal.hi); }
  for (const x of [14, 104]) { R(x, 30, 9, 50, pal.mid); R(x, 30, 2, 50, pal.hi); R(x + 7, 30, 2, 50, pal.lo); R(x - 2, 27, 13, 4, pal.hi); for (let y = 36; y < 78; y += 7) R(x + 2, y, 5, 1, pal.lo); }
  R(0, 80, W, 17, pal.ledge); R(0, 80, W, 2, pal.lhi); for (let x = 0; x < W; x += 6 + Math.floor(r() * 6)) R(x, 83 + Math.floor(r() * 10), 3, 1, pal.lo);
  for (const kx of [6, 30, 92, 120]) for (let j = 0; j < 16; j++) { const xx = kx + Math.round(Math.sin(j / 3 + kx) * 1.3); R(xx, 80 - j, 1, 1, pal.moss); if (j % 4 === 2) R(xx + 1, 80 - j, 1, 1, pal.moss); }
}
function hex(c) { return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }

/* a tiny rune glyph for the bubbles */
function runeCanvas(seed) { const c = document.createElement('canvas'); c.width = 8; c.height = 8; c.className = 'px'; const R = pen(c.getContext('2d')), r = rng(seed);
  R(1, 1, 6, 6, '#c9a64a'); R(2, 2, 4, 4, '#ffd56a'); R(3 + Math.floor(r() * 2), 2, 1, 4, '#5a3d10'); R(2, 3 + Math.floor(r() * 2), 4, 1, '#5a3d10'); return c; }

/* ---------- stained-glass star, Voronoi pieces with lead lines, pentagram sigil ---------- */
const GLASS = {
  rose:  { starLit: ['#ffd56a', '#ffb347', '#f2803a', '#ffe9a0', '#e8a23a'], ringLit: ['#2d4fb8', '#5a2d9a', '#1f7ab0', '#7a2a6a', '#3b3fc0'], seeds: 34, ring: true, sigil: 'gold', rays: 5, inner: .42 },
  sigil: { starLit: ['#5ef2a0', '#3fd38a', '#9af7c6', '#2fae84', '#c8ffe0'], ringLit: ['#14506a', '#1f3f7a', '#0e6a5e', '#2b2a6e', '#155a8a'], seeds: 30, ring: true, sigil: 'heavy', rays: 5, inner: .5, circle: true },
  shard: { starLit: ['#e0405a', '#b8322a', '#ff7a6a', '#8a2a8a', '#ffb0a0', '#ffd56a'], ringLit: [], seeds: 26, ring: false, sigil: 'small', rays: 8, inner: .36 }
};
function starPoly(cx, cy, R1, R2, n, rot) { const p = []; for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, rr = i % 2 ? R2 : R1; p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } return p; }
function inPoly(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function darken(c, k) { const A = hex(c); return 'rgb(' + A.map((v) => Math.round(v * k + 8)).join(',') + ')'; }
function makeGlass(style, seed) {
  const g = GLASS[style], S = 48, r = rng(seed), cx = S / 2, cy = S / 2 + 1;
  const star = starPoly(cx, cy, 22, 22 * g.inner, g.rays, -Math.PI / 2);
  const seeds = []; while (seeds.length < g.seeds) { const x = 1 + r() * (S - 2), y = 1 + r() * (S - 2); const ins = inPoly(x, y, star); const d = Math.hypot(x - cx, y - cy); if (ins || (g.ring && d < 23)) seeds.push({ x, y, ins }); }
  const id = new Int16Array(S * S).fill(-1), zone = new Int8Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const px = x + .5, py = y + .5, ins = inPoly(px, py, star), d = Math.hypot(px - cx, py - cy);
    if (!ins && !(g.ring && d < 23.5)) continue; zone[y * S + x] = ins ? 1 : 2; let best = 1e9, bi = -1;
    seeds.forEach((s, i) => { if (s.ins !== ins) return; const dd = (s.x - px) ** 2 + (s.y - py) ** 2; if (dd < best) { best = dd; bi = i; } }); id[y * S + x] = bi; }
  const cols = seeds.map((s) => { const pal = s.ins ? g.starLit : g.ringLit; return pal[Math.floor(r() * pal.length)]; });
  // lighting order: star pieces from the centre outward, then the surround
  const order = seeds.map((s, i) => i).sort((a, b) => (seeds[a].ins === seeds[b].ins ? Math.hypot(seeds[a].x - cx, seeds[a].y - cy) - Math.hypot(seeds[b].x - cx, seeds[b].y - cy) : seeds[a].ins ? -1 : 1));
  const rank = new Int16Array(seeds.length); order.forEach((i, k) => { rank[i] = k; });
  const sig = []; if (g.sigil) { const pts = starPoly(cx, cy, g.sigil === 'small' ? 7 : 11, 0, 5, -Math.PI / 2).filter((_, i) => i % 2 === 0); for (let i = 0; i < 5; i++) line(pts[i], pts[(i + 2) % 5], sig); if (g.circle) for (let a = 0; a < 64; a++) sig.push([Math.round(cx + Math.cos(a / 64 * 6.283) * 12), Math.round(cy + Math.sin(a / 64 * 6.283) * 12)]); }
  return { S, id, zone, cols, rank, n: seeds.length, sig, style };
}
function line(a, b, out) { let [x0, y0] = a.map(Math.round), [x1, y1] = b.map(Math.round); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (;;) { out.push([x0, y0]); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }
// lit = how many pieces glow (0..n); flash = a piece rank shown white-hot
function paintGlass(cv, G, lit, flash) {
  const S = G.S; cv.width = S; cv.height = S; const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S), d = img.data;
  const rgbCache = {};
  const rgb = (c) => rgbCache[c] || (rgbCache[c] = c[0] === '#' ? hex(c) : c.match(/\d+/g).map(Number));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const k = y * S + x, i = G.id[k]; if (i < 0) continue; const o = k * 4;
    const lead = x === 0 || y === 0 || x === S - 1 || y === S - 1 || G.id[k - 1] !== i || G.id[k + 1] !== i || G.id[k - S] !== i || G.id[k + S] !== i;
    let c;
    if (lead) c = [18, 16, 14];
    else { const on = G.rank[i] < lit; c = rgb(G.cols[i]); if (G.rank[i] === flash) c = [255, 250, 225]; else if (!on) c = c.map((v) => Math.round(v * .22 + 10)); else { const sh = ((x + y) % 7 === 0) ? 1.18 : 1; c = c.map((v) => Math.min(255, Math.round(v * sh))); } }
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }

}

/* ---------- a stage: backdrop, Ulhu, vial, plaque ---------- */
function makeStage(host, o) {
  host.innerHTML = '';
  const st = { host };
  st.cam = spawn(host, 'cam');
  st.bg = el('canvas', 'bg px'); st.cam.appendChild(st.bg); drawBg(st.bg, PAL[o.pal || 'shallows'], o.seed);
  st.back = spawn(st.cam, 'fx');
  st.ulhu = spawn(st.cam, 'ulhu', '', '<img class="px" alt="Ulhu">'); st.img = st.ulhu.querySelector('img'); st.mood = (m) => { st.img.src = ULHU[m]; }; st.mood(o.mood || 'idle');
  st.vial = spawn(st.cam, 'vial', '', '<i></i>'); st.fill = st.vial.firstChild; st.hpl = spawn(st.cam, 'hpl');
  st.setHp = (hp) => { st.fill.style.height = (hp / 60 * 100) + '%'; st.hpl.textContent = hp + '/60'; };
  st.setHp(o.hp == null ? 60 : o.hp);
  st.plq = spawn(st.cam, 'plq', '', '<span class="num"></span><div class="ttl"></div><i class="crk"></i>'); st.num = st.plq.querySelector('.num'); st.ttl = st.plq.querySelector('.ttl');
  st.num.textContent = o.num || 'VII'; st.ttl.textContent = o.ttl || 'Tide Caller';
  st.fx = spawn(host, 'fx');

const main = document.getElementById('main');
function section(title, intro) { main.appendChild(el('h2', '', title)); main.appendChild(el('p', 'gi', intro)); }
function card(id, name, cap, stageOpts, buttons, extra) {
  const c = el('section', 'card'); c.innerHTML = '<h3><b>' + id + '</b>' + name + '</h3><p class="cap">' + cap + '</p>';
  const stage = spawn(c, 'stage'); const ex = extra ? spawn(c, '') : null; const bt = spawn(c, 'btns'); main.appendChild(c);
  let tl = null; const ctx = { ex };
  const run = (play) => { if (tl) tl.kill(); stage.innerHTML = ''; const st = makeStage(stage, stageOpts); tl = new TL(); const t = tl; play(st, t, ctx).catch((e) => { if (e !== STOP) console.error(e); }); };
  buttons.forEach(([label, play], i) => { const b = el('button', i ? 'alt' : '', label); b.type = 'button'; b.onclick = () => run(play); bt.appendChild(b); });
  if (extra) extra(ctx); ctx.first = () => run(buttons[0][1]); cards.push(ctx); return ctx;
}
