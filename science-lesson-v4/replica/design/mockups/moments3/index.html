<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ulhu Big Moments III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* One dark look by design (the drowned temple). Every theme hook repeats the same dark tokens. */
:root{color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298;--sea:#5ef2a0;--honey:#ffd56a;--wax:#b8322a;
--gx:'Grenze Gotisch',Georgia,serif;--ax:'Atkinson Hyperlegible',system-ui,sans-serif;--fx:'IM Fell English',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298}}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark;--bg:#0a100e;--panel:#101a17;--line:#24443a;--fg:#e8e1cf;--muted:#8fa298}
*{box-sizing:border-box}
html,body{margin:0;background:#0a100e;color:#e8e1cf;font:15px/1.45 var(--ax)}
main{max-width:412px;margin:0 auto;padding:16px}
h1{font:700 30px/1.1 var(--gx);color:#ffd56a;margin:4px 0 6px}
h2{font:700 24px/1.1 var(--gx);color:#5ef2a0;margin:28px 0 4px}
.intro,.gi{color:#8fa298;margin:0 0 10px}
.card{background:#101a17;border:1px solid #24443a;border-radius:10px;padding:10px;margin:14px 0}
.card h3{margin:0 0 2px;font:700 18px var(--ax);color:#e8e1cf}.card h3 b{color:#ffd56a;margin-right:6px}
.cap{margin:0 0 8px;color:#b9c4bc;font-size:14px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font:700 14px var(--ax);color:#0a100e;background:#5ef2a0;border:0;border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer}
button.alt{background:#2a3d36;color:#e8e1cf}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
/* stage */
.stage{position:relative;height:290px;border-radius:8px;overflow:hidden;background:#02070a;border:1px solid #0d1f19}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.cam>canvas.bg{position:absolute;inset:0;width:100%;height:100%}
.ulhu{position:absolute;left:calc(50% - 48px);bottom:22px;width:96px;height:96px;transform-origin:50% 85%}
.ulhu img{width:96px;height:96px;display:block}
.vial{position:absolute;left:14px;top:14px;width:30px;height:52px;border:3px solid #cfe9df;border-top-width:5px;border-radius:3px 3px 8px 8px;background:#06110d;overflow:hidden}
.vial i{position:absolute;left:0;right:0;bottom:0;height:100%;background:repeating-linear-gradient(0deg,#3fd38a 0 3px,#5ef2a0 3px 6px);box-shadow:0 0 10px #5ef2a0}
.vial.cr{border-color:#7d8f88}
.hpl{position:absolute;left:8px;top:70px;width:44px;text-align:center;font:700 11px var(--ax);color:#cfe9df;text-shadow:0 1px 0 #000}
.plq{position:absolute;right:12px;top:12px;width:132px;padding:6px 6px 7px;text-align:center;background:linear-gradient(#2b3a34,#18231f);border:2px solid #0a120f;box-shadow:inset 0 0 0 2px #3d5249,0 3px 0 #050a08}
.plq .num{font:700 30px/1 var(--gx);color:#ffd56a;text-shadow:0 2px 0 #000;position:relative;display:inline-block;min-width:40px}
.plq .ttl{font:italic 13px var(--fx);color:#e8e1cf}
.plq .crk{position:absolute;inset:0;opacity:0;background:linear-gradient(115deg,transparent 46%,#050a08 47% 49%,transparent 50%),linear-gradient(60deg,transparent 60%,#050a08 61% 62%,transparent 63%)}
.fx{position:absolute;inset:0;pointer-events:none}
.say{position:absolute;left:10px;right:10px;bottom:8px;padding:6px 10px;background:#e9dbb4;color:#2a1a12;font:italic 14px/1.3 var(--fx);border-radius:3px;opacity:0;box-shadow:0 2px 0 #000;z-index:5}
.lab{position:absolute;left:0;right:0;top:44%;text-align:center;font:italic 17px var(--fx);color:#e8e1cf;opacity:0;text-shadow:0 2px 6px #000}
.mote{position:absolute;width:4px;height:4px;background:#5ef2a0;box-shadow:0 0 6px #5ef2a0}
/* faint */
.shard{position:absolute;width:5px;height:5px;background:rgba(220,245,235,.9)}
.ink{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,#03110b 0 40%,rgba(10,40,26,.95) 60%,rgba(40,120,80,0) 72%);transform:scale(0)}
.rbub{position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(200,255,230,.55);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(120,200,170,.08) 60%);display:grid;place-items:center}
.rbub canvas{width:16px;height:16px}
.dawn{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,110,.55),rgba(255,170,80,.18) 45%,transparent 70%);opacity:0;mix-blend-mode:screen}
/* The Call panel with the three stars */
.call{margin-top:8px;padding:10px;background:#0c1512;border:1px solid #24443a;border-radius:8px}
.call .hd{font:700 15px var(--gx);color:#8fa298;letter-spacing:.08em;text-align:center;margin-bottom:6px}
.stars{display:flex;justify-content:space-around;align-items:center}
.stars canvas{width:96px;height:96px;transition:filter .6s}
.stars canvas.on{filter:drop-shadow(0 0 8px var(--g,rgba(255,215,140,.75)))}
.rits{margin-top:8px;display:grid;gap:5px}
.rit{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#142420;border:1px solid #24443a;border-radius:5px;font-size:14px}
.rit .sk{width:16px;height:16px;border:2px solid #5d7a70;border-radius:3px}
.rit.on{background:#1b3a2e;border-color:#5ef2a0}.rit.on .sk{background:#5ef2a0;border-color:#5ef2a0}
.back{margin-top:6px;text-align:center;font:italic 14px var(--fx);color:#ffd56a;min-height:20px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.states div{text-align:center;font-size:12px;color:#8fa298}
.states .row{display:flex;justify-content:center;gap:1px}
.states canvas{width:28px;height:28px}
.states canvas.on{filter:drop-shadow(0 0 3px rgba(255,215,140,.8))}
/* gate */
.gate{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.door{position:absolute;top:0;bottom:0;width:50%}
.door.l{left:0;border-right:2px solid #000}.door.r{right:0;border-left:2px solid #000}
.door canvas{width:100%;height:100%;display:block}
.arch{position:absolute;left:14px;right:14px;top:84px;text-align:center;padding:10px 6px;background:rgba(0,0,0,.62);border:1px solid var(--gc);box-shadow:0 0 24px var(--gc);opacity:0;z-index:2}
.arch .dn{font:700 12px var(--ax);letter-spacing:.3em;color:var(--gt)}
.arch .dt{font:700 32px/1 var(--gx);color:#fff;text-shadow:0 0 14px var(--gc),0 2px 0 #000;margin-top:4px}
.arch .dm{font:italic 13px var(--fx);color:rgba(255,255,255,.85);margin-top:4px}
.seam{position:absolute;top:0;bottom:0;left:calc(50% - 2px);width:4px;transform-origin:50% 0;opacity:0;z-index:1}
.flood{position:absolute;inset:0;opacity:0}
.bub{position:absolute;width:6px;height:6px;border-radius:50%;border:1px solid rgba(255,240,200,.8);background:rgba(255,230,160,.25)}
.wave{position:absolute;top:0;bottom:0;left:50%;width:30px;margin-left:-15px;border-left:3px solid rgba(200,255,230,.85);border-right:3px solid rgba(200,255,230,.85);box-shadow:0 0 18px rgba(94,242,160,.7),inset 0 0 18px rgba(94,242,160,.5);opacity:0}
.spark{position:absolute;width:3px;height:3px;background:#fff3c0;box-shadow:0 0 4px #ffcf5a}
</style>
</head>
<body>
<main id="main">
<h1>Ulhu's Big Moments, round three</h1>
<p class="intro">Variations of the two picks. FA2-a without the pentagram: each version gives the stars a different heart and a slightly different window. DP3-b with the doors sliding in from the sides, as in the first DP3. Press Replay on any card.</p>
</main>

    extra(st, t) { for (let i = 0; i < 18; i++) { const b = spawn(st.fx, 'bub', 'left:' + (150 + (i * 37) % 112) + 'px;top:' + (260 - (i * 13) % 40) + 'px'); t.a(b, [{ transform: 'translate(0,0) scale(.5)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: 'translate(' + ((i % 2 ? 1 : -1) * (20 + i * 6)) + 'px,-240px) scale(1.3)', opacity: 0 }], 1800, { delay: i * 50, ease: 'ease-out' }); } } },
  b3: { carve: 'runes', stone: ['#223029', '#2e3e36', '#0e1612', '#172119'], carveCol: '#5ef2a0', glow: 'rgba(94,242,160,.8)', text: '#9af7c6', blade: '#d8ffe9',
    flood: 'linear-gradient(90deg,transparent,rgba(120,240,190,.55) 30%,rgba(210,255,235,.85) 50%,rgba(120,240,190,.55) 70%,transparent)', line: 'The runes burned green and the sea came through. Depth II.',
    extra(st, t, gt) { const w = spawn(gt.g, 'wave'); t.a(w, [{ opacity: 1, transform: 'scaleX(.2)' }, { opacity: .8, transform: 'scaleX(14)' }], 1300, { ease: 'ease-out' }); t.a(w, [{ opacity: .8 }, { opacity: 0 }], 500, { delay: 1100 }); } }
};

/* ---------- cards ---------- */
const main = document.getElementById('main');
const cards = [];
function section(title, intro) { main.appendChild(el('h2', '', title)); main.appendChild(el('p', 'gi', intro)); }
function card(id, name, cap, stageOpts, buttons, extra) {
  const c = el('section', 'card'); c.id = id; c.innerHTML = '<h3><b>' + id + '</b>' + name + '</h3><p class="cap">' + cap + '</p>';
  const stage = spawn(c, 'stage'); const ex = extra ? spawn(c, '') : null; const bt = spawn(c, 'btns'); main.appendChild(c);
  let tl = null; const ctx = { ex };
  const run = (play) => { if (tl) tl.kill(); stage.innerHTML = ''; const st = makeStage(stage, stageOpts); tl = new TL(); const t = tl; play(st, t, ctx).catch((e) => { if (e !== STOP) console.error(e); }); };
  buttons.forEach(([label, play], i) => { const b = el('button', i ? 'alt' : '', label); b.type = 'button'; b.onclick = () => run(play); bt.appendChild(b); });
  if (extra) extra(ctx); ctx.first = () => run(buttons[0][1]); cards.push(ctx); return ctx;
}
section('Faint: FA2-a without the pentagram', 'All three keep the gold dawn recovery, the rose window stars lighting piece by piece, and the 0 to 3 star strip. Only the heart of each star and the window colours change.');
const FAV = [
  ['a1', 'jewel', 'Jewel heart', 'A cut gold jewel sits in each star and blazes white when the last piece lights; gold star in a blue and violet rose window, as before.', 101, '#ffd56a', 'Warm again. Not whole yet. Same again tomorrow.'],
  ['a2', 'eye', 'Ulhu\'s eye', 'Ulhu\'s own sea-green slit eye opens in each star as it fills; amber star in a teal and emerald window, with green motes in the dawn.', 202, '#9af7c6', 'Three eyes open. I see the way back. Tomorrow, three more.'],
  ['a3', 'moon', 'Crescent moon', 'A pale crescent moon on a night-blue disc, a small star in its arms; rose-gold star in a deep plum and wine window, with rose motes in the dawn.', 303, '#ffc0a0', 'Three moons risen over me. Half way home tomorrow.']
];
FAV.forEach(([v, style, name, cap, seed, mote, line]) => {
  card('FA2-' + v, name, cap, { hp: 60 }, [['Replay faint', faint], ['Replay recovery', (st, t, ctx) => recover(st, t, ctx.call, mote, line)]], (ctx) => {
    const callHost = spawn(ctx.ex, 'call'); ctx.call = buildCall(callHost, style, seed);
    const s = spawn(ctx.ex, ''); buildStates(s, style, seed);
  });
});
section('Depth passed: DP3-b with side doors', 'The stone doors slide in from left and right and meet in the middle, the depth name glows, a blade of light opens down the seam, then they part on the flood and the plaque is struck in.');
card('DP3-b1', 'Spiral doors, white blade', 'Grey doors carved with pale wave spirals slam shut from the sides; a white blade splits them and pale blue water floods through.', { pal: 'shallows', num: 'X', ttl: 'Abyss Apprentice' }, [['Replay', (st, t) => gate(st, t, GATES.b1)]]);
card('DP3-b2', 'Kraken doors, gold blade', 'Brown doors meet to form one gold kraken eye with tentacles; a gold blade cuts the pupil and warm water rushes in with bubbles.', { pal: 'shallows', num: 'X', ttl: 'Abyss Apprentice' }, [['Replay', (st, t) => gate(st, t, GATES.b2)]]);
card('DP3-b3', 'Rune doors, sea-green blade', 'Mossy doors lined with sea-green runes slide shut; a green blade opens and a bright wave front rolls outward as they part.', { pal: 'shallows', num: 'X', ttl: 'Abyss Apprentice' }, [['Replay', (st, t) => gate(st, t, GATES.b3)]]);
window.addEventListener('load', () => cards.forEach((c) => c.first()));
})();
</script>
