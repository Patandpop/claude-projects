<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shattered Day Blocks</title>
<style>
:root{color-scheme:dark;--bg:#0a0d14;--card:#10141d;--ink:#e8ebf2;--mute:#9ca3b4;--line:#222838;--lightg:#f3e3b8;--focus:#9fd7ff}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:15px/1.45 system-ui,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 50% -10%,#1a2033,var(--bg) 60%) fixed;overflow-x:hidden}
main{max-width:412px;margin:0 auto;padding:16px;box-sizing:border-box}
h1{font:700 28px/1.05 Georgia,serif;margin:0 0 6px;color:var(--lightg);text-shadow:0 0 18px rgba(240,210,150,.3)}
p{margin:4px 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:16px}
.card h3{font:700 17px/1.15 Georgia,serif;margin:0;color:var(--ink)}
.code{display:inline-block;font:700 11px system-ui,sans-serif;letter-spacing:.06em;color:#0b0d12;background:var(--lightg);border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.cap{font-size:13px;color:var(--mute);margin:3px 0 0}
.chooser{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chooser button{min-height:32px;padding:0 11px;border-radius:16px;border:1.5px solid #333b52;background:#151a26;font:700 12.5px system-ui,sans-serif;color:#d0d5e0;cursor:pointer}
.chooser button[aria-pressed="true"]{border-color:#c9a24a;background:#2a2410;color:var(--lightg)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.wall{display:block;width:100%;max-width:360px;height:auto;margin:10px auto 0;touch-action:manipulation}
svg .pc{cursor:pointer}
.info{min-height:20px;margin-top:8px;padding:6px 9px;border-radius:7px;background:#0b0e15;border:1px solid #1f2535;font-size:13px;color:#d6dbe6}
.info b{color:var(--lightg)}
.legend{display:flex;gap:10px;align-items:center;margin-top:8px}
.legend>svg{flex:none;width:112px;height:112px}
.key{display:grid;grid-template-columns:1fr;gap:3px;font-size:12px;color:#c4cad6;flex:1}
.key span{display:flex;align-items:center;gap:6px}
.key svg{flex:none}
.how{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Shattered day blocks</h1>
<p class="mute">Two made-up weeks, one stained-glass block per day. Every lesson is an inner piece and its homework an outer piece, each broken into small leaded shards. Tap any shard.</p>
<div id="cards"></div>
</main>

<script>
/* ---------- made-up two weeks (periods 1 to 5), same data as wall4 ---------- */
const DAYS=['Mon 2 Nov','Tue 3 Nov','Wed 4 Nov','Thu 5 Nov','Fri 6 Nov','Mon 9 Nov','Tue 10 Nov','Wed 11 Nov','Thu 12 Nov','Fri 13 Nov'];
const DL=['M','T','W','T','F'];
const SCHED=[
 [[1,'9AS'],[2,'10S2'],[3,'12C'],[5,'7MLA']],
 [[1,'11S2'],[3,'12C'],[5,'8XP']],
 [[1,'13D'],[4,'9XS']],
 [[1,'10C2'],[2,'8AG'],[3,'11S2'],[4,'9AS'],[5,'13D']],
 [[1,'12C'],[4,'7MLA'],[5,'10S2']],
 [[2,'9XS'],[3,'10S2'],[5,'8XP']],
 [[1,'11S2'],[2,'13D'],[4,'12C'],[5,'7MLA']],
 [[2,'12C'],[5,'9AS']],
 [[1,'10C2'],[2,'8AG'],[3,'11S2'],[4,'9XS'],[5,'13D']],
 [[2,'13D'],[4,'10S2'],[5,'9AS']]
];
const NOHW=new Set(['0-5','1-5','4-4','5-5','6-5','8-2']);
const LESSONS=[];
SCHED.forEach((d,di)=>d.forEach(([p,c])=>LESSONS.push({day:di,per:p,cls:c,needHw:!NOHW.has(di+'-'+p),i:LESSONS.length})));
const N=LESSONS.length;
const CLASSCOL={'7MLA':'#ff7a5c','8XP':'#f2a541','8AG':'#f5d142','9AS':'#7fd36b','9XS':'#3fcf8a','10C2':'#3fd6c6','10S2':'#3fb4e8','11S2':'#6a8cff','12C':'#b98bff','13D':'#e870d8'};
const STATES={behind:'Behind',track:'On track',ahead:'Well ahead'};
function statusFor(s){return LESSONS.map(l=>{
  let b,h;
  if(s==='ahead'){b=true;h=true;}
  else if(s==='track'){if(l.day<5){b=true;h=true}else{const k=l.i-LESSONS.findIndex(x=>x.day>=5);b=k<9;h=k<5}}
  else{b=l.i<7;h=l.i<4}
  return {built:b,hw:l.needHw?(h&&b?'set':'needed'):'none'}})}

/* ---------- geometry helpers ---------- */
const S=64,GAP=8,TOP=13,ROWGAP=8,C=S/2;
const f=n=>(+n).toFixed(2);
const P=(r,a)=>[C+r*Math.cos(a),C+r*Math.sin(a)];
const DEG=Math.PI/180;
const ANGC=k=>-Math.PI/2+k*72*DEG; // centre angle of period k (0 = P1, at 12 o'clock), clockwise
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s/2)}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}
// keep the side of a line (point o, normal n) where (p-o).n >= 0
function clipHalf(poly,o,n){const out=[],d=q=>(q[0]-o[0])*n[0]+(q[1]-o[1])*n[1];
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=d(a),db=d(b);
    if(da>=0)out.push(a);
    if((da>=0)!==(db>=0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
  return out}
function split(poly,o,n){return[clipHalf(poly,o,n),clipHalf(poly,o,[-n[0],-n[1]])]}
// break a piece into about k shards with straight leaded cuts (largest shard cut each time)
function shatter(poly,k,r,minA){let ps=[poly];minA=minA||5;
  for(let i=0,tries=0;i<k-1&&tries<40;tries++){ps.sort((a,b)=>area(b)-area(a));const big=ps[0],c=centroid(big);
    const o=[c[0]+(r()-.5)*3,c[1]+(r()-.5)*3],a=r()*Math.PI,[A,B]=split(big,o,[Math.cos(a),Math.sin(a)]);
    if(A.length>2&&B.length>2&&area(A)>minA&&area(B)>minA){ps[0]=A;ps.push(B);i++}}
  return ps}
// cut a ring sector into shards with radial cuts (keeps the curved shape honest)
function ringShards(r0,r1,a1,a2,k,r,seg){const cuts=[a1];for(let i=1;i<k;i++)cuts.push(a1+(a2-a1)*(i+(r()-.5)*.6)/k);cuts.push(a2);
  const out=[];for(let i=0;i<k;i++)out.push(ringPoly(r0,r1,cuts[i],cuts[i+1],seg||3));return out}
function arcPts(r,a1,a2,n){const o=[];for(let i=0;i<=n;i++)o.push(P(r,a1+(a2-a1)*i/n));return o}
function ringPoly(r0,r1,a1,a2,n){return arcPts(r1,a1,a2,n).concat(arcPts(r0,a2,a1,n))}
function edgePt(a){const c=Math.cos(a),s=Math.sin(a),h=S/2,t=Math.min(Math.abs(c)>1e-9?h/Math.abs(c):1e9,Math.abs(s)>1e-9?h/Math.abs(s):1e9);return[C+c*t,C+s*t]}
function cornersBetween(a1,a2){const out=[];[[S,S,45],[0,S,135],[0,0,225],[S,0,315]].forEach(([x,y,a])=>{let aa=a*DEG;while(aa<a1)aa+=2*Math.PI;if(aa<a2)out.push([aa,x,y])});return out.sort((p,q)=>p[0]-q[0]).map(p=>[p[1],p[2]])}
// region between a circle of radius r0 and the square edge, between two angles
function skySector(r0,a1,a2){return[P(r0,a1),edgePt(a1)].concat(cornersBetween(a1,a2),[edgePt(a2)],arcPts(r0,a2,a1,4))}
function mixHex(a,b,t){const A=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),B=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return '#'+A.map((v,i)=>Math.max(0,Math.min(255,Math.round(v+(B[i]-v)*t))).toString(16).padStart(2,'0')).join('')}
// each shard its own slightly different tint, like real cathedral glass
function tint(col,r,amt){const t=(r()-.5)*2*(amt||.16);return t>0?mixHex(col,'#ffffff',t):mixHex(col,'#000000',-t)}

/* ---------- what colour a period's piece is ---------- */
function partState(v,st,d,p,part){const l=LESSONS.find(x=>x.day===d&&x.per===p);
  if(!l)return part==='lesson'?{col:v.free,on:'calm'}:{col:v.noHw,on:'calm'};
  const s=st[l.i];
  if(part==='lesson')return s.built?{col:CLASSCOL[l.cls],on:true}:{col:v.unlit,on:false};
  if(s.hw==='set')return{col:v.hwSet,on:true};
  if(s.hw==='none')return{col:v.noHw,on:'calm'};
  return{col:v.unlit,on:false}}

/* ============ WD-1: the moon ============ */
const M={R:23.5,RI:15,RIM:2.8};
function moonBlock(v,st,d){const sh=[],r=rng(1000+d*31),R=M.R,RO=R+M.RIM;
  // night sky around the moon, broken into many shards; a gold notch above P1
  const rays=[];for(let i=0;i<14;i++)rays.push(-90*DEG+7*DEG+i*(360/14)*DEG+(i?(r()-.5)*.18:0));
  // notch: narrow gold piece straight above 12 o'clock
  sh.push({pts:[P(RO,-97*DEG),edgePt(-97*DEG),edgePt(-83*DEG),P(RO,-83*DEG)],col:v.notch,kind:'fill',on:true});
  const start=-83*DEG,end=-97*DEG+2*Math.PI,sk=[start];for(let i=1;i<12;i++)sk.push(start+(end-start)*(i+(r()-.5)*.5)/12);sk.push(end);
  for(let i=0;i<12;i++){const piece=skySector(RO,sk[i],sk[i+1]);
    shatter(piece,2,r,8).forEach(q=>{const star=r()<.07;sh.push({pts:q,col:star?'#cfd6ea':tint(v.sky[(i+d)%v.sky.length],r,.12),kind:'fill',on:star?'calm':false})})}
  // rim of the moon: lit silver on the right, earthshine shadow on the left (crescent), cut with every wedge
  for(let k=0;k<5;k++){const a=ANGC(k);for(let j=0;j<3;j++){const a1=a-36*DEG+j*24*DEG,a2=a1+24*DEG,mid=(a1+a2)/2;
    const lit=Math.cos(mid-(-20*DEG));// light from the upper right
    const col=k===0&&j===1?v.notch:(lit>0?mixHex(v.rimLit,v.rimDark,.5-lit*.5):v.rimDark);
    sh.push({pts:ringPoly(R,RO,a1,a2,3),col:tint(col,r,.06),kind:'fill',on:lit>0||k===0&&j===1})}}
  // the five period wedges: lesson in the middle, homework round the outside
  for(let k=0;k<5;k++){const p=k+1,a1=ANGC(k)-36*DEG,a2=ANGC(k)+36*DEG;
    const L=partState(v,st,d,p,'lesson'),H=partState(v,st,d,p,'hw');
    const les=[[C,C]].concat(arcPts(M.RI,a1,a2,3));
    sh.push({heavy:1,pts:les},{heavy:1,pts:ringPoly(M.RI,R,a1,a2,6)});
    const ls=shatter(les,4,r,6),craterL=Math.floor(r()*ls.length);
    ls.forEach((q,i)=>sh.push({pts:q,col:moonTint(L,r,i===craterL),kind:'lesson',p,on:L.on}));
    const hs=[];ringShards(M.RI,R,a1,a2,3,r,2).forEach(q=>shatter(q,2,r,5).forEach(z=>hs.push(z)));
    const craterH=Math.floor(r()*hs.length);
    hs.forEach((q,i)=>sh.push({pts:q,col:moonTint(H,r,i===craterH),kind:'hw',p,on:H.on}))}
  return sh}
function moonTint(s,r,crater){let c=s.on===true?mixHex(s.col,'#f4f1ff',.22):s.col; // moonlight paling
  if(crater)c=mixHex(c,'#000000',s.on?.32:.25);return tint(c,r,.13)}
function moonLabel(p){return P(M.R+M.RIM+5.5,ANGC(p-1))}

/* ============ WD-2: the star ============ */
const ST={RO:29.5,RV:12,RC:15.5};
function starGeo(k){const a=ANGC(k),tip=P(ST.RO,a),vL=P(ST.RV,a-36*DEG),vR=P(ST.RV,a+36*DEG);
  // cross-cut perpendicular to the point's axis at radius RC
  const o=P(ST.RC,a),n=[Math.cos(a),Math.sin(a)];
  const kite=[[C,C],vL,tip,vR],[outer,les]=split(kite,o,n);
  return{tip,vL,vR,outer,les}}
function orderPoly(pts){const c=centroid(pts);return pts.slice().sort((a,b)=>Math.atan2(a[1]-c[1],a[0]-c[0])-Math.atan2(b[1]-c[1],b[0]-c[0]))}
function starBlock(v,st,d){const sh=[],r=rng(2000+d*17);
  const G=[0,1,2,3,4].map(starGeo);
  // background glass between the points, each valley halved by a radial lead, then shattered
  for(let k=0;k<5;k++){const g=G[k],g2=G[(k+1)%5],a1=ANGC(k),a2=ANGC(k)+72*DEG,am=(a1+a2)/2,vv=P(ST.RV,am);
    const half1=[g.tip,edgePt(a1)].concat(cornersBetween(a1,am),[edgePt(am),vv]);
    const half2=[vv,edgePt(am)].concat(cornersBetween(am,a2),[edgePt(a2),g2.tip]);
    [half1,half2].forEach((h,hi)=>{
      if(k===0&&hi===0||k===4&&hi===1){ // split off the gold notch above P1's tip
        const ax=k===0?1:-1,o=[C+ax*2.6,0],[keep,gold]=split(h,o,[ax,0]);
        if(gold.length>2)sh.push({pts:gold,col:v.notch,kind:'fill',on:true});h=keep}
      shatter(h,4,r,6).forEach(q=>sh.push({pts:q,col:tint(v.sky[(k*2+hi+d)%v.sky.length],r,.12),kind:'fill',on:false}))})}
  for(let k=0;k<5;k++){const p=k+1,g=G[k],L=partState(v,st,d,p,'lesson'),H=partState(v,st,d,p,'hw');
    sh.push({heavy:1,pts:g.les},{heavy:1,pts:g.outer});
    shatter(g.les,4,r,4).forEach(q=>sh.push({pts:q,col:tint(L.on===true?mixHex(L.col,'#fff8e8',.12):L.col,r,.15),kind:'lesson',p,on:L.on}));
    shatter(g.outer,3,r,3).forEach(q=>sh.push({pts:q,col:tint(H.col,r,.12),kind:'hw',p,on:H.on}))}
  // the heart of the star: a small gold boss where the five lessons meet
  return sh}
function starLabel(p){return P(ST.RO+3.2,ANGC(p-1))}

/* ============ WD-3: the lancet (periods read top to bottom) ============ */
const LN={x0:11,x1:53,top:3,spring:20,bot:62,rows:[3,17,29,40.5,51.5,62],lx0:21,lx1:43};
function lancetOutline(){const pts=[];// pointed gothic arch, convex
  for(let i=0;i<=6;i++){const t=i/6;pts.push([LN.x0+(C-LN.x0)*(1-Math.cos(t*Math.PI/2)),LN.spring-(LN.spring-LN.top)*Math.sin(t*Math.PI/2)])}
  for(let i=5;i>=0;i--){const q=pts[i];pts.push([2*C-q[0],q[1]])}
  pts.push([LN.x1,LN.bot],[LN.x0,LN.bot]);return pts}
const LOUT=lancetOutline();
function clipConvex(poly,clip){let out=poly;for(let i=0;i<clip.length&&out.length>2;i++){const a=clip[i],b=clip[(i+1)%clip.length];
  // keep the inside: clip polygon is ordered clockwise on screen
  out=clipHalf(out,a,[-(b[1]-a[1]),b[0]-a[0]])}return out}
function rect(x0,y0,x1,y1){return[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]}
function lancetBlock(v,st,d){const sh=[],r=rng(3000+d*13);
  // stone-dark glass around the window, cut in bands that line up with the rows
  const ys=[0,LN.rows[1],LN.rows[2],LN.rows[3],LN.rows[4],S];
  for(let side=0;side<2;side++){
    let reg=side===0?[[0,0],[C,0]].concat(LOUT.slice(0,7).reverse()).concat([[LN.x0,LN.bot],[LN.x0,S],[0,S]])
      :[[C,0],[S,0],[S,S],[LN.x1,S],[LN.x1,LN.bot]].concat(LOUT.slice(6,13).reverse());
    for(let i=0;i<5;i++){let band=clipHalf(clipHalf(reg,[0,ys[i]],[0,1]),[0,ys[i+1]],[0,-1]);if(band.length<3)continue;
      shatter(band,i===0?3:2,r,6).forEach(q=>sh.push({pts:q,col:tint(v.sky[(i+side*2+d)%v.sky.length],r,.12),kind:'fill',on:false}))}}
  // sill under the window
  sh.push({pts:rect(LN.x0,LN.bot,LN.x1,S),col:v.sill,kind:'fill',on:false});
  for(let p=1;p<=5;p++){const y0=LN.rows[p-1],y1=LN.rows[p],L=partState(v,st,d,p,'lesson'),H=partState(v,st,d,p,'hw');
    const les=clipConvex(rect(LN.lx0,y0,LN.lx1,y1),LOUT),hl=clipConvex(rect(LN.x0,y0,LN.lx0,y1),LOUT),hr=clipConvex(rect(LN.lx1,y0,LN.x1,y1),LOUT);
    [les,hl,hr].forEach(q=>{if(q.length>2)sh.push({heavy:1,pts:q})});
    if(les.length>2)shatter(les,p===1?3:4,r,5).forEach(q=>sh.push({pts:q,col:tint(L.on===true?mixHex(L.col,'#fff8e8',.1):L.col,r,.15),kind:'lesson',p,on:L.on}));
    [hl,hr].forEach(h=>{if(h.length>2&&area(h)>3)shatter(h,2,r,4).forEach(q=>sh.push({pts:q,col:tint(H.col,r,.12),kind:'hw',p,on:H.on}))})}
  // a gold boss at the apex marks the top (P1)
  sh.push({pts:[[C-2.6,0],[C+2.6,0],[C,LN.top]],col:v.notch,kind:'fill',on:true});
  return sh}
function lancetLabel(p){return[LN.x0-5,(LN.rows[p-1]+LN.rows[p])/2+(p===1?3:0)]}

/* ---------- the three directions ---------- */
const VARS=[
 {id:'WD-1',title:'The moon',cap:'A full moon through glass: silver rim lit on the right, earthshine crescent on the left, darker crater shards in every wedge. P1 sits under the gold notch at 12 o\'clock, then clockwise.',
  block:moonBlock,label:moonLabel,sky:['#121d3d','#18264d','#0f1834','#1d2d5a','#142044'],notch:'#e8b84a',rimLit:'#9aa6c2',rimDark:'#2c3346',
  free:'#7f97ab',noHw:'#8b84b4',hwSet:'#f3eedc',unlit:'#1a1d27'},
 {id:'WD-2',title:'The star',cap:'Five points, five periods. P1 is the top point under the gold notch, then clockwise. The inner half of a point is the lesson, its tip is the homework.',
  block:starBlock,label:starLabel,sky:['#271b47','#30205a','#1f163c','#3a2867','#2a1d4e','#221a42'],notch:'#e8b84a',
  free:'#8c90b2',noHw:'#a7809f',hwSet:'#f6f0fc',unlit:'#191621'},
 {id:'WD-3',title:'The lancet',cap:'A pointed church window. Periods read top to bottom like a timetable: P1 under the gold apex, P5 at the sill. Middle panel is the lesson, both side panels are its homework.',
  block:lancetBlock,label:lancetLabel,sky:['#0f2f2d','#143b37','#0c2624','#18463f','#11332f'],notch:'#f0a945',sill:'#2a2a2e',
  free:'#b4d8cf',noHw:'#93a87a',hwSet:'#fbefd2',unlit:'#151c1c'}
];

/* ---------- drawing: every shard is its own leaded piece ---------- */
const LEAD='#0a090c';
function pathD(pts){return 'M'+pts.map(q=>f(q[0])+' '+f(q[1])).join('L')+'Z'}
function blockSVG(v,st,d,uid){const sh=v.block(v,st,d);let g='',bloom='',lead='',heavy='';
  sh.forEach(s=>{const D=pathD(s.pts);if(s.heavy){heavy+=D;return}
    const attrs=s.kind==='fill'?'':' class="pc" data-d="'+d+'" data-p="'+s.p+'" data-part="'+s.kind+'"';
    const filt=s.on===false?' filter="url(#'+uid+'tex)"':'';
    const op=s.on==='calm'?' fill-opacity=".85"':'';
    g+='<path'+attrs+' d="'+D+'" fill="'+s.col+'"'+op+filt+'/>';
    if(s.on===true)bloom+='<path d="'+D+'" fill="'+s.col+'"/>';
    lead+=D});
  return{g,bloom,lead,heavy}}
function defsFor(uid){return '<filter id="'+uid+'tex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .58  0 0 0 0 .66  0 0 0 .2 0" result="c"/><feComposite in="c" in2="SourceGraphic" operator="in" result="t"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge></filter>'+
  '<filter id="'+uid+'bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>'}
function wallSVG(v,st,uid){const W=5*S+4*GAP,H=TOP+2*S+ROWGAP;let glass='',bloom='',lead='',labels='';
  for(let c=0;c<5;c++)labels+='<text x="'+(c*(S+GAP)+S/2)+'" y="9.5" text-anchor="middle" font-size="9" font-weight="700" fill="#aab2c4" font-family="system-ui,sans-serif">'+DL[c]+'</text>';
  for(let d=0;d<10;d++){const ox=(d%5)*(S+GAP),oy=TOP+(d>=5?S+ROWGAP:0),T='translate('+ox+' '+oy+')',b=blockSVG(v,st,d,uid);
    glass+='<g transform="'+T+'">'+b.g+'</g>';bloom+='<g transform="'+T+'">'+b.bloom+'</g>';
    lead+='<g transform="'+T+'"><path d="'+b.lead+'"/><path d="'+b.heavy+'" stroke-width="2.5"/><rect x="1" y="1" width="'+(S-2)+'" height="'+(S-2)+'" rx="1.5" stroke-width="2.4"/></g>'}
  return '<svg class="wall" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+v.title+' wall, two weeks"><defs>'+defsFor(uid)+'</defs>'+labels+glass+
   '<g filter="url(#'+uid+'bloom)" opacity=".45" style="mix-blend-mode:screen" pointer-events="none">'+bloom+'</g>'+
   '<g fill="none" stroke="'+LEAD+'" stroke-width="1.6" stroke-linejoin="round" pointer-events="none">'+lead+'</g><g class="sel" pointer-events="none"></g></svg>'}
// enlarged sample day with period numbers outside the glass: the "how to read" key
function legendSVG(v,uid){const st=statusFor('ahead'),b=blockSVG(v,st,3,uid);let nums='';
  for(let p=1;p<=5;p++){const q=v.label(p);nums+='<text x="'+f(q[0])+'" y="'+f(q[1]+2)+'" text-anchor="middle" font-size="6" font-weight="800" fill="#f3e3b8" font-family="system-ui,sans-serif" stroke="#0a0d14" stroke-width="1.6" paint-order="stroke">'+p+'</text>'}
  return '<svg viewBox="-8 -8 80 80" role="img" aria-label="Sample day, periods 1 to 5 numbered"><defs>'+defsFor(uid)+'</defs>'+b.g+
   '<g filter="url(#'+uid+'bloom)" opacity=".45" style="mix-blend-mode:screen">'+b.bloom+'</g><g fill="none" stroke="'+LEAD+'" stroke-width="1.4" stroke-linejoin="round"><path d="'+b.lead+'"/><path d="'+b.heavy+'" stroke-width="2.2"/><rect x="1" y="1" width="62" height="62" rx="1.5" stroke-width="2.2"/></g>'+nums+'</svg>'}
function swatch(fill,texture){return '<svg width="18" height="13" viewBox="0 0 18 13"><path d="M1 1H10L8 12H1Z" fill="'+fill+'" stroke="'+LEAD+'" stroke-width="1.5"/><path d="M10 1H17V12H8Z" fill="'+(texture?fill:mixHex(fill,'#ffffff',.18))+'" stroke="'+LEAD+'" stroke-width="1.5"/>'+(texture?'<path d="M3 4h3M11 8h3" stroke="#2a2f3c" stroke-width="1"/>':'')+'</svg>'}

function describe(d,p,part,st){const l=LESSONS.find(x=>x.day===d&&x.per===p);
  const base='<b>'+DAYS[d]+', P'+p;
  if(!l)return base+'</b>: free period ('+(part==='lesson'?'lesson piece':'homework piece')+').';
  const s=st[l.i];
  if(part==='lesson')return base+', '+l.cls+', lesson</b>: '+(s.built?'built.':'not built yet.');
  return base+', '+l.cls+', homework</b>: '+(s.hw==='set'?'homework set.':s.hw==='none'?'no homework needed.':'homework needed, not set yet.')}

const cards=document.getElementById('cards');
VARS.forEach((v,vi)=>{
  const card=document.createElement('section');card.className='card';card.id=v.id;
  card.innerHTML='<h3><span class="code">'+v.id+'</span>'+v.title+'</h3><p class="cap">'+v.cap+'</p><div class="chooser"></div><div class="wallbox"></div><div class="info">Tap a shard.</div>'+
   '<div class="legend">'+legendSVG(v,'L'+vi)+'<div class="key">'+
   '<span>'+swatch('#3fb4e8')+'Lesson built (class colour)</span>'+
   '<span>'+swatch(v.unlit,1)+'Not built / homework not set</span>'+
   '<span>'+swatch(v.hwSet)+'Homework set</span>'+
   '<span>'+swatch(v.free)+'Free period</span>'+
   '<span>'+swatch(v.noHw)+'No homework needed</span></div></div>';
  cards.appendChild(card);
  const ch=card.querySelector('.chooser'),box=card.querySelector('.wallbox'),info=card.querySelector('.info');
  let state='track',st;
  function render(){st=statusFor(state);box.innerHTML=wallSVG(v,st,'v'+vi);
    ch.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===state));
    const b=st.filter(s=>s.built).length,need=st.filter(s=>s.hw!=='none').length,h=st.filter(s=>s.hw==='set').length;
    info.innerHTML='Built <b>'+b+'</b> of '+N+' lessons, homework set <b>'+h+'</b> of '+need+'. Tap a shard.'}
  Object.entries(STATES).forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.s=k;b.onclick=()=>{state=k;render()};ch.appendChild(b)});
  box.addEventListener('click',e=>{const pc=e.target.closest('.pc');if(!pc)return;
    const d=pc.dataset.d,p=pc.dataset.p,part=pc.dataset.part;info.innerHTML=describe(+d,+p,part,st);
    // outline every shard of the tapped piece
    const T=pc.parentNode.getAttribute('transform');let o='';
    box.querySelectorAll('.pc[data-d="'+d+'"][data-p="'+p+'"][data-part="'+part+'"]').forEach(s=>o+=s.getAttribute('d'));
    box.querySelector('.sel').innerHTML='<path d="'+o+'" transform="'+T+'" fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-width="1"/>'});
  render();
});
</script>
</body>
</html>
