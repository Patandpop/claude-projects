<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
  /* Dark by default (Patryk 2026-10-04); light is a switch in the More menu. */
  :root {
    --navy:#0D1B5E; --gold:#FABB2E; --red:#EF5350; --green:#66BB6A; --orange:#FFA726; --blue:#64B5F6;
    --bg:#0E1424; --panel:#161E33; --panel2:#1C2540; --ink:#E6EAF5; --muted:#98A2BC; --line:#2A3555;
    --off:#12192B; --hover:#202A47; --chip:#24305A; --bar:#0A0F1E;
  }
  body.light {
    --red:#B71C1C; --green:#1B5E20; --orange:#E65100; --blue:#0D47A1;
    --bg:#EDF2FA; --panel:#FFFFFF; --panel2:#F7F9FD; --ink:#1A1A2E; --muted:#6B6B7B; --line:#D5DDEC;
    --off:#F1F1F4; --hover:#F7F9FD; --chip:#E8EAF6; --bar:#0D1B5E;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Century Gothic","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--bar); color:#fff; display:flex; align-items:center; gap:8px; padding:8px 14px; position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 8px 0 0; color:var(--gold); }
  header .sep { width:1px; height:24px; background:rgba(255,255,255,.2); margin:0 2px; }
  #wkLabel { font-weight:700; min-width:150px; }
  .badge { background:var(--gold); color:#0D1B5E; font-weight:700; padding:2px 8px; border-radius:10px; font-size:12px; }
  .badge.taught { background:var(--green); color:#fff; }
  button { font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); padding:5px 10px; border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  header button { background:transparent; color:#fff; border-color:rgba(255,255,255,.25); }
  header button.on { background:rgba(250,187,46,.22); border-color:var(--gold); }
  button.primary, header button.primary { background:var(--gold); color:#0D1B5E; border-color:var(--gold); font-weight:700; }
  header input[type=date] { font-family:inherit; border-radius:6px; border:1px solid rgba(255,255,255,.25); padding:3px 6px; background:transparent; color:#fff; color-scheme:dark; }
  #status { font-size:12px; margin-left:auto; opacity:.85; max-width:300px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button, .badge, #wkLabel { white-space:nowrap; }
  /* Sidebar (Patryk 2026-10-09): one place to flick between the planner's areas */
  #side { position:fixed; left:0; top:var(--hh, 50px); bottom:0; width:132px; background:var(--bar); border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:4px; z-index:4; }
  #side button { display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; text-align:left; background:transparent; color:#D7DCEA; border:1px solid transparent; padding:8px 9px; font-size:13px; }
  #side button small { font-size:10.5px; color:#8D97B3; }
  #side button:hover { border-color:rgba(255,255,255,.25); }
  #side button.on { background:rgba(250,187,46,.18); border-color:var(--gold); color:#fff; }
  #side hr { border:none; border-top:1px solid rgba(255,255,255,.12); margin:6px 0; width:100%; }
  #side .count { background:var(--gold); color:#0D1B5E; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700; margin-left:4px; }
  body > main { margin-left:132px; }
  @media (max-width: 900px) { #side { position:static; width:auto; flex-direction:row; flex-wrap:wrap; } #side hr { display:none; } body > main { margin-left:0; } }
  .tab { padding:4px 4px 20px; max-width:980px; }
  .tab h2 { margin:4px 0 4px; font-size:20px; color:var(--gold); }
  .tab .lead { color:var(--muted); margin:0 0 12px; font-size:13px; }
  .hwcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .hwcard h3 { margin:0; font-size:15px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hwcard .state { font-size:11px; font-weight:700; border-radius:10px; padding:1px 8px; border:1px solid currentColor; }
  .hwcard .state.made { color:var(--green); } .hwcard .state.new { color:var(--gold); }
  .hwq { border-top:1px solid var(--line); padding:8px 0; font-size:13px; line-height:1.45; }
  .hwq .opts { margin:4px 0 0 14px; }
  .hwq .opts div { color:var(--muted); } .hwq .opts .right { color:var(--green); font-weight:700; }
  .hwq .ms { color:var(--muted); font-size:12px; margin-top:4px; }
  .testrow select { width:auto; }
  #side .lbl { display:flex; align-items:center; gap:4px; }
  .testrow { display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .behaviour iframe { width:100%; height:calc(100vh - 150px); border:1px solid var(--line); border-radius:10px; background:#fff; }
  .flag.f-own { color:var(--green); } .flag.f-reuse { color:var(--blue); }
  #status.dirty::before { content:"\25CF  "; color:var(--gold); }
  .menuwrap { position:relative; }
  #menu { display:none; position:absolute; right:0; top:34px; background:var(--panel); border:1px solid var(--line); border-radius:8px; min-width:250px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:10; }
  #menu.on { display:block; }
  #menu button { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--ink); padding:8px 10px; }
  #menu button:hover { background:var(--hover); }
  #menu small { color:var(--muted); display:block; font-size:11px; }
  #menu hr { border:none; border-top:1px solid var(--line); margin:4px 0; }
  main { display:grid; grid-template-columns:1fr 410px; gap:12px; padding:12px; }
  main.full { grid-template-columns:1fr; }
  .cal { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .grid { display:grid; }
  .hcell { padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); cursor:pointer; }
  .hcell b { display:block; font-size:20px; color:var(--ink); font-weight:400; }
  .hcell.today b { background:var(--gold); color:#0D1B5E; border-radius:50%; width:36px; height:36px; line-height:36px; margin:2px auto 0; font-weight:700; }
  .hcell.off { background:var(--off); }
  .tcell { font-size:11px; color:var(--muted); text-align:right; padding:6px 6px 0 0; border-right:1px solid var(--line); }
  .allday { border-bottom:2px solid var(--line); min-height:34px; padding:3px; border-right:1px solid var(--line); }
  .chip { display:flex; gap:4px; align-items:center; font-size:11px; border-radius:4px; padding:2px 5px; margin:2px 0; background:var(--chip); color:var(--ink); cursor:pointer; }
  .chip.mine { opacity:.75; cursor:default; }
  .chip .x { margin-left:auto; opacity:.5; }
  .addx { font-size:11px; color:var(--muted); cursor:pointer; padding:1px 4px; visibility:hidden; }
  .allday:hover .addx { visibility:visible; }
  .slotcell { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:3px; min-height:92px; position:relative; }
  .slotcell.off { background:var(--off); }
  .slotcell.empty:hover { background:var(--hover); cursor:pointer; }
  .slotcell.empty:hover::after { content:"+ add"; position:absolute; top:6px; left:8px; font-size:11px; color:var(--muted); }
  .slotcell.over { outline:3px dashed var(--gold); outline-offset:-3px; }
  .ev { height:100%; min-height:84px; border-radius:6px; padding:5px 7px 5px 9px; font-size:12px; cursor:pointer; position:relative; border-left:5px solid var(--c); background:color-mix(in srgb, var(--c) 16%, var(--panel)); }
  .ev.sel { outline:3px solid var(--gold); }
  .ev .top { display:flex; gap:6px; align-items:center; }
  .ev .cls { font-weight:700; color:color-mix(in srgb, var(--c) 55%, var(--ink)); }
  .ev .tm { color:var(--muted); font-size:11px; }
  .ev .les { font-weight:700; margin:2px 0; line-height:1.25; }
  .ev .eq { color:var(--muted); font-size:11px; }
  .ev.kind-inset, .ev.kind-na { --c:#757575; color:var(--muted); }
  .ev.kind-test { background:color-mix(in srgb, var(--red) 18%, var(--panel)); }
  .ev.kind-revision { background:color-mix(in srgb, var(--blue) 16%, var(--panel)); }
  .ev.kind-cover { background:color-mix(in srgb, var(--orange) 16%, var(--panel)); }
  .ev.kind-free { background:var(--panel); border-left-style:dashed; color:var(--muted); }
  .ev.kind-taught { --c:var(--green); cursor:default; }
  .flags { display:flex; gap:3px; flex-wrap:wrap; margin-top:3px; }
  .flag { font-size:10px; font-weight:700; border-radius:3px; padding:0 4px; border:1px solid currentColor; }
  .f-check { color:var(--orange); } .f-built { color:var(--red); } .f-carry { color:var(--green); } .f-dbl { color:var(--blue); } .f-gap { color:var(--gold); }
  .brk { grid-column:1 / -1; font-size:10px; color:var(--muted); background:var(--off); padding:2px 8px; border-bottom:1px solid var(--line); }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; align-self:start; position:sticky; top:62px; max-height:calc(100vh - 80px); overflow:auto; }
  aside h2 { margin:0 0 6px; font-size:15px; color:var(--gold); }
  details { border-top:1px solid var(--line); margin-top:10px; padding-top:6px; }
  summary { cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); padding:4px 0; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  select, input[type=text], textarea { width:100%; font-family:inherit; font-size:13px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--ink); }
  textarea { min-height:50px; resize:vertical; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .muted { color:var(--muted); font-size:12px; }
  .results { border:1px solid var(--line); border-radius:6px; max-height:240px; overflow:auto; margin-top:4px; }
  .res { padding:6px 8px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .res:hover, .res.hi { background:var(--hover); }
  .res small { color:var(--muted); display:block; }
  .res.next { border-left:3px solid var(--gold); }
  .res.done { opacity:.55; }
  /* side panel: technician card + the whole-topic lesson list */
  .now { margin:2px 0 4px; font-size:14px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; }
  .card h4 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .card .src { font-weight:400; text-transform:none; letter-spacing:0; }
  .card .src.guess { color:var(--orange); font-weight:700; }
  .card textarea { min-height:96px; font-size:13.5px; line-height:1.4; }
  .newles { width:100%; margin-top:6px; border-style:dashed; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  label.inline { display:flex; gap:6px; align-items:center; margin:6px 0 0; }
  .lessonlist { border:1px solid var(--line); border-radius:6px; margin-top:6px; max-height:calc(100vh - 520px); min-height:220px; overflow:auto; background:var(--panel); }
  .lrow { display:flex; align-items:flex-start; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.3; }
  .lrow:last-child { border-bottom:none; }
  .lrow:hover { background:var(--hover); }
  .lrow .tick { margin-top:2px; accent-color:var(--green); cursor:pointer; }
  .lrow .body { flex:1; cursor:pointer; }
  .lrow .num { font-weight:700; display:inline-block; min-width:30px; color:var(--muted); }
  .lrow small { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
  .lrow.taught .t, .lrow.done .t { color:var(--muted); }
  .lrow.taught .num, .lrow.done .num { color:var(--green); }
  .lrow.taught small, .lrow.done small { color:var(--green); }
  .lrow.skipped .t { color:var(--muted); text-decoration:line-through; }
  .skipB { margin-left:6px; padding:1px 7px; font-size:11px; border-radius:10px; }
  .lrow.next { box-shadow:inset 3px 0 0 var(--gold); }
  .lrow.here { background:color-mix(in srgb, var(--gold) 15%, var(--panel)); }
  .lrow.optional .t { font-style:italic; color:var(--muted); }
  .tag { font-size:10px; font-weight:700; border-radius:3px; padding:0 4px; margin-left:5px; border:1px solid currentColor; white-space:nowrap; }
  .tag.next, .tag.here { color:var(--gold); } .tag.planned { color:var(--blue); } .tag.opt { color:var(--muted); } .tag.nof { color:var(--orange); }
  .lp.opt { border-style:dashed; opacity:.6; }
  .lp.skip { border-color:var(--red); color:var(--red); text-decoration:line-through; }
  /* Classes view */
  .classes { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:12px; padding:12px; }
  .ccard { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:10px; padding:10px 12px; }
  .ccard h3 { margin:0 0 4px; font-size:16px; }
  .topic { margin-top:8px; }
  .topic .tt { font-size:12px; font-weight:700; display:flex; gap:6px; align-items:center; }
  .topic .tt span { font-weight:400; color:var(--muted); }
  .les-list { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
  .lp { font-size:11px; padding:1px 5px; border-radius:3px; border:1px solid var(--line); }
  .lp.done { background:color-mix(in srgb, var(--green) 30%, var(--panel)); border-color:transparent; }
  .lp.miss { border-color:var(--gold); color:var(--gold); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal.on { display:flex; }
  .box { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:580px; width:92%; max-height:82vh; overflow:auto; }
  .box h3 { margin:0 0 10px; color:var(--gold); }
  pre { white-space:pre-wrap; font-family:inherit; font-size:13px; }
  kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-family:inherit; font-size:12px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:10px 14px; border-radius:6px; font-size:13px; display:none; gap:14px; align-items:center; z-index:30; }
  #toast.on { display:flex; }
  #toast button { background:transparent; border:none; color:var(--gold); font-weight:700; padding:0; }
</style>
</head>

<header>
  <h1>Planner</h1>
  <button id="today" title="T">Today</button>
  <button id="prev" title="K">&#9664;</button><button id="next" title="J">&#9654;</button>

    <div id="menu">

<script>
const KEY = <?!= JSON.stringify(key) ?>;   // the key is letters and numbers only, so unescaped output is safe
const P = window.PlannerLogic;
const COLS = ['B', 'F', 'J', 'N', 'R'];
let S = { data:null, weeks:{}, learned:{}, hasTemplate:false, monday:null, week:null, undo:[], sel:-1, dirty:false, view:'week', day:0, mine:null, showMine:false, readOnly:false, chooser:{} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const status = (t) => { $('status').textContent = t; $('status').classList.toggle('dirty', S.dirty); };
const run = (fn, ...args) => new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](KEY, ...args));
const todayMidnight = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ------------------------------------------------------------------ theme */
function applyTheme() { const light = store.get('planner-theme') === 'light'; document.body.classList.toggle('light', light); $('mTheme').textContent = light ? 'Dark mode' : 'Light mode'; }
applyTheme();

/* ------------------------------------------------------------------ toast */
let toastTimer = null;
function toast(msg, canUndo) {
  $('toastMsg').textContent = msg; $('toastUndo').style.display = canUndo ? '' : 'none';
  $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 6000);
}
$('toastUndo').onclick = () => { undo(); $('toast').classList.remove('on'); };

/* ------------------------------------------------------------------ weeks */
function firstPlanMonday() {
  const t = new Date(); const d = t.getDay();
  let m = P.mondayOf(P.addDays(t, d === 0 ? 1 : d === 6 ? 2 : 7));
  const lastFilled = (S.data.filledWeeks || []).slice(-1)[0];
  while (lastFilled && P.iso(m) <= lastFilled) m = P.addDays(m, 7);
  return m;
}
// Changes save by themselves (Patryk 2026-10-04: make it easy). Leaving a week saves it first.
function leaveOk() { if (S.dirty) save(); return true; }
// A week he filled in Planner.xlsx is shown exactly as he filled it (taught), read only.
function filledWeek(mon) {
  const rows = (S.data.filled || {})[P.iso(mon)];
  if (!rows) return null;
  return { monday: P.iso(mon), letter: P.weekLetter(S.data, mon), extras: [], taught: true,
    slots: rows.map((r) => ({ day: r.day, period: r.period, col: r.col, cls: r.cls, kind: 'taught', text: r.text || '(blank)', eq: '', notes: [], carry: [] })) };
}
function loadWeek(mon) {
  S.monday = P.mondayOf(mon); S.sel = -1; S.undo = []; S.dirty = false; S.mine = null; S.chooser = {};
  // Patryk 2026-10-08: every week can be changed, past and future, and the planner is the record.
  // A Planner.xlsx week opens as an ordinary week (its lessons pinned); his edits replace it.
  const saved = S.weeks[P.iso(S.monday)];
  const fromXlsx = !saved && !!(S.data.filled || {})[P.iso(S.monday)];
  S.readOnly = false;
  let w = saved ? JSON.parse(JSON.stringify(saved)) : fromXlsx ? P.fromFilled(S.data, S.monday) : P.autofill(S.data, S.weeks, S.monday, S.learned);
  // this week and later weeks follow any change made earlier: periods not placed by hand move along
  const thisMon = P.mondayOf(todayMidnight());
  if (saved && S.monday >= thisMon) {
    const fromDay = P.iso(S.monday) === P.iso(thisMon) ? Math.max(0, (todayMidnight().getDay() + 6) % 7) : 0;
    w = P.reflowWeek(S.data, S.weeks, w, S.learned, fromDay);
  }
  S.week = w;
  S.week.extras = S.week.extras || []; S.week.marks = S.week.marks || [];
  status(fromXlsx ? 'From your Planner.xlsx: change anything, it saves as you go' : saved ? 'Saved' : 'Planned automatically (saves when you change something)');
  $('jump').value = P.iso(S.monday);
  render(); editor();
  if (S.showMine) loadMine();
}
let saveTimer = null;
// quiet: a detail edit (equipment, notes): redraw the grid only, so the box being typed in stays put
function change(newWeek, msg, quiet) {
  if (S.readOnly) { toast('This week is already taught, so it can\'t be changed here'); return; }
  S.undo.push(JSON.stringify({ w: S.week, r: S.recSnap })); S.recSnap = JSON.stringify(S.data.records || []); S.week = newWeek; S.week.extras = S.week.extras || []; S.dirty = true;
  markGaps(); render(); if (!quiet) editor(); if (msg) toast(msg, true);
  status('Saving...'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
}
function undo() {
  if (!S.undo.length) { toast('Nothing to undo'); return; }
  const u = JSON.parse(S.undo.pop()); S.week = u.w; S.data.records = JSON.parse(u.r || '[]'); S.recSnap = u.r; S.dirty = true; markGaps(); render(); editor();
  status('Saving...'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
}
function save() {
  clearTimeout(saveTimer);
  if (S.readOnly || !S.dirty) return Promise.resolve();
  const wk = JSON.parse(JSON.stringify(S.week));          // this week, even if he moves on before it lands
  S.dirty = false; status('Saving...');
  const recs = JSON.stringify(S.data.records || []);
  return run('saveWeek', wk).then(() => {
    S.weeks[wk.monday] = wk; if (S.week.monday === wk.monday) status(S.dirty ? 'Saving...' : 'All changes saved');
    if (recs !== S.recSaved) run('saveLessons', JSON.parse(recs)).then(() => { S.recSaved = recs; });
    // slide-over (2026-10-12): later saved weeks re-plan now, not only when opened
    const moved = P.cascade(S.data, S.weeks, wk.monday, todayMidnight(), S.learned);
    if (moved.length) run('saveWeeks', moved).then(() => toast('Later weeks moved along: w/c ' + moved.map((x) => fmtDate(x.monday)).join(', ')))
      .catch((e) => status('Later weeks NOT saved: ' + e.message));
  })
    .catch((e) => { if (S.week.monday === wk.monday) S.dirty = true; status('NOT saved: ' + e.message + ' (Ctrl+S to try again)'); });
}

/* ------------------------------------------------------------------ render */
function timeLabel(p) {
  const a = (S.data.periodTimes.ks3['P' + p] || '').split('-')[0], b = (S.data.periodTimes.ks4['P' + p] || '').split('-')[0];
  return 'P' + p + '<br>' + (a === b ? a : a + '<br>' + b);
}
function setViewButtons() {
  ['Week', 'Day', 'Classes', 'Homework', 'Tests', 'Behaviour'].forEach((v) => $('v' + v).classList.toggle('on', S.view === v.toLowerCase()));
  const wide = !['week', 'day'].includes(S.view);
  $('main').classList.toggle('full', wide);
  $('ed').style.display = wide ? 'none' : '';
  document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
}
function render() {
  setViewButtons();
  const mon = S.monday, today = P.iso(todayMidnight());
  $('wkLabel').textContent = (S.view === 'day' ? P.DAYS[S.day] + ' ' : 'w/c ') + P.addDays(mon, S.view === 'day' ? S.day : 0).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  $('letter').textContent = S.readOnly ? 'Week ' + S.week.letter + ' · taught' : 'Week ' + S.week.letter;
  $('letter').classList.toggle('taught', S.readOnly);
  if (S.view === 'classes') return renderClasses();
  if (S.view === 'homework') return renderHomework();
  if (S.view === 'tests') return renderTests();
  if (S.view === 'behaviour') return renderBehaviour();
  const days = S.view === 'day' ? [S.day] : [0, 1, 2, 3, 4];
  const g = $('grid');
  g.className = 'grid';
  g.style.gridTemplateColumns = '64px repeat(' + days.length + ', 1fr)';
  let h = '<div class="hcell"></div>';
  days.forEach((d) => {
    const date = P.addDays(mon, d);
    const off = !P.isTeachingDay(S.data, date);
    h += '<div class="hcell' + (P.iso(date) === today ? ' today' : '') + (off ? ' off' : '') + '" data-day="' + d + '" title="Open this day">' + P.DAYS[d].toUpperCase() + '<b>' + date.getDate() + '</b></div>';
  });
  h += '<div class="tcell" style="padding-top:8px">All day</div>';
  days.forEach((d) => {
    h += '<div class="allday" data-day="' + d + '">';
    (S.week.extras || []).forEach((x, k) => { if (x.day === d) h += '<div class="chip" data-x="' + k + '" title="Click to remove">' + esc(x.kindLabel || '') + ' ' + esc(x.text) + '<span class="x">&#10005;</span></div>'; });
    (S.showMine && S.mine || []).forEach((e) => { if (e.day === d) h += '<div class="chip mine" title="From your Google Calendar">' + (e.time ? esc(e.time) + ' ' : '') + esc(e.title) + '</div>'; });
    if (!S.readOnly) h += '<span class="addx" data-add="' + d + '">+ task / marking / meeting</span>';
    h += '</div>';
  });
  for (let p = 1; p <= 5; p++) {
    if (p === 2) h += '<div class="brk">Break: KS3 10:00-10:25 · KS4/5 11:05-11:30</div>';
    if (p === 4) h += '<div class="brk">Lunch: KS3 12:30-13:15 · KS4/5 13:30-14:15</div>';
    h += '<div class="tcell">' + timeLabel(p) + '</div>';
    days.forEach((d) => {
      const off = !P.isTeachingDay(S.data, P.addDays(mon, d));
      const i = S.week.slots.findIndex((s) => s.day === d && s.period === p);
      if (i < 0) { h += '<div class="slotcell' + (S.readOnly ? '' : ' empty') + (off ? ' off' : '') + '" data-day="' + d + '" data-p="' + p + '"></div>'; return; }
      const s = S.week.slots[i];
      const c = S.data.classes[s.cls] || {};
      const flags = [];
      if (s.double) flags.push('<span class="flag f-dbl">DOUBLE</span>');
      if (s.cover) flags.push('<span class="flag f-check" title="Cover work for this lesson: counts as taught">COVER</span>');
      if (s.kind === 'lesson' && s.nofolder) flags.push('<span class="flag f-built" title="In the technician guide but no lesson folder on Drive">NO FOLDER</span>');
      else if (s.own) flags.push('<span class="flag f-own" title="You made this one yourself: never sent to Claude">YOURS</span>');
      else if (s.sameAs) flags.push('<span class="flag f-reuse" title="Claude copies and adapts this class\'s lesson">REUSES ' + esc(s.sameAs.cls) + '</span>');
      else if (s.kind === 'lesson' && s.built === false) flags.push('<span class="flag f-built" title="No slides in the Drive folder yet">NOT BUILT</span>');
      if (s.kind === 'lesson' && s.gap) flags.push('<span class="flag f-gap" title="A lesson missed earlier in this topic">MISSED</span>');
      if ((s.carry || []).length) flags.push('<span class="flag f-carry">+' + s.carry.length + ' carry</span>');
      const L = s.kind === 'lesson' ? c.seq[s.i] || {} : null;
      const time = P.periodTime(S.data, s.cls, s.period);
      h += '<div class="slotcell" data-i="' + i + '"><div class="ev kind-' + s.kind + (S.sel === i ? ' sel' : '') + '"' + (S.readOnly ? '' : ' draggable="true"') + ' data-i="' + i + '" style="--c:' + (c.colour || '#3F51B5') + '">' +
        '<div class="top"><span class="cls">' + esc(s.cls) + '</span><span class="tm">' + esc(time) + '</span></div>' +
        '<div class="les">' + esc(s.kind === 'taught' ? s.text : P.lessonCell(S.data, s)) + '</div>' +
        (L ? '<div class="eq">' + esc(L.topic) + ' · L' + L.num + '</div>' : '') +
        (s.eq && S.view === 'day' ? '<div class="eq">' + esc(s.eq) + '</div>' : '') +
        '<div class="flags">' + flags.join('') + '</div></div></div>';
    });
  }
  g.innerHTML = h;

  g.querySelectorAll('.ev').forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); if (S.readOnly) return; S.sel = +el.dataset.i; render(); editor(); };
    el.ondragstart = (e) => e.dataTransfer.setData('text/plain', el.dataset.i);
  });
  if (!S.readOnly) g.querySelectorAll('.slotcell').forEach((el) => {
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop = (e) => {
      e.preventDefault(); el.classList.remove('over');
      const from = +e.dataTransfer.getData('text/plain');
      if (el.dataset.i != null) askMove(from, +el.dataset.i); else moveToEmpty(from, +el.dataset.day, +el.dataset.p);
    };
    if (el.classList.contains('empty')) el.onclick = () => addPanel(+el.dataset.day, +el.dataset.p);
  });
  g.querySelectorAll('.chip[data-x]').forEach((el) => el.onclick = () => {
    const w = JSON.parse(JSON.stringify(S.week)); const x = w.extras.splice(+el.dataset.x, 1)[0];
    change(w, 'Removed "' + x.text + '"');
  });
  g.querySelectorAll('[data-add]').forEach((el) => el.onclick = () => addExtra(+el.dataset.add));
  g.querySelectorAll('.hcell[data-day]').forEach((el) => el.onclick = () => { S.day = +el.dataset.day; S.view = 'day'; render(); });
}

// Tests (Patryk 2026-10-10): the REAL tests come from the scheme and are sat in class (the test
// lessons in the week grid). What Claude makes here is EXAM PRACTICE HOMEWORK: a printed paper plus
// the same questions as a Google Form, worked through at home, never in class.
function upcomingTests() {
  const out = [];
  for (let n = 0; n < 6; n++) {
    const mon = P.addDays(S.monday, 7 * n), key = P.iso(mon);
    const wk = n === 0 ? S.week : (S.weeks[key] || P.autofill(S.data, S.weeks, mon, S.learned));
    (wk.slots || []).filter((s) => s.kind === 'test' && !s.double).forEach((s) => out.push({ s, date: P.addDays(mon, s.day) }));
  }
  return out;
}
// due date for exam practice before a test: the day before it, or a week today if that has passed
function dueBefore(date) {
  const d = date ? P.addDays(date, -1) : null, today = new Date();
  return P.iso(d && d > today ? d : P.addDays(today, 7));
}
function practiceRequest(cls, topics, size, due) {
  const c = S.data.classes[cls] || {};
  const ks5 = c.year >= 12;
  const text = 'Make ' + (size === 'full' ? 'full' : 'mini') + ' exam practice homework for ' + cls + ' (Year ' + c.year + ') on ' + topics.join(', ') + ', due ' + due +
    (ks5 ? ': real A-level layout (OCR A).' : ': Core and Challenge papers.') + ' Printed paper + Google Form. Use test-paper.js --due ' + due + '.';
  return run('sendRequest', { kind: 'practice', text, lessons: [] }).then(() => toast('Exam practice asked for. At home: "do my planner requests". The Forms appear in Homework.'));
}

      }).join('') + '</div>';
  }).join('') + '<div class="muted" style="grid-column:1/-1">Settings: open a class\'s settings to set its test papers and notes for Claude. Green = taught. Gold outline = still to teach in the topic you\'re on (the planner fills these first). Dashed = optional (only planned if you pick it). Red, crossed out = never taught in a topic you have finished: tick it in the lesson list if you did teach it. Hover a lesson number for its title and when it was taught. Counts are up to w/c ' + mon.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + '.</div>';

}

// Patryk 2026-10-04: the change-lesson box shows EVERY lesson of the topic in order, with what is
// taught (and when, and what he wrote), what is planned this week, and what is still to teach, so he
// chooses with the whole picture. Ticks fix the record. The technician details sit above it,

const fmtDate = (d) => { if (!d) return ''; const x = P.parse(d); return x.getDate() + ' ' + x.toLocaleDateString('en-GB', { month:'short' }); };
function whenText(w) {
  if (!w) return 'taught';
  if (w.wrote === 'ticked off') return 'ticked off by you';
  if (w.wrote === 'planner') return 'planned w/c ' + fmtDate(P.iso(P.mondayOf(P.parse(w.date))));
  return 'taught ' + fmtDate(w.date) + (w.wrote ? ' · you wrote "' + w.wrote + '"' : '');
}
const slotName = (k) => { const s = S.week.slots[k]; return P.DAYS[s.day] + ' P' + s.period; };
function unitOptions(cls) {
  const rep = P.classReport(S.data, S.weeks, S.monday, cls, S.week);
  const seen = {};
  return rep.map((r) => {
    seen[r.topic] = (seen[r.topic] || 0) + 1;
    const label = r.state === 'current' ? 'now' : r.state === 'finished' ? 'finished' + (r.tested ? ', tested' : '') : r.state;
    return { unit: r.unit, state: r.state, text: r.topic + (seen[r.topic] > 1 ? ' (part ' + seen[r.topic] + ')' : '') + ' · ' + label };
  });
}
// The lesson chooser. pos = {day, period} of the slot; curI = the lesson in it now (or null).
function chooser(cls, pos, curI, onPick, onReview) {

  if (S.chooser.cls !== cls || S.chooser.pos !== pos.day + '-' + pos.period) S.chooser = { cls, pos: pos.day + '-' + pos.period, unit: def };
  $('chooser').innerHTML =
    '<div class="row" style="margin-top:0"><select id="cUnit" style="flex:1">' + units.map((u) => '<option value="' + esc(u.unit) + '"' + (u.unit === S.chooser.unit ? ' selected' : '') + '>' + esc(u.text) + '</option>').join('') + '</select></div>' +

  const row = (o, topic) => {
    const here = o.k === curI;
    const tags = [];
    if (here) tags.push('<span class="tag here">in this slot</span>');
    else if (o.next) tags.push('<span class="tag next">★ next</span>');
    if (o.state === 'planned' && !here) tags.push('<span class="tag planned">' + o.slots.map(slotName).join(', ') + '</span>');
    if (o.optional) tags.push('<span class="tag opt">optional</span>');

    return '<div class="lrow ' + o.state + (o.next && !here ? ' next' : '') + (here ? ' here' : '') + (o.optional ? ' optional' : '') + '">' +

  };
  const draw = () => {
    const q = $('q').value.trim().toLowerCase();

        .filter(({ o, u }) => words.every((w) => (o.title + ' ' + u.text + ' l' + o.num).toLowerCase().includes(w)))

    $('qr').querySelectorAll('.skipB').forEach((el) => el.onclick = (e) => {

      if (o && o.state === 'done' && !el.checked) {   // planned on a day that has passed, but it didn't happen

  $('q').oninput = draw;
  draw();
}
// "Wed P3 is now L1 MRS GREN": what moved in a class's week after a change.
function reflowNote(oldW, newW, cls, except) {
  const out = [];
  newW.slots.forEach((s, k) => {
    const o = oldW.slots[k];
    if (k === except || s.cls !== cls || s.double || !o || (o.kind === s.kind && o.i === s.i)) return;
    out.push(P.DAYS[s.day] + ' P' + s.period + ' is now ' + (s.kind === 'lesson' ? 'L' + S.data.classes[cls].seq[s.i].num : P.lessonCell(S.data, s)));
  });
  return out.length ? '. ' + out.slice(0, 3).join(', ') : '';
}

    if (!okToSkip(P.wouldSkip(S.data, S.weeks, w, idx, fields, S.learned), 'Moving ' + cls + ' on to ' + S.data.classes[cls].seq[k].topic)) return;
    const nw = P.setSlot(S.data, S.weeks, w, idx, fields, S.learned);
    S.sel = idx;
    change(nw, 'Added ' + cls + ' lesson' + reflowNote(w, nw, cls, idx));
  };
  const go = () => chooser($('aCls').value, { day, period }, null, pick);
  $('aCls').onchange = go; go();
}

// MISSED flag: a planned lesson that comes BEFORE something already taught in the same topic.
function markGaps() {
  if (!S.week || S.readOnly) return;
  const st = P.progressBefore(S.data, S.weeks, S.monday, S.learned);
  S.week.slots.forEach((s) => {
    if (s.kind !== 'lesson') return;
    const c = S.data.classes[s.cls]; const L = c && c.seq[s.i]; if (!L) return;
    P.applyMarks(st[s.cls], S.week.marks, s.cls);
    s.gap = c.seq.some((x, k) => x.unit === L.unit && k > s.i && st[s.cls].taught.has(k));
  });
}

/* ------------------------------------------------------------ send to Claude
   Requests go through the mailbox on his personal account to Claude Code at home ("do my planner
   requests"). Lessons go with the same text as "Copy build prompt", plus the day and period. */
function lessonRequest(i) {
  const s = S.week.slots[i];
  const when = P.DAYS[s.day] + ' ' + P.addDays(S.monday, s.day).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' P' + s.period;
  return { when, cls: s.cls, prompt: P.buildPrompt(S.data, s, (S.classSettings || {})[s.cls], S.week) };
}
function sendToClaude(preselect) {
  if (!S.week) return;
  const idx = S.week.slots.map((s, i) => i).filter((i) => { const s = S.week.slots[i]; return ['lesson', 'revision'].includes(s.kind) && !s.own && !s.double && (s.built === false || s.kind === 'revision' || (preselect || []).includes(i)); });
  const rows = idx.map((i) => { const r = lessonRequest(i); const on = preselect ? preselect.includes(i) : true;
    return '<label style="display:block;margin:3px 0"><input type="checkbox" class="cReq" data-i="' + i + '"' + (on ? ' checked' : '') + '> ' + esc(r.when + ' · ' + r.cls + ' · ' + (r.prompt.split(String.fromCharCode(10))[1] || '')) + '</label>'; }).join('');
  modal('<h3>Send to Claude</h3>' +
    (rows ? '<p class="muted">Lessons to build (not built yet this week):</p>' + rows : '<p class="muted">Every lesson this week is already built.</p>') +
    '<label>Message (optional)</label><textarea id="cMsg" rows="4" style="width:100%" placeholder="e.g. 9XS: make the Do Now on prokaryotic cells. Or: change the planner so..."></textarea>' +
    '<p class="muted">At home, tell Claude Code: "do my planner requests".</p>' +
    '<div class="row"><button class="primary" id="cSend">Send</button><button id="cCancel">Cancel</button></div>');
  $('cCancel').onclick = closeModal;
  $('cSend').onclick = () => {
    const lessons = [...document.querySelectorAll('.cReq')].filter((x) => x.checked).map((x) => lessonRequest(+x.dataset.i));
    const text = $('cMsg').value.trim();
    if (!lessons.length && !text) { toast('Nothing to send'); return; }
    closeModal(); status('Sending to Claude...');
    run('sendRequest', { kind: lessons.length ? 'build' : 'message', text, lessons })
      .then(() => { status('Sent to Claude'); toast('Sent. At home say "do my planner requests"'); })
      .catch((e) => status('Not sent: ' + e.message));
  };
}

    status(list.length ? list.length + ' homework quiz(zes) made' : 'No new homework from home');
    const seen = Array.isArray(res) ? null : res;
    modal('<h3>Homework quizzes</h3>' + (seen ? '<p class="muted">The mailbox found ' + seen.seen + ' homework file(s) from home' + (seen.already ? ', ' + seen.already + ' already made' : '') + '.' + (seen.seen ? ' ' + esc(seen.names.join(', ')) : ' Nothing is waiting there: check that the mailbox is the newest version and that the file is in Admin / Planner Sync.') + '</p>' : '') + (list.length ? list.map((h) => '<p><b>' + esc(h.title) + '</b><br><a href="' + esc(h.form) + '" target="_blank">Open the quiz</a> · ' +
      (h.draft ? 'Classroom draft ready: check it and publish' : 'no Classroom draft: ' + esc(h.note)) + '</p>').join('') :
      '<p class="muted">Nothing new. At home, ask Claude: "make homework for 10C2 due Friday".</p>') + '<div class="row"><button id="mClose">Close</button></div>');
    $('mClose').onclick = closeModal;
  }).catch((e) => {
    // an error stays on screen (the autosave "Saved" message used to cover it up)
    status('Homework not made');
    modal('<h3>Homework quizzes: not made</h3><p>' + esc(String(e.message || e).replace(/^Error:\s*/, '')) + '</p><div class="row"><button id="mClose">Close</button></div>');
    $('mClose').onclick = closeModal;
  });
});
// Make next day (Patryk 2026-10-08): one click sends the next school day's lessons to Claude, each with
// its checklist, the class notes and the books, plus that day's kit and printing for reference.
$('mkDay').onclick = async () => {
  if (!S.data || !S.data.classes) return;
  if (S.dirty) await save();
  const d = P.nextSchoolDay(S.data, new Date());
  const mon = P.mondayOf(d), day = (d.getDay() + 6) % 7;
  // the same week the planner shows: saved, or a Planner.xlsx week as an editable week, or the plan
  const week = P.iso(mon) === S.week.monday ? S.week : (S.weeks[P.iso(mon)] || P.fromFilled(S.data, mon) || P.autofill(S.data, S.weeks, mon, S.learned));
  const slots = week.slots.filter((s) => s.day === day && !s.double && ['lesson', 'revision'].includes(s.kind));
  const label = P.DAYS[day] + ' ' + d.getDate() + ' ' + d.toLocaleDateString('en-GB', { month: 'short' });
  if (!slots.length) { toast('No lessons to build on ' + label); return; }
  const rows = slots.map((s) => {
    const name = s.kind === 'lesson' ? 'L' + S.data.classes[s.cls].seq[s.i].num + ' ' + S.data.classes[s.cls].seq[s.i].title : P.lessonCell(S.data, s);
    // all ticked: a folder with slides in it may only hold the school's original deck
    return '<label style="display:block;margin:3px 0"><input type="checkbox" class="mdReq" data-p="' + s.period + '"' + (s.own ? '' : ' checked') + '> P' + s.period + ' ' + esc(s.cls) + ' · ' + esc(name) + (s.own ? ' <span class="muted">(you made this)</span>' : s.sameAs ? ' <span class="muted">(reuses ' + esc(s.sameAs.cls) + '\'s)</span>' : s.built === true ? ' <span class="muted">(folder already has slides)</span>' : '') + '</label>';
  }).join('');
  modal('<h3>Make ' + label + '</h3><p class="muted">Ticked lessons go to Claude with their checklists and class notes. At home: "do my planner requests".</p>' + rows +
    '<label>Anything else for the day (optional)</label><input type="text" id="mdNote" placeholder="e.g. 9XS are in the lab, not S8">' +
    '<div class="row"><button class="primary" id="mdGo">Send to Claude</button><button id="mdCancel">Cancel</button></div>');
  $('mdCancel').onclick = closeModal;
  $('mdGo').onclick = () => {
    const pick = new Set([...document.querySelectorAll('.mdReq')].filter((x) => x.checked).map((x) => +x.dataset.p));
    const lessons = slots.filter((s) => pick.has(s.period)).map((s) => ({ when: label + ' P' + s.period, cls: s.cls, prompt: P.buildPrompt(S.data, s, (S.classSettings || {})[s.cls], week) }));
    const kit = P.printList(S.data, week, S.classSettings).filter((x) => x.startsWith(P.DAYS[day] + ' '));
    const text = ['Make my next day: ' + label + '.', $('mdNote').value.trim(), kit.length ? 'Printing that day: ' + kit.join('; ') : ''].filter(Boolean).join(' ');
    if (!lessons.length) { toast('Nothing ticked'); return; }
    closeModal(); status('Sending ' + label + ' to Claude...');
    run('sendRequest', { kind: 'build', text, lessons }).then(() => { status('Sent ' + label + ' to Claude'); toast('Sent. At home say "do my planner requests"'); })
      .catch((e) => status('Not sent: ' + e.message));
  };
};
item('mTheme', () => { store.set('planner-theme', document.body.classList.contains('light') ? 'dark' : 'light'); applyTheme(); });
const HELP = [['J or →', 'next week (next day in Day view)'], ['K or ←', 'previous week (previous day in Day view)'], ['T', 'today'], ['W / D / C', 'week / day / classes view'], ['/', 'find a lesson (when one is selected)'], ['Delete', 'clear the selected lesson'], ['Ctrl+Z', 'undo'], ['Ctrl+S', 'save'], ['Esc', 'close / deselect'], ['?', 'this help']];
const showHelp = () => { modal('<h3>Keyboard shortcuts</h3>' + HELP.map(([k, t]) => '<div style="margin:4px 0"><kbd>' + k + '</kbd> ' + t + '</div>').join('') + '<div class="row"><button id="mClose">Close</button></div>'); $('mClose').onclick = closeModal; };
item('mHelp', showHelp);

/* ----------------------------------------------------------------- toolbar */
$('today').onclick = () => { if (leaveOk()) { const t = todayMidnight(); S.day = Math.min(4, (t.getDay() + 6) % 7); loadWeek(t); markGaps(); render(); } };
// Patryk 2026-10-07: in Day view the arrows move one school day (Fri -> next Mon); in Week view, a week.
function step(dir) {
  if (S.view === 'day') {
    const d = S.day + dir;
    if (d >= 0 && d <= 4) { S.day = d; S.sel = -1; render(); editor(); return; }
    if (!leaveOk()) return;
    S.day = dir > 0 ? 0 : 4;
    loadWeek(P.addDays(S.monday, 7 * dir)); markGaps(); render(); return;
  }
  if (leaveOk()) { loadWeek(P.addDays(S.monday, 7 * dir)); markGaps(); render(); }
}
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('jump').onchange = () => { if ($('jump').value && leaveOk()) { loadWeek(P.parse($('jump').value)); markGaps(); render(); } };
$('vWeek').onclick = () => { S.view = 'week'; render(); editor(); };
$('vDay').onclick = () => { S.view = 'day'; render(); editor(); };
$('vClasses').onclick = () => { S.view = 'classes'; render(); };
function showTab(v) { S.view = v; S.sel = -1; render(); }
$('vHomework').onclick = () => showTab('homework');
$('vTests').onclick = () => showTab('tests');
$('vBehaviour').onclick = () => showTab('behaviour');
$('undo').onclick = undo;
$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { status('Importing...'); run('importData', rd.result).then((r) => { toast('Imported ' + r.classes + ' classes'); return run('loadAll'); }).then(onLoad).catch((e) => status('Import failed: ' + e.message)); };
  rd.readAsText(f);
};

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') { closeModal(); menu.classList.remove('on'); if (typing) document.activeElement.blur(); else { S.sel = -1; render(); editor(); } return; }
  if (typing || !S.week) return;
  const k = e.key.toLowerCase();
  if (k === 'j' || e.key === 'ArrowRight') $('next').click();
  else if (k === 'k' || e.key === 'ArrowLeft') $('prev').click();
  else if (k === 't') $('today').click();
  else if (k === 'w') $('vWeek').click();
  else if (k === 'd') $('vDay').click();
  else if (k === 'c') $('vClasses').click();
  else if (e.key === '?') showHelp();
  else if (e.key === '/' && $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Delete' && S.sel >= 0) $('kFree').click();
});
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function onLoad(r) {
  S.data = r.data; S.weeks = r.weeks || {}; S.learned = r.learned || {}; S.classSettings = r.classSettings || {}; S.added = r.added || []; S.behaviourUrl = r.behaviourUrl || "";
  if (S.data && S.data.classes) {
    P.applyAdded(S.data, S.added);                                          // lessons he added in the planner
    Object.values(S.weeks).forEach((w) => P.remapWeek(S.data, w));          // same lessons after a data refresh
    // shared lesson state (2026-10-12): one record per lesson; ticks saved inside old weeks move into it once
    S.data.records = r.records || []; P.remapRecords(S.data);
    const mg = P.migrateMarks(S.data, S.weeks);
    if (mg.length) run('saveLessons', S.data.records).then(() => run('saveWeeks', mg)).catch((e) => status('Ticks not moved: ' + e.message));
    S.recSnap = JSON.stringify(S.data.records); S.recSaved = mg.length ? null : S.recSnap;
  }
  if (!S.data) { status('No data yet: More → Import data, pick planner-data.json'); $('grid').innerHTML = ''; editor(); return; }
  if (!S.data.periodTimes || !S.data.filled) { status('Old data file: ask Claude to refresh the planner data, then More → Import data'); return; }
  // Patryk 2026-10-08: open on THIS week (at the weekend, next week); today's day in Day view.
  const t = todayMidnight(), wd = t.getDay();
  if (!S.monday) S.day = wd >= 1 && wd <= 5 ? wd - 1 : 0;
  loadWeek(S.monday || P.mondayOf(wd === 0 ? P.addDays(t, 1) : wd === 6 ? P.addDays(t, 2) : t)); markGaps(); render();
  const sy = r.sync || {};
  if (sy.pulled) toast('New lesson data from home loaded');
  else if (sy.error) status('Home link not working: ' + sy.error);
}
run('loadAll').then(onLoad).catch((e) => status('Could not load: ' + e.message));
</script>
