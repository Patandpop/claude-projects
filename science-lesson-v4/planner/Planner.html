<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
  /* Dark by default (Patryk 2026-10-04); light is a switch in the More menu. */
  :root {
    --navy:#0D1B5E; --gold:#FABB2E; --red:#EF5350; --green:#66BB6A; --orange:#FFA726; --blue:#64B5F6;
    --bg:#0E1424; --panel:#161E33; --panel2:#1C2540; --ink:#E6EAF5; --muted:#98A2BC; --line:#2A3555;
    --off:#12192B; --hover:#202A47; --chip:#24305A; --bar:#0A0F1E;
  }
  body.light {
    --red:#B71C1C; --green:#1B5E20; --orange:#E65100; --blue:#0D47A1;
    --bg:#EDF2FA; --panel:#FFFFFF; --panel2:#F7F9FD; --ink:#1A1A2E; --muted:#6B6B7B; --line:#D5DDEC;
    --off:#F1F1F4; --hover:#F7F9FD; --chip:#E8EAF6; --bar:#0D1B5E;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Century Gothic","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--bar); color:#fff; display:flex; align-items:center; gap:8px; padding:8px 14px; position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 8px 0 0; color:var(--gold); }
  header .sep { width:1px; height:24px; background:rgba(255,255,255,.2); margin:0 2px; }
  #wkLabel { font-weight:700; min-width:150px; }
  .badge { background:var(--gold); color:#0D1B5E; font-weight:700; padding:2px 8px; border-radius:10px; font-size:12px; }
  .badge.taught { background:var(--green); color:#fff; }
  button { font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); padding:5px 10px; border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  header button { background:transparent; color:#fff; border-color:rgba(255,255,255,.25); }
  header button.on { background:rgba(250,187,46,.22); border-color:var(--gold); }
  button.primary, header button.primary { background:var(--gold); color:#0D1B5E; border-color:var(--gold); font-weight:700; }
  header input[type=date] { font-family:inherit; border-radius:6px; border:1px solid rgba(255,255,255,.25); padding:3px 6px; background:transparent; color:#fff; color-scheme:dark; }
  #status { font-size:12px; margin-left:auto; opacity:.85; max-width:300px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button, .badge, #wkLabel { white-space:nowrap; }
  /* Sidebar (Patryk 2026-10-09): one place to flick between the planner's areas */
  #side { position:fixed; left:0; top:var(--hh, 50px); bottom:0; width:132px; background:var(--bar); border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:4px; z-index:4; }
  #side button { display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; text-align:left; background:transparent; color:#D7DCEA; border:1px solid transparent; padding:8px 9px; font-size:13px; }
  #side button small { font-size:10.5px; color:#8D97B3; }
  #side button:hover { border-color:rgba(255,255,255,.25); }
  #side button.on { background:rgba(250,187,46,.18); border-color:var(--gold); color:#fff; }
  #side hr { border:none; border-top:1px solid rgba(255,255,255,.12); margin:6px 0; width:100%; }
  #side .count { background:var(--gold); color:#0D1B5E; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700; margin-left:4px; }
  body > main { margin-left:132px; }
  @media (max-width: 900px) { #side { position:static; width:auto; flex-direction:row; flex-wrap:wrap; } #side hr { display:none; } body > main { margin-left:0; } }
  .tab { padding:4px 4px 20px; max-width:980px; }
  .tab h2 { margin:4px 0 4px; font-size:20px; color:var(--gold); }
  .tab .lead { color:var(--muted); margin:0 0 12px; font-size:13px; }
  .hwcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .hwcard h3 { margin:0; font-size:15px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hwcard .state { font-size:11px; font-weight:700; border-radius:10px; padding:1px 8px; border:1px solid currentColor; }
  .hwcard .state.made { color:var(--green); } .hwcard .state.new { color:var(--gold); }
  .hwq { border-top:1px solid var(--line); padding:8px 0; font-size:13px; line-height:1.45; }
  .hwq .opts { margin:4px 0 0 14px; }
  .hwq .opts div { color:var(--muted); } .hwq .opts .right { color:var(--green); font-weight:700; }
  .hwq .ms { color:var(--muted); font-size:12px; margin-top:4px; }
  /* Homework tab "Set new homework" (2026-10-18, design-audit/planner-tabs/spec.md 1.2 and its mock-up) */
  details.hwsec { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin:0 0 12px; padding:0; }
  details.hwsec > summary { list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:700; font-size:15px; }
  details.hwsec > summary::-webkit-details-marker { display:none; }
  details.hwsec > summary::before { content:"\25B8"; color:var(--gold); display:inline-block; transition:transform .15s; }
  details.hwsec[open] > summary::before { transform:rotate(90deg); }
  details.hwsec > summary .sub { font-weight:400; font-size:12px; color:var(--muted); }
  .hwbody { padding:0 14px 14px; border-top:1px solid var(--line); }
  .hwstep { margin-top:14px; }
  .hwstep > .st { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .hwstep > .st span { text-transform:none; letter-spacing:0; font-weight:400; }
  .hwkinds { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:8px; }
  .hwkind { border:1px solid var(--line); background:var(--panel2); border-radius:8px; padding:8px 10px; text-align:left; display:block; width:100%; }
  .hwkind b { display:block; font-size:13px; } .hwkind small { color:var(--muted); font-size:11.5px; line-height:1.3; display:block; margin-top:2px; }
  .hwkind.on { border-color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, var(--panel)); }
  .hwkind:disabled { opacity:.55; cursor:default; }
  .hwchips { display:flex; flex-wrap:wrap; gap:6px; }
  .hwchip { border:2px solid var(--c); background:var(--panel2); border-radius:16px; padding:3px 12px; font-weight:700; font-size:13px; color:var(--ink); }
  .hwchip.on { background:color-mix(in srgb, var(--c) 45%, var(--panel)); }
  .hwchip:disabled { opacity:.4; cursor:default; border-style:dashed; }
  .hwrow { border:1px solid var(--line); border-left:5px solid var(--c); border-radius:8px; margin-top:8px; background:var(--panel2); }
  .hwrow > summary { list-style:none; cursor:pointer; padding:8px 10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:13px; }
  .hwrow > summary::-webkit-details-marker { display:none; }
  .hwrow > summary b { min-width:44px; }
  .hwrow .inner { padding:2px 10px 10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:4px 12px; }
  .hwrow label, .hwbody > .hwstep label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  .hwrow select, .hwrow input, .hwbody textarea { width:100%; font-family:inherit; font-size:13px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  .hwbody textarea { min-height:70px; resize:vertical; line-height:1.4; }
  .hwseg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .hwseg button { border:none; border-radius:0; padding:4px 10px; background:var(--panel2); }
  .hwseg button.on { background:var(--gold); color:#0D1B5E; font-weight:700; }
  .hwwhy { font-size:11.5px; color:var(--orange); }
  .hwres { font-size:12.5px; padding:0 10px 8px; }
  .hwres.bad { color:var(--orange); } .hwres.good { color:var(--green); }
  .hwprev { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.45; margin-top:6px; white-space:pre-wrap; }
  .hwpill { font-size:11px; font-weight:700; border-radius:10px; padding:1px 8px; border:1px solid currentColor; white-space:nowrap; }
  .hwpill.draft { color:var(--gold); } .hwpill.sched { color:var(--blue); } .hwpill.made { color:var(--green); }
  .hwq .yn { margin:3px 0 0 14px; color:var(--muted); font-size:12px; } .hwq .yn b { color:var(--ink); font-weight:400; }
  .testrow select { width:auto; }
  .renB { padding:0 5px; margin-left:4px; font-size:12px; line-height:1.3; }
  /* Homework + Assessment tabs (2026-10-19) */
  .hwstrip { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .hwst { display:flex; flex-direction:column; align-items:flex-start; min-width:92px; padding:6px 12px; border-radius:8px; border-left:4px solid var(--muted); }
  .hwst b { font-size:20px; } .hwst.on { border-color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, var(--panel)); }
  .hwst.drafted { border-left-color:var(--gold); } .hwst.scheduled { border-left-color:var(--blue); } .hwst.live { border-left-color:var(--green); } .hwst.due { border-left-color:var(--orange); } .hwst.marked { border-left-color:var(--muted); }
  .hwpill.st-drafted { color:var(--gold); } .hwpill.st-scheduled { color:var(--blue); } .hwpill.st-live { color:var(--green); } .hwpill.st-due { color:var(--orange); } .hwpill.st-marked { color:var(--muted); }
  .hwitem { border-top:1px solid var(--line); padding:8px 10px; font-size:13px; }
  .hwih { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .hwbar { display:flex; gap:3px; margin-top:5px; } .hwbar span { flex:1; text-align:center; font-size:11px; padding:2px 0; border-radius:4px; background:var(--panel); color:var(--muted); border:1px solid var(--line); }
  .hwbar span.past { background:color-mix(in srgb, var(--green) 25%, var(--panel)); color:var(--ink); } .hwbar span.now { background:var(--gold); color:#0D1B5E; font-weight:700; border-color:var(--gold); }
  .asrow { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
  .aschips { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .chk { font-size:11.5px; border-radius:10px; padding:1px 8px; border:1px solid currentColor; }
  .chk.ok { color:var(--green); } .chk.ok::before { content:"¹3 "; } .chk.no { color:var(--orange); } .chk.in { color:var(--muted); }
  .aslessons, .aslong { display:flex; flex-direction:column; gap:2px; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--panel2); }
  .aslong label { padding:4px 0; border-bottom:1px solid var(--line); line-height:1.35; }
  .assum { margin:10px 0; padding:8px 10px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); font-size:13px; }
  .cov { margin:6px 0; font-size:12.5px; }
  .covrow { display:grid; grid-template-columns:minmax(120px, 34%) 1fr 44px; gap:8px; align-items:center; margin-top:3px; font-size:12.5px; }
  .covrow span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .covrow i { height:10px; border-radius:5px; background:var(--blue); display:block; min-width:2px; }
  .covrow i.lo { background:var(--red); } .covrow i.mid { background:var(--orange); } .covrow i.hi { background:var(--green); }
  .asres { display:flex; gap:6px; flex-wrap:wrap; } .asResB { border-left:5px solid var(--c); text-align:left; } .asResB small { display:block; color:var(--muted); } .asResB.on { border-color:var(--gold); }
  .resh { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; } .resh div { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:90px; }
  .resh b { font-size:20px; display:block; } .resh small { color:var(--muted); }
  .hist { display:flex; gap:4px; align-items:flex-end; height:130px; border-bottom:1px solid var(--line); padding-top:14px; }
  .hist > div { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
  .hist i { width:100%; background:var(--blue); border-radius:4px 4px 0 0; position:relative; min-height:1px; } .hist i span { position:absolute; top:-15px; left:0; right:0; text-align:center; font-size:11px; font-style:normal; }
  .hist small { font-size:11px; color:var(--muted); margin-top:2px; }
  .restab { border-collapse:collapse; width:100%; font-size:13px; } .restab td, .restab th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }
  .tab h4 { margin:14px 0 4px; font-size:14px; }
  #side .lbl { display:flex; align-items:center; gap:4px; }
  .testrow { display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  /* Behaviour, built in (2026-10-12) */
  .bwrap { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start; }
  .bplan { position:relative; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .bgrid { display:flex; flex-wrap:wrap; gap:8px; padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .bname { background:var(--chip); color:var(--ink); border:2px solid transparent; border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; cursor:pointer; text-align:center; min-width:84px; }
  .bplan .bname { position:absolute; transform:translate(-50%,-50%); }
  .bname:hover { border-color:var(--gold); } .bname.prompt { border-color:var(--blue); } .bname.extend { border-color:#AB47BC; }
  .bname .n { display:block; font-size:11px; font-weight:700; } .bname .p { color:var(--green); } .bname .m { color:var(--red); }
  .bmode button.on { background:var(--gold); color:#111; border-color:var(--gold); }
  .blog { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; max-height:calc(100vh - 190px); overflow-y:auto; font-size:13px; }
  .blog .r { display:flex; gap:6px; align-items:center; padding:3px 0; border-bottom:1px solid var(--line); }
  .blog .r .x { margin-left:auto; cursor:pointer; color:var(--muted); }
  .rules button { display:block; width:100%; text-align:left; margin:4px 0; }
  .f-beh { color:var(--green); } .f-none { color:var(--muted); } .f-hw { color:#1565C0; }
  .flag.f-own { color:var(--green); } .flag.f-reuse { color:var(--blue); }
  #status.dirty::before { content:"\25CF  "; color:var(--gold); }
  .menuwrap { position:relative; }
  #menu { display:none; position:absolute; right:0; top:34px; background:var(--panel); border:1px solid var(--line); border-radius:8px; min-width:250px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:10; }
  #menu.on { display:block; }
  #menu button { display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--ink); padding:8px 10px; }
  #menu button:hover { background:var(--hover); }
  #menu small { color:var(--muted); display:block; font-size:11px; }
  #menu hr { border:none; border-top:1px solid var(--line); margin:4px 0; }
  main { display:grid; grid-template-columns:1fr 410px; gap:12px; padding:12px; }
  main.full { grid-template-columns:1fr; }
  .cal { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .grid { display:grid; }
  .hcell { padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); cursor:pointer; }
  .hcell b { display:block; font-size:20px; color:var(--ink); font-weight:400; }
  .hcell.today b { background:var(--gold); color:#0D1B5E; border-radius:50%; width:36px; height:36px; line-height:36px; margin:2px auto 0; font-weight:700; }
  .hcell.off { background:var(--off); }
  .tcell { font-size:11px; color:var(--muted); text-align:right; padding:6px 6px 0 0; border-right:1px solid var(--line); }
  .allday { border-bottom:2px solid var(--line); min-height:34px; padding:3px; border-right:1px solid var(--line); }
  .chip { display:flex; gap:4px; align-items:center; font-size:11px; border-radius:4px; padding:2px 5px; margin:2px 0; background:var(--chip); color:var(--ink); cursor:pointer; }
  .chip.mine { opacity:.75; cursor:default; }
  .chip .x { margin-left:auto; opacity:.5; }
  .addx { font-size:11px; color:var(--muted); cursor:pointer; padding:1px 4px; visibility:hidden; }
  .allday:hover .addx { visibility:visible; }
  .slotcell { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:3px; min-height:92px; position:relative; }
  .slotcell.off { background:var(--off); }
  .slotcell.empty:hover { background:var(--hover); cursor:pointer; }
  .slotcell.empty:hover::after { content:"+ add"; position:absolute; top:6px; left:8px; font-size:11px; color:var(--muted); }
  .slotcell.over { outline:3px dashed var(--gold); outline-offset:-3px; }
  .ev { height:100%; min-height:84px; border-radius:6px; padding:5px 7px 5px 9px; font-size:12px; cursor:pointer; position:relative; border-left:5px solid var(--c); background:color-mix(in srgb, var(--c) 16%, var(--panel)); }
  .ev.sel { outline:3px solid var(--gold); }
  .ev .top { display:flex; gap:6px; align-items:center; }
  .ev .cls { font-weight:700; color:color-mix(in srgb, var(--c) 55%, var(--ink)); }
  .ev .tm { color:var(--muted); font-size:11px; }
  .ev .les { font-weight:700; margin:2px 0; line-height:1.25; }
  .ev .eq { color:var(--muted); font-size:11px; }
  .ev.kind-inset, .ev.kind-na { --c:#757575; color:var(--muted); }
  .ev.kind-test { background:color-mix(in srgb, var(--red) 18%, var(--panel)); }
  .ev.kind-revision { background:color-mix(in srgb, var(--blue) 16%, var(--panel)); }
  .ev.kind-cover { background:color-mix(in srgb, var(--orange) 16%, var(--panel)); }
  .ev.kind-free { background:var(--panel); border-left-style:dashed; color:var(--muted); }
  .ev.kind-taught { --c:var(--green); cursor:default; }
  .flags { display:flex; gap:3px; flex-wrap:wrap; margin-top:3px; }
  .flag { font-size:10px; font-weight:700; border-radius:3px; padding:0 4px; border:1px solid currentColor; }
  .f-check { color:var(--orange); } .f-built { color:var(--red); } .f-carry { color:var(--green); } .f-dbl { color:var(--blue); } .f-gap { color:var(--gold); }
  .brk { grid-column:1 / -1; font-size:10px; color:var(--muted); background:var(--off); padding:2px 8px; border-bottom:1px solid var(--line); }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; align-self:start; position:sticky; top:62px; max-height:calc(100vh - 80px); overflow:auto; }
  aside h2 { margin:0 0 6px; font-size:15px; color:var(--gold); }
  details { border-top:1px solid var(--line); margin-top:10px; padding-top:6px; }
  summary { cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); padding:4px 0; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  select, input[type=text], textarea { width:100%; font-family:inherit; font-size:13px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--ink); }
  textarea { min-height:50px; resize:vertical; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .muted { color:var(--muted); font-size:12px; }
  .results { border:1px solid var(--line); border-radius:6px; max-height:240px; overflow:auto; margin-top:4px; }
  .res { padding:6px 8px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .res:hover, .res.hi { background:var(--hover); }
  .res small { color:var(--muted); display:block; }
  .res.next { border-left:3px solid var(--gold); }
  .res.done { opacity:.55; }
  /* side panel: technician card + the whole-topic lesson list */
  .now { margin:2px 0 4px; font-size:14px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; }
  .card h4 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .card .src { font-weight:400; text-transform:none; letter-spacing:0; }
  .card .src.guess { color:var(--orange); font-weight:700; }
  .card textarea { min-height:96px; font-size:13.5px; line-height:1.4; }
  .newles { width:100%; margin-top:6px; border-style:dashed; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  label.inline { display:flex; gap:6px; align-items:center; margin:6px 0 0; }
  .lessonlist { border:1px solid var(--line); border-radius:6px; margin-top:6px; max-height:calc(100vh - 520px); min-height:220px; overflow:auto; background:var(--panel); }
  .lrow { display:flex; align-items:flex-start; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.3; }

<!--GAME_UI-->
<script>
const KEY = <?!= JSON.stringify(key) ?>;   // the key is letters and numbers only, so unescaped output is safe
const APP_URL = <?!= JSON.stringify(appUrl) ?>;   // this web app: phone page = ?key=..&view=phone, board = &view=board
const P = window.PlannerLogic;
const COLS = ['B', 'F', 'J', 'N', 'R'];
let S = { data:null, weeks:{}, learned:{}, hasTemplate:false, monday:null, week:null, undo:[], sel:-1, dirty:false, view:'week', day:0, mine:null, showMine:false, readOnly:false, chooser:{} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const status = (t) => { $('status').textContent = t; $('status').classList.toggle('dirty', S.dirty); };
const run = (fn, ...args) => new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](KEY, ...args));
const todayMidnight = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ------------------------------------------------------------------ theme */
function applyTheme() { const light = store.get('planner-theme') === 'light'; document.body.classList.toggle('light', light); $('mTheme').textContent = light ? 'Dark mode' : 'Light mode'; }
applyTheme();

/* ------------------------------------------------------------------ toast */
let toastTimer = null;
function toast(msg, canUndo) {
  $('toastMsg').textContent = msg; $('toastUndo').style.display = canUndo ? '' : 'none';
  $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 6000);
}
$('toastUndo').onclick = () => { undo(); $('toast').classList.remove('on'); };

/* ------------------------------------------------------------------ weeks */
function firstPlanMonday() {
  const t = new Date(); const d = t.getDay();
  let m = P.mondayOf(P.addDays(t, d === 0 ? 1 : d === 6 ? 2 : 7));
  const lastFilled = (S.data.filledWeeks || []).slice(-1)[0];
  while (lastFilled && P.iso(m) <= lastFilled) m = P.addDays(m, 7);
  return m;
}
// Changes save by themselves (Patryk 2026-10-04: make it easy). Leaving a week saves it first.
function leaveOk() { if (S.dirty) save(); return true; }
// A week he filled in Planner.xlsx is shown exactly as he filled it (taught), read only.
function filledWeek(mon) {
  const rows = (S.data.filled || {})[P.iso(mon)];
  if (!rows) return null;
  return { monday: P.iso(mon), letter: P.weekLetter(S.data, mon), extras: [], taught: true,
    slots: rows.map((r) => ({ day: r.day, period: r.period, col: r.col, cls: r.cls, kind: 'taught', text: r.text || '(blank)', eq: '', notes: [], carry: [] })) };
}
function loadWeek(mon) {
  S.monday = P.mondayOf(mon); S.sel = -1; S.undo = []; S.dirty = false; S.mine = null; S.chooser = {};
  // Patryk 2026-10-08: every week can be changed, past and future, and the planner is the record.
  // A Planner.xlsx week opens as an ordinary week (its lessons pinned); his edits replace it.
  const saved = S.weeks[P.iso(S.monday)];
  const fromXlsx = !saved && !!(S.data.filled || {})[P.iso(S.monday)];
  S.readOnly = false;
  let w = saved ? JSON.parse(JSON.stringify(saved)) : fromXlsx ? P.fromFilled(S.data, S.monday) : P.autofill(S.data, S.weeks, S.monday, S.learned);
  // this week and later weeks follow any change made earlier: periods not placed by hand move along
  const thisMon = P.mondayOf(todayMidnight());
  if (saved && S.monday >= thisMon) {
    const fromDay = P.iso(S.monday) === P.iso(thisMon) ? Math.max(0, (todayMidnight().getDay() + 6) % 7) : 0;
    w = P.reflowWeek(S.data, S.weeks, w, S.learned, fromDay);
  }
  S.week = w;
  S.week.extras = S.week.extras || []; S.week.marks = S.week.marks || [];
  status(fromXlsx ? 'From your Planner.xlsx: change anything, it saves as you go' : saved ? 'Saved' : 'Planned automatically (saves when you change something)');
  $('jump').value = P.iso(S.monday);
  render(); editor();
  if (S.showMine) loadMine();
  loadBehWeek();
}
let saveTimer = null;
// quiet: a detail edit (equipment, notes): redraw the grid only, so the box being typed in stays put
function change(newWeek, msg, quiet) {
  if (S.readOnly) { toast('This week is already taught, so it can\'t be changed here'); return; }
  S.undo.push(JSON.stringify({ w: S.week, r: S.recSnap })); S.recSnap = JSON.stringify(S.data.records || []); S.week = newWeek; S.week.extras = S.week.extras || []; S.dirty = true;
  markGaps(); render(); if (!quiet) editor(); if (msg) toast(msg, true);
  status('Saving...'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
}
function undo() {
  if (!S.undo.length) { toast('Nothing to undo'); return; }
  const u = JSON.parse(S.undo.pop()); S.week = u.w; S.data.records = JSON.parse(u.r || '[]'); S.recSnap = u.r; S.dirty = true; markGaps(); render(); editor();
  status('Saving...'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
}
function save() {
  clearTimeout(saveTimer);
  if (S.readOnly || !S.dirty) return Promise.resolve();
  const wk = JSON.parse(JSON.stringify(S.week));          // this week, even if he moves on before it lands
  S.dirty = false; status('Saving...');
  const recs = JSON.stringify(S.data.records || []);
  return run('saveWeek', wk).then(() => {
    S.weeks[wk.monday] = wk; if (S.week.monday === wk.monday) status(S.dirty ? 'Saving...' : 'All changes saved');
    if (recs !== S.recSaved) run('saveLessons', JSON.parse(recs)).then(() => { S.recSaved = recs; });
    // slide-over (2026-10-12): later saved weeks re-plan now, not only when opened
    const moved = P.cascade(S.data, S.weeks, wk.monday, todayMidnight(), S.learned);
    if (moved.length) run('saveWeeks', moved).then(() => toast('Later weeks moved along: w/c ' + moved.map((x) => fmtDate(x.monday)).join(', ')))
      .catch((e) => status('Later weeks NOT saved: ' + e.message));
  })
    .catch((e) => { if (S.week.monday === wk.monday) S.dirty = true; status('NOT saved: ' + e.message + ' (Ctrl+S to try again)'); });
}

/* ------------------------------------------------------------------ render */
function timeLabel(p) {
  const a = (S.data.periodTimes.ks3['P' + p] || '').split('-')[0], b = (S.data.periodTimes.ks4['P' + p] || '').split('-')[0];
  return 'P' + p + '<br>' + (a === b ? a : a + '<br>' + b);
}
function setViewButtons() {
  ['Week', 'Day', 'Classes', 'Homework', 'Tests', 'Behaviour', 'Rituals'].forEach((v) => $('v' + v).classList.toggle('on', S.view === v.toLowerCase()));
  const wide = !['week', 'day'].includes(S.view);
  $('main').classList.toggle('full', wide);
  $('ed').style.display = wide ? 'none' : '';
  document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
}
function render() {
  if (S.view !== 'rituals') { const gg = $('grid'); if (gg) gg.dataset.ul = ''; }
  setViewButtons();
  const mon = S.monday, today = P.iso(todayMidnight());
  $('wkLabel').textContent = (S.view === 'day' ? P.DAYS[S.day] + ' ' : 'w/c ') + P.addDays(mon, S.view === 'day' ? S.day : 0).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  $('letter').textContent = S.readOnly ? 'Week ' + S.week.letter + ' · taught' : 'Week ' + S.week.letter;
  $('letter').classList.toggle('taught', S.readOnly);
  if (S.view === 'classes') return renderClasses();
  if (S.view === 'homework') return renderHomework();
  if (S.view === 'tests') return renderTests();
  if (S.view === 'behaviour') return renderBehaviour();
  if (S.view === 'rituals') return renderRituals();
  const days = S.view === 'day' ? [S.day] : [0, 1, 2, 3, 4];
  const g = $('grid');
  g.className = 'grid';
  g.style.gridTemplateColumns = '64px repeat(' + days.length + ', 1fr)';
  let h = '<div class="hcell"></div>';
  days.forEach((d) => {
    const date = P.addDays(mon, d);
    const off = !P.isTeachingDay(S.data, date);
    h += '<div class="hcell' + (P.iso(date) === today ? ' today' : '') + (off ? ' off' : '') + '" data-day="' + d + '" title="Open this day">' + P.DAYS[d].toUpperCase() + '<b>' + date.getDate() + '</b></div>';
  });
  h += '<div class="tcell" style="padding-top:8px">All day</div>';
  days.forEach((d) => {
    h += '<div class="allday" data-day="' + d + '">';
    (S.week.extras || []).forEach((x, k) => { if (x.day === d) h += '<div class="chip" data-x="' + k + '" title="Click to remove">' + esc(x.kindLabel || '') + ' ' + esc(x.text) + '<span class="x">&#10005;</span></div>'; });
    (S.showMine && S.mine || []).forEach((e) => { if (e.day === d) h += '<div class="chip mine" title="From your Google Calendar">' + (e.time ? esc(e.time) + ' ' : '') + esc(e.title) + '</div>'; });
    if (!S.readOnly) h += '<span class="addx" data-add="' + d + '">+ task / marking / meeting</span>';
    h += '</div>';
  });
  for (let p = 1; p <= 5; p++) {
    if (p === 2) h += '<div class="brk">Break: KS3 10:00-10:25 · KS4/5 11:05-11:30</div>';
    if (p === 4) h += '<div class="brk">Lunch: KS3 12:30-13:15 · KS4/5 13:30-14:15</div>';
    h += '<div class="tcell">' + timeLabel(p) + '</div>';
    days.forEach((d) => {
      const off = !P.isTeachingDay(S.data, P.addDays(mon, d));
      const i = S.week.slots.findIndex((s) => s.day === d && s.period === p);
      if (i < 0) { h += '<div class="slotcell' + (S.readOnly ? '' : ' empty') + (off ? ' off' : '') + '" data-day="' + d + '" data-p="' + p + '"></div>'; return; }
      const s = S.week.slots[i];
      const c = S.data.classes[s.cls] || {};
      const flags = [];
      if (s.double) flags.push('<span class="flag f-dbl">DOUBLE</span>');
      if (s.cover) flags.push('<span class="flag f-check" title="Cover work for this lesson: counts as taught">COVER</span>');
      if (s.kind === 'lesson' && s.nofolder) flags.push('<span class="flag f-built" title="In the technician guide but no lesson folder on Drive">NO FOLDER</span>');
      else if (s.own) flags.push('<span class="flag f-own" title="You made this one yourself: never sent to Claude">YOURS</span>');
      else if (s.sameAs) flags.push('<span class="flag f-reuse" title="Claude copies and adapts this class\'s lesson">REUSES ' + esc(s.sameAs.cls) + '</span>');

      else if (bh && bh.over && S.bWeek.length) flags.push('<span class="flag f-none bjump" data-cls="' + esc(s.cls) + '" title="Nothing logged for this lesson. Click to add">no behaviour</span>');
      const hr = s.kind === 'lesson' ? P.lastResults(S.results, s.cls, P.iso(P.addDays(mon, d))) : null;   // learning loop M8
      if (hr) flags.push('<span class="flag f-hw" title="' + esc('Last homework: ' + hr.title + ' (due ' + hr.dueOn + '), ' + hr.done + (hr.size ? ' of ' + hr.size : '') + ' done, average ' + hr.avg + '%. Weakest: ' +

// Homework (2026-10-18, design-audit/planner-tabs/spec.md 1.2 and homework-replica/05-design.md 2):

const HW_MSG = {

const hwFileRe = /^homework-([A-Za-z0-9]+)-(\d{4}-\d{2}-\d{2})(?:-([a-z]+))?\.json$/;

function hwPoints(hw) {
  if (hw.points != null) return hw.points;
  return (hw.questions || []).reduce((t, q) => t + (q.type === 'mcq' ? (q.points || 1) : (q.markPoints || []).length ? q.markPoints.reduce((a, p) => a + (p.marks || 0), 0) : (q.marks || 0)), 0);
}
function hwMinutes(hw) { return hw.minutes || Math.max(5, Math.round(hwPoints(hw) * (hw.board === 'OCR A' ? 1.2 : 1))); }

// this class's quiz files, newest due date first
function hwQuizzesFor(cls) {

  const setOn = set ? set.date : P.iso(todayMidnight());

  return { file: first ? first.name : '', setOn, due: d.due, why: d.why, auto: true, send: 'draft', postDate: setOn, postTime: P.lessonEnd(S.data, cls, setOn) || '15:30' };

      // topics with no test folder in Admin/Assessment get revision only: listed so he can add tests
      (() => { const miss = [...new Set(c.seq.filter((L) => L.hasTest === false && !/^introduction/i.test(L.topic)).map((L) => L.topic))];
        return miss.length ? '<div class="muted" style="color:var(--orange)">No test in Admin/Assessment for: ' + miss.map(esc).join(', ') + '</div>' : ''; })() +
      // settings typed once: test papers for the technicians, and notes that go with every build request
      (() => { const cs = (S.classSettings || {})[cls] || {};
        return '<details class="csBox" data-c="' + esc(cls) + '"><summary>Settings for ' + esc(cls) + '</summary>' +
          '<div class="row" style="align-items:center;gap:6px">Test papers: core <input type="number" min="0" class="csCore" value="' + (cs.core != null ? cs.core : '') + '" style="width:56px"> challenge <input type="number" min="0" class="csChal" value="' + (cs.challenge != null ? cs.challenge : '') + '" style="width:56px">' +
          '<select class="csPaper">' + ['', 'A4', 'A3', 'A4 enlarged to A3'].map((p) => '<option' + ((cs.paper || '') === p ? ' selected' : '') + ' value="' + p + '">' + (p || 'paper size') + '</option>').join('') + '</select></div>' +
          '<label>Notes for Claude (go with every lesson request for ' + esc(cls) + ')</label><textarea class="csNotes" style="min-height:44px">' + esc(cs.notes != null ? cs.notes : (c.profile || '')) + '</textarea></details>'; })() +
      shown.map((r) => {
        const core = r.lessons.filter((l) => !l.optional);
        const done = core.filter((l) => l.done).length;
        return '<div class="topic"><div class="tt">' + esc(r.topic) + ' <span>' + r.state + (r.tested ? ', tested' : r.revised ? ', revised' : '') + ' · ' + done + '/' + core.length + '</span></div>' +
          '<div class="les-list">' + r.lessons.map((l) => '<span class="lp ' + (l.skipped ? 'opt' : l.done ? 'done' : l.optional ? 'opt' : r.state === 'current' ? 'miss' : r.state === 'finished' ? 'skip' : '') +
            '" title="' + esc('L' + l.num + ' ' + l.title + (l.optional ? ' (optional)' : '') + (l.nofolder ? ' (no folder)' : '') + (l.done ? ' · ' + whenText(l.when) : r.state === 'finished' && !l.optional ? ' · NEVER TAUGHT (topic finished)' : '')) + '">L' + l.num + '</span>').join('') + '</div></div>';
      }).join('') + '</div>';
  }).join('') + '<div class="muted" style="grid-column:1/-1">Settings: open a class\'s settings to set its test papers and notes for Claude. Green = taught. Gold outline = still to teach in the topic you\'re on (the planner fills these first). Dashed = optional (only planned if you pick it). Red, crossed out = never taught in a topic you have finished: tick it in the lesson list if you did teach it. Hover a lesson number for its title and when it was taught. Counts are up to w/c ' + mon.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + '.</div>';
  // save a class's settings as soon as a box is left
  g.querySelectorAll('.csBox').forEach((box) => {
    const cls = box.dataset.c;
    const num = (el) => (el.value === '' ? null : +el.value);
    const save = () => {
      const obj = { core: num(box.querySelector('.csCore')), challenge: num(box.querySelector('.csChal')), paper: box.querySelector('.csPaper').value, notes: box.querySelector('.csNotes').value.trim() };
      S.classSettings = S.classSettings || {}; S.classSettings[cls] = obj;
      run('saveClassSetting', cls, obj).then(() => status(cls + ' settings saved')).catch((e) => toast('Not saved: ' + e.message));
    };
    box.querySelectorAll('input,select,textarea').forEach((el) => el.onchange = save);
  });
}

/* ------------------------------------------------------------------ modals */
function modal(html) { $('mbox').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }
$('modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };

function askMove(from, to) {
  if (from === to || isNaN(from)) return;
  const a = S.week.slots[from], b = S.week.slots[to];
  const same = a.cls === b.cls;
  // Every option re-flows the class's other lessons, so whatever was in the target slot is never lost.
  modal('<h3>Move ' + esc(a.cls) + ': ' + esc(P.lessonCell(S.data, a)) + '</h3>' +
    '<p class="muted">to ' + P.DAYS[b.day] + ' P' + b.period + ' (' + esc(b.cls) + ', now ' + esc(P.lessonCell(S.data, b)) + ')</p>' +
    '<div class="row"><button class="primary" id="mMove">Move it here</button><button id="mSwap">Swap the two</button><button id="mCancel">Cancel</button></div>' +
    '<p class="muted">' + (same ? 'Move: ' + esc(a.cls) + '\'s other lessons this week move along in order, so nothing is skipped.' : 'Move: ' + esc(b.cls) + '\'s lesson moves on to its next free slot, so it is not lost.') + '</p>');
  const go = (mode, msg) => {
    closeModal();
    const nw = P.moveSlot(S.data, S.weeks, S.week, from, to, mode, S.learned);
    change(nw, msg + reflowNote(S.week, nw, b.cls, to) + (same ? '' : reflowNote(S.week, nw, a.cls, from)));
  };
  $('mMove').onclick = () => go(same ? 'shift' : 'move', 'Moved');
  $('mSwap').onclick = () => go('swap', 'Swapped');
  $('mCancel').onclick = closeModal;
}
function moveToEmpty(from, day, period) {
  const w = JSON.parse(JSON.stringify(S.week));
  const a = w.slots[from];
  const moved = Object.assign({}, a, { day, period, col: COLS[period - 1], double: false, pinned: true });
  Object.assign(a, { kind:'free', i:null, key:null, unit:null, text:'Free', eq:'', sets:null, print:'', notes:[], carry:[], double:false, pinned: true });
  w.slots.push(moved);
  w.slots.sort((x, y) => x.day - y.day || x.period - y.period);
  P.refillClass(S.data, S.weeks, w, moved.cls, S.learned, Math.min(w.slots.indexOf(a), w.slots.indexOf(moved)));
  change(w, 'Moved to ' + P.DAYS[day] + ' P' + period);
}
function addExtra(day) {
  modal('<h3>Add to ' + P.DAYS[day] + '</h3><label>What</label><input type="text" id="xText" placeholder="e.g. Mark 9XS Particles tests">' +
    '<label>Type</label><select id="xKind"><option value="task">Task</option><option value="marking">Tests to mark</option><option value="meeting">Meeting</option><option value="deadline">Deadline</option></select>' +
    '<div class="row"><button class="primary" id="xAdd">Add</button><button id="xCancel">Cancel</button></div>');

    w.extras.push({ day, text, kind, kindLabel: labels[kind] }); closeModal(); change(w, 'Added "' + text + '"');
  };
  $('xAdd').onclick = add; $('xText').onkeydown = (e) => { if (e.key === 'Enter') add(); };
  $('xCancel').onclick = closeModal;
}

/* ------------------------------------------------------------- side panel */
// Patryk 2026-10-04: the change-lesson box shows EVERY lesson of the topic in order, with what is
// taught (and when, and what he wrote), what is planned this week, and what is still to teach, so he
// chooses with the whole picture. Ticks fix the record. The technician details sit above it,
// always visible, and save as he types.
const fmtDate = (d) => { if (!d) return ''; const x = P.parse(d); return x.getDate() + ' ' + x.toLocaleDateString('en-GB', { month:'short' }); };
function whenText(w) {
  if (!w) return 'taught';
  if (w.wrote === 'ticked off') return 'ticked off by you';
  if (w.wrote === 'planner') return 'planned w/c ' + fmtDate(P.iso(P.mondayOf(P.parse(w.date))));
  return 'taught ' + fmtDate(w.date) + (w.wrote ? ' · you wrote "' + w.wrote + '"' : '');
}
const slotName = (k) => { const s = S.week.slots[k]; return P.DAYS[s.day] + ' P' + s.period; };
function unitOptions(cls) {
  const rep = P.classReport(S.data, S.weeks, S.monday, cls, S.week);
  const seen = {};
  return rep.map((r) => {
    seen[r.topic] = (seen[r.topic] || 0) + 1;
    const label = r.state === 'current' ? 'now' : r.state === 'finished' ? 'finished' + (r.tested ? ', tested' : '') : r.state;
    return { unit: r.unit, state: r.state, text: r.topic + (seen[r.topic] > 1 ? ' (part ' + seen[r.topic] + ')' : '') + ' · ' + label };
  });
}
// The lesson chooser. pos = {day, period} of the slot; curI = the lesson in it now (or null).
function chooser(cls, pos, curI, onPick, onReview) {
  const c = S.data.classes[cls]; if (!c) return;
  const units = unitOptions(cls);
  const def = curI != null && c.seq[curI] ? c.seq[curI].unit : ((units.find((u) => u.state === 'current') || units.find((u) => u.state !== 'finished') || units[0]) || {}).unit;
  if (S.chooser.cls !== cls || S.chooser.pos !== pos.day + '-' + pos.period) S.chooser = { cls, pos: pos.day + '-' + pos.period, unit: def };
  $('chooser').innerHTML =
    '<div class="row" style="margin-top:0"><select id="cUnit" style="flex:1">' + units.map((u) => '<option value="' + esc(u.unit) + '"' + (u.unit === S.chooser.unit ? ' selected' : '') + '>' + esc(u.text) + '</option>').join('') + '</select></div>' +
    '<input type="text" id="q" placeholder="or search every topic, e.g. heart" style="margin-top:6px">' +
    '<div class="lessonlist" id="qr"></div>' +
    '<button class="newles" id="newLes">+ New lesson in this topic (not in the list)</button>' +
    (onReview ? '<button class="newles" id="revLes" title="Puts a revision lesson for this topic here: Claude builds it, or you have made it yourself">★ Revision lesson for this topic</button>' : '') +
    '<div class="muted" style="margin-top:4px">Click a lesson to put it here. Tick = taught. <b>skip</b> = you won\'t teach it. Untick, or undo a skip, and it goes back into the plan. Every week can be changed, past ones too.</div>';
  const row = (o, topic) => {
    const here = o.k === curI;
    const tags = [];
    if (here) tags.push('<span class="tag here">in this slot</span>');
    else if (o.next) tags.push('<span class="tag next">★ next</span>');
    if (o.state === 'planned' && !here) tags.push('<span class="tag planned">' + o.slots.map(slotName).join(', ') + '</span>');
    if (o.optional) tags.push('<span class="tag opt">optional</span>');
    if (o.nofolder) tags.push('<span class="tag nof" title="In the technician guide, but there is no lesson folder on Drive">no folder</span>');
    else if (o.built === false) tags.push('<span class="tag nof">not built</span>');
    const sub = o.state === 'skipped' ? 'skipped (won\'t be planned) · <a href="#" class="unskip" data-k="' + o.k + '">undo</a>'
      : o.state === 'done' ? '✓ taught ' + esc(fmtDate(o.when.date)) + ' · untick if it didn\'t happen' : o.state === 'taught' ? '✓ ' + esc(whenText(o.when)) : o.mark && o.mark.done === false ? 'you marked this NOT taught' : '';
    const stopped = o.stoppedAt ? '<small>partly taught: stopped at ' + esc(o.stoppedAt) + '</small>' : '';
    // Skip (2026-10-08): never planned, shown as skipped rather than taught
    if (['todo', 'planned'].includes(o.state) && !o.optional) tags.push('<button class="skipB" data-k="' + o.k + '" title="Won\'t teach it: it is not planned, and shows as skipped">skip</button>');
    return '<div class="lrow ' + o.state + (o.next && !here ? ' next' : '') + (here ? ' here' : '') + (o.optional ? ' optional' : '') + '">' +
      '<input type="checkbox" class="tick" data-k="' + o.k + '"' + (o.state === 'taught' || o.state === 'done' ? ' checked' : '') + ' title="' + (o.state === 'done' ? 'Untick: it did not happen, so it moves to the next lesson' : o.state === 'taught' ? 'Untick: NOT taught after all, so it gets planned' : o.state === 'planned' ? 'Tick: already taught, so the rest of this week moves along' : 'Tick: already taught, or you won\'t teach it') + '">' +
      '<div class="body" data-k="' + o.k + '"><span class="num">L' + o.num + '</span><span class="t">' + esc(o.title) + '</span>' + (c.seq[o.k] && c.seq[o.k].added ? '<button class="renB" data-k="' + o.k + '" title="Rename this lesson you added (the Drive folder keeps its name)">✎</button>' : '') + tags.join('') +
      (topic ? '<small>' + esc(topic) + '</small>' : '') + (sub ? '<small>' + sub + '</small>' : '') + stopped + '</div></div>';
  };
  const draw = () => {
    const q = $('q').value.trim().toLowerCase();
    let html;
    if (!q) html = P.topicList(S.data, S.weeks, S.week, cls, S.chooser.unit, pos, S.learned, P.iso(todayMidnight())).map((o) => row(o)).join('');
    else {
      const words = q.split(/\s+/);
      html = units.flatMap((u) => P.topicList(S.data, S.weeks, S.week, cls, u.unit, pos, S.learned, P.iso(todayMidnight())).map((o) => ({ o, u })))
        .filter(({ o, u }) => words.every((w) => (o.title + ' ' + u.text + ' l' + o.num).toLowerCase().includes(w)))
        .slice(0, 40).map(({ o, u }) => row(o, u.text)).join('');
    }
    $('qr').innerHTML = html || '<div class="lrow muted">No lessons match</div>';
    $('qr').querySelectorAll('.body').forEach((el) => el.onclick = (e) => { if (e.target.closest('.skipB,.unskip,.renB')) return; onPick(+el.dataset.k); });
    // rename a lesson he added (spec 3.1): the planner's name only, the Drive folder keeps its name
    $('qr').querySelectorAll('.renB').forEach((el) => el.onclick = (e) => {
      e.stopPropagation();
      const L = c.seq[+el.dataset.k], first = L.origKey ? L.origKey.split('|').slice(1).join('|') : L.title;
      const rec = S.added.find((a) => a.cls === cls && a.unit === L.unit && (a.title === first || a.name === L.title));
      const nm = (prompt('New name for L' + L.num + ' (the Drive folder keeps its old name):', L.title) || '').trim();
      if (!nm || nm === L.title || !rec) return;
      run('renameAdded', cls, L.unit, rec.title, nm).then(() => { rec.name = nm; P.applyAdded(S.data, [rec]); draw(); render(); toast('Renamed to ' + nm); })
        .catch((x) => toast('Not renamed: ' + x.message));
    });
    $('qr').querySelectorAll('.skipB').forEach((el) => el.onclick = (e) => {
      e.stopPropagation(); const k = +el.dataset.k, L = c.seq[k];
      const nw = P.markLesson(S.data, S.weeks, S.week, cls, k, true, S.learned, true);
      change(nw, 'Skipped L' + L.num + ' ' + L.title + reflowNote(S.week, nw, cls, -1));
    });
    $('qr').querySelectorAll('.unskip').forEach((el) => el.onclick = (e) => {
      e.preventDefault(); e.stopPropagation(); const k = +el.dataset.k, L = c.seq[k];
      const nw = P.markLesson(S.data, S.weeks, S.week, cls, k, null, S.learned);
      change(nw, 'L' + L.num + ' ' + L.title + ' is back in the plan' + reflowNote(S.week, nw, cls, -1));
    });
    $('qr').querySelectorAll('.tick').forEach((el) => el.onchange = () => {
      const k = +el.dataset.k;
      const o = P.topicList(S.data, S.weeks, S.week, cls, c.seq[k].unit, pos, S.learned, P.iso(todayMidnight())).find((x) => x.k === k);
      if (o && o.state === 'done' && !el.checked) {   // planned on a day that has passed, but it didn't happen
        if (!shiftOk()) P.setRecord(S.data, cls, k, { done: true, skip: true });
        const nw = P.notHappened(S.data, S.weeks, S.week, o.slots, S.learned);
        change(nw, 'L' + c.seq[k].num + ' ' + c.seq[k].title + ' did not happen: it moves to the next lesson' + reflowNote(S.week, nw, cls, -1));
        return;
      }
      const m = (S.week.marks || []).find((x) => x.cls === cls && x.i === k);
      const done = el.checked ? (m && m.done === false ? null : true) : (m && m.done === true ? null : false);
      const L = c.seq[k];
      const nw = P.markLesson(S.data, S.weeks, S.week, cls, k, done, S.learned);
      change(nw, (el.checked ? 'Ticked off ' : 'Not taught: ') + 'L' + L.num + ' ' + L.title + reflowNote(S.week, nw, cls, -1));
    });
    const hi = $('qr').querySelector('.lrow.next .body') || $('qr').querySelector('.body');
    $('q').onkeydown = (e) => { if (e.key === 'Enter') { const f = q ? $('qr').querySelector('.body') : hi; if (f) onPick(+f.dataset.k); } };
  };
  $('cUnit').onchange = () => { S.chooser.unit = $('cUnit').value; $('q').value = ''; draw(); };
  $('newLes').onclick = () => newLesson(cls, S.chooser.unit, pos, onPick);
  if (onReview) $('revLes').onclick = () => onReview(S.chooser.unit);
  $('q').oninput = draw;
  draw();
}
// "Wed P3 is now L1 MRS GREN": what moved in a class's week after a change.
function reflowNote(oldW, newW, cls, except) {
  const out = [];
  newW.slots.forEach((s, k) => {
    const o = oldW.slots[k];
    if (k === except || s.cls !== cls || s.double || !o || (o.kind === s.kind && o.i === s.i)) return;
    out.push(P.DAYS[s.day] + ' P' + s.period + ' is now ' + (s.kind === 'lesson' ? 'L' + S.data.classes[cls].seq[s.i].num : P.lessonCell(S.data, s)));
  });
  return out.length ? '. ' + out.slice(0, 3).join(', ') : '';
}
// Slide-over confirmation (Patryk 2026-10-12): usually yes. No = the missed lesson is skipped and nothing moves.
function shiftOk() { return confirm('Shift later lessons forward?\n\nOK = yes, every later lesson moves along one.\nCancel = no, skip this lesson and keep the plan as it is.'); }
const shiftBox = '<label class="inline" style="display:block;margin-top:6px"><input type="checkbox" id="shiftOn" checked> Shift later lessons forward (untick: skip this lesson, nothing moves)</label>';
// Confirm before a change that would leave lessons untaught.
function okToSkip(lost, what) {
  if (!lost.length) return true;
  return confirm(what + ' would leave these lessons untaught:\n\n• ' + lost.slice(0, 12).join('\n• ') + (lost.length > 12 ? '\n• ...and ' + (lost.length - 12) + ' more' : '') +
    '\n\nOK = skip them (you can tick or untick them later). Cancel = keep them.');
}
// A lesson that is not in the list yet (Patryk 2026-10-05): it goes into the topic after the lesson he
// picks, gets an empty "Lesson 4a - Title" folder on Drive to build into, and goes in this period.
function newLesson(cls, unit, pos, onPick) {
  const c = S.data.classes[cls];
  const ls = c.seq.map((L, k) => ({ L, k })).filter((o) => o.L.unit === unit);
  if (!ls.length) return;
  const tl = P.topicList(S.data, S.weeks, S.week, cls, unit, pos, S.learned);
  const nx = tl.findIndex((o) => o.next);
  const def = nx > 0 ? tl[nx - 1].k : nx === 0 ? -1 : ls[ls.length - 1].k;      // after the lesson before ★ next
  const withRel = ls.find((o) => o.L.rel);
  const topicRel = withRel ? withRel.L.rel.split('/').slice(0, -1).join('/') : '';
  modal('<h3>New lesson: ' + esc(ls[0].L.topic) + '</h3>' +
    '<label>Title</label><input type="text" id="nlTitle" placeholder="e.g. Cell Models">' +
    '<label>Goes after</label><select id="nlAfter"><option value="-1">(start of the topic)</option>' + ls.map((o) => '<option value="' + o.k + '"' + (o.k === def ? ' selected' : '') + '>L' + o.L.num + ' ' + esc(o.L.title) + '</option>').join('') + '</select>' +
    (topicRel ? '<label class="inline"><input type="checkbox" id="nlFolder" checked> make an empty lesson folder on Drive to build into</label><div class="muted" id="nlName"></div>'
      : '<p class="muted">This topic has no folders on Drive yet, so it is added to the planner only.</p>') +
    '<div class="row"><button class="primary" id="nlAdd">Add and put it here</button><button id="nlCancel">Cancel</button></div>');
  const numFor = () => { const a = +$('nlAfter').value; return a < 0 ? '0a' : P.addedNum(S.data, cls, unit, c.seq[a].num); };
  const showName = () => { if ($('nlName')) $('nlName').textContent = 'Folder: Lessons/' + topicRel + '/Lesson ' + numFor() + ' - ' + ($('nlTitle').value.trim() || '...'); };
  $('nlTitle').oninput = showName; $('nlAfter').onchange = showName; showName(); $('nlTitle').focus();
  $('nlCancel').onclick = closeModal;
  $('nlAdd').onclick = () => {
    const title = $('nlTitle').value.trim(); if (!title) { $('nlTitle').focus(); return; }
    const a = +$('nlAfter').value, num = numFor();
    const info = { cls, unit, title, num, afterKey: a >= 0 ? P.lessonId(c.seq[a]) : '^start', topicRel, makeFolder: !!($('nlFolder') && $('nlFolder').checked), folderName: 'Lesson ' + num + ' - ' + title };
    $('nlAdd').disabled = true; $('nlAdd').textContent = 'Adding...';
    run('createLesson', info).then((r) => {
      closeModal();
      S.added.push(r.rec);
      P.applyAdded(S.data, [r.rec]);
      // the list positions after it moved up by one: point every week back at the same lessons
      P.remapWeek(S.data, S.week); Object.values(S.weeks).forEach((w) => P.remapWeek(S.data, w)); P.remapRecords(S.data); S.undo = [];
      const k = S.data.classes[cls].seq.findIndex((L) => L.unit === unit && L.title === title);
      toast(r.message);
      if (k >= 0) onPick(k);
    }).catch((e) => { $('nlAdd').disabled = false; $('nlAdd').textContent = 'Add and put it here'; toast('Not added: ' + e.message); });
  };
}
// Revision lesson or end-of-topic test, for the topic the class is in at this point (not the topic
// of whatever lesson was planned in the slot: 9AS's P3 test, not C1).
function revisionOrTest(kind, s, put) {
  const units = unitOptions(s.cls);
  const def = P.unitBefore(S.data, S.weeks, S.week, s.cls, s, S.learned) || (units.find((u) => u.state === 'current') || {}).unit;
  const label = kind === 'test' ? 'End-of-topic test' : 'Revision lesson';
  modal('<h3>' + label + ' for ' + esc(s.cls) + '</h3><label>Topic</label><select id="rtUnit">' +
    units.map((u) => '<option value="' + esc(u.unit) + '"' + (u.unit === def ? ' selected' : '') + '>' + esc(u.text) + '</option>').join('') + '</select>' +
    '<p class="muted">' + (kind === 'test' ? 'A test finishes the topic.' : 'A revision lesson ends the teaching; the test is planned next.') + ' This period\'s lesson moves on to ' + esc(s.cls) + '\'s next period.</p>' +
    '<div class="row"><button class="primary" id="rtOk">' + label + '</button><button id="rtCancel">Cancel</button></div>');
  $('rtCancel').onclick = closeModal;
  $('rtOk').onclick = () => {
    const u = $('rtUnit').value; closeModal();
    put(kind === 'test' ? P.testSlot(S.data, s.cls, u) : P.revisionSlot(S.data, s.cls, u), label + ' set', kind === 'test' ? 'A test now' : 'A revision lesson now');
  };
}
// End of a topic: a REVISION lesson in this period (Patryk 2026-10-09: what the planner called a
// "review lesson" is his revision lesson). Three ways: Claude builds it from the topic's own lessons,
// he has made it himself (never sent to Claude), or decide later (it is just planned).
function revisionLesson(s, unit, put) {
  const c = S.data.classes[s.cls];
  const units = unitOptions(s.cls);
  const def = unit || (units.find((u) => u.state === 'current') || units[0] || {}).unit;
  const others = S.week.slots.filter((x) => x.cls !== s.cls && x.kind === 'revision' && !x.double);
  modal('<h3>Revision lesson for ' + esc(s.cls) + '</h3><label>Topic</label><select id="rvUnit">' +
    units.map((u) => '<option value="' + esc(u.unit) + '"' + (u.unit === def ? ' selected' : '') + '>' + esc(u.text) + '</option>').join('') + '</select>' +
    '<p class="muted">Goes in ' + P.DAYS[s.day] + ' P' + s.period + '; this period\'s lesson moves on to ' + esc(s.cls) + '\'s next period. The test is planned after it.</p>' +
    '<label class="inline" style="display:block"><input type="radio" name="rvWho" value="claude" checked> Claude builds it from this topic\'s lessons, Do Nows and exam questions</label>' +
    '<label class="inline" style="display:block"><input type="radio" name="rvWho" value="own"> I have made it myself (not sent to Claude)</label>' +
    (others.length ? '<label class="inline" style="display:block"><input type="radio" name="rvWho" value="same"> Use the one for <select id="rvSame">' + others.map((x, n) => '<option value="' + n + '">' + esc(x.cls + ' ' + P.DAYS[x.day] + ' P' + x.period + ': ' + P.lessonCell(S.data, x)) + '</option>').join('') + '</select> (Claude adapts it)</label>' : '') +
    '<label class="inline" style="display:block"><input type="radio" name="rvWho" value="later"> Just plan it, decide later</label>' +
    '<label>Anything to focus on (optional)</label><input type="text" id="rvNote" placeholder="e.g. lots of 6-markers, they struggled with osmosis">' +
    '<div class="row"><button class="primary" id="rvOk">Put it here</button><button id="rvCancel">Cancel</button></div>');
  $('rvCancel').onclick = closeModal;
  $('rvOk').onclick = () => {
    const u = $('rvUnit').value, who = (document.querySelector('input[name=rvWho]:checked') || {}).value || 'later';
    const note = $('rvNote').value.trim(); closeModal();
    const fields = P.revisionSlot(S.data, s.cls, u);
    if (who === 'own') fields.own = true;
    if (who === 'same') { const x = others[+$('rvSame').value]; fields.sameAs = { cls: x.cls, title: P.lessonCell(S.data, x) }; }
    if (note) fields.notes = [note];
    put(fields, 'Revision lesson set' + (who === 'own' ? ' (made by you)' : ''), 'A revision lesson now');
    if (who !== 'claude' && who !== 'same') return;
    const t = S.week.slots[S.sel];
    const when = P.DAYS[s.day] + ' ' + P.addDays(S.monday, s.day).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' P' + s.period;
    run('sendRequest', { kind: 'build', text: '', lessons: [{ when, cls: s.cls, prompt: P.buildPrompt(S.data, t, (S.classSettings || {})[s.cls], S.week) }] })
      .then(() => toast('Revision lesson asked for. At home say "do my planner requests"'))
      .catch((e) => toast('Revision lesson set, but not sent to Claude: ' + e.message));
  };
}
function addPanel(day, period) {
  S.sel = -1; render();

  $('ed').innerHTML = '<h2>Add a lesson · ' + P.DAYS[day] + ' P' + period + '</h2>' +
    '<label>Class</label><select id="aCls">' + classes.map((c) => '<option' + (sameDay && sameDay.cls === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
    '<div class="card"><h4>Choose the lesson</h4><div id="chooser"></div></div>';
  const pick = (k) => {
    const cls = $('aCls').value;
    const w = JSON.parse(JSON.stringify(S.week));
    w.slots.push({ day, period, col: COLS[period - 1], cls, notes:[], carry:[], kind:'free' });
    w.slots.sort((x, y) => x.day - y.day || x.period - y.period);
    const idx = w.slots.findIndex((s) => s.day === day && s.period === period && s.cls === cls);

}

// MISSED flag: a planned lesson that comes BEFORE something already taught in the same topic.
function markGaps() {
  if (!S.week || S.readOnly) return;
  const st = P.progressBefore(S.data, S.weeks, S.monday, S.learned);
  S.week.slots.forEach((s) => {
    if (s.kind !== 'lesson') return;
    const c = S.data.classes[s.cls]; const L = c && c.seq[s.i]; if (!L) return;
    P.applyMarks(st[s.cls], S.week.marks, s.cls);
    s.gap = c.seq.some((x, k) => x.unit === L.unit && k > s.i && st[s.cls].taught.has(k));
  });
}

function sendToClaude(preselect) {
  if (!S.week) return;
  const idx = S.week.slots.map((s, i) => i).filter((i) => { const s = S.week.slots[i]; return ['lesson', 'revision'].includes(s.kind) && !s.own && !s.double && (s.built === false || s.kind === 'revision' || (preselect || []).includes(i)); });
  const rows = idx.map((i) => { const r = lessonRequest(i); const on = preselect ? preselect.includes(i) : true;
    return '<label style="display:block;margin:3px 0"><input type="checkbox" class="cReq" data-i="' + i + '"' + (on ? ' checked' : '') + '> ' + esc(r.when + ' · ' + r.cls + ' · ' + (r.prompt.split(String.fromCharCode(10))[1] || '')) + '</label>'; }).join('');
  modal('<h3>Send to Claude</h3>' +
    (rows ? '<p class="muted">Lessons to build (not built yet this week):</p>' + rows : '<p class="muted">Every lesson this week is already built.</p>') +
    '<label>Message (optional)</label><textarea id="cMsg" rows="4" style="width:100%" placeholder="e.g. 9XS: make the Do Now on prokaryotic cells. Or: change the planner so..."></textarea>' +
    '<p class="muted">At home, tell Claude Code: "do my planner requests".</p>' +
    '<div class="row"><button class="primary" id="cSend">Send</button><button id="cCancel">Cancel</button></div>');
  $('cCancel').onclick = closeModal;
  $('cSend').onclick = () => {
    const lessons = [...document.querySelectorAll('.cReq')].filter((x) => x.checked).map((x) => lessonRequest(+x.dataset.i));
    const text = $('cMsg').value.trim();
    if (!lessons.length && !text) { toast('Nothing to send'); return; }
    closeModal(); status('Sending to Claude...');
    run('sendRequest', { kind: lessons.length ? 'build' : 'message', text, lessons })
      .then(() => { status('Sent to Claude'); toast('Sent. At home say "do my planner requests"'); })
      .catch((e) => status('Not sent: ' + e.message));
  };
}

/* ---------------------------------------------------------------- calendar */
function loadMine() {
  status('Reading your Google Calendar...');
  run('myEvents', P.iso(S.monday)).then((evs) => { S.mine = evs; render(); status(evs.length + ' events from your calendar'); })
    .catch((e) => { S.showMine = false; status('Calendar not read: ' + e.message); });
}

/* ------------------------------------------------------------------ menu */
const menu = $('menu');
$('more').onclick = (e) => { e.stopPropagation(); menu.classList.toggle('on'); };
document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target.id !== 'more') menu.classList.remove('on'); });
const item = (id, fn) => { $(id).onclick = () => { menu.classList.remove('on'); fn(); }; };
item('mMine', () => { S.showMine = !S.showMine; $('mMine').firstChild.textContent = S.showMine ? 'Hide my calendar' : 'Show my calendar'; if (S.showMine) loadMine(); else render(); });
item('mSync', async () => {
  if (S.readOnly) { toast('This week is already taught'); return; }
  if (S.dirty) await save();
  const evs = P.calendarEvents(S.data, S.week);
  if (!confirm('Send this week (' + evs.length + ' events) to your "Lessons (Planner)" Google Calendar? It replaces what that calendar had for this week. Your main calendar is not touched.')) return;
  status('Sending to Google Calendar...');
  run('syncWeek', S.week.monday, evs).then((r) => { status('In Google Calendar'); toast(r.written + ' events in "' + r.calendar + '"'); })
    .catch((e) => status('Calendar failed: ' + e.message));
});
item('mPrint', () => {
  const list = P.printList(S.data, S.week, S.classSettings);
  modal('<h3>To print this week</h3>' + (list.length ? '<pre>' + list.map(esc).join('\n') + '</pre>' : '<p class="muted">Nothing to print.</p>') + '<div class="row"><button id="mClose">Close</button></div>');
  $('mClose').onclick = closeModal;
});
item('mXlsx', () => {
  const title = 'Order Sheet Week ' + S.week.letter + ' - ' + S.monday.toLocaleDateString('en-GB', { month:'short' }) + ' ' + S.monday.getDate();
  status('Making the Excel file...');
  run('exportXlsx', P.sheetModel(S.data, S.week, S.classSettings), title).then((r) => {
    const bytes = Uint8Array.from(atob(r.b64), (ch) => ch.charCodeAt(0));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = r.name; a.click(); status('Downloaded ' + r.name);
  }).catch((e) => status('Excel failed: ' + e.message));
});
item('mAuto', () => { if (S.readOnly) { toast('This week is already taught'); return; } if (confirm('Re-plan the whole week from where each class is up to? Your changes to this week are replaced (Undo brings them back).')) { change(P.autofill(S.data, S.weeks, S.monday, S.learned), 'Week re-planned'); markGaps(); render(); } });
item('mImp', () => $('file').click());
item('mClaude', () => sendToClaude(null));
// Homework quizzes (Patryk 2026-10-08): turn the homework Claude chose at home into self-marking
// Google Forms and Classroom drafts. He checks each draft in Classroom and publishes it.
item('mHw', () => showTab('homework'));
// Learning loop (2026-10-22): one daily trigger reads every homework Form into class-level results
// (no names leave school); the lesson cards then show "HW 62%" with the weakest questions.
item('mRes', () => {
  status('Reading homework results...');
  run('turnOnDailyResults').then((r) => { status(''); toast('Daily results on: ' + r.homeworks + ' homework(s) read. Reload to see them on the lesson cards.'); })
    .catch((e) => { status(''); toast('Daily results not turned on: ' + String(e.message || e).replace(/^Error:\s*/, '')); });
});
item('mHwAll', () => {
  status('Making homework quizzes...');
  run('makeHomework').then((res) => {
    const list = Array.isArray(res) ? res : res.made;   // an older Code.gs sends just the list
    status(list.length ? list.length + ' homework quiz(zes) made' : 'No new homework from home');
    const seen = Array.isArray(res) ? null : res;
    modal('<h3>Homework quizzes</h3>' + (seen ? '<p class="muted">The mailbox found ' + seen.seen + ' homework file(s) from home' + (seen.already ? ', ' + seen.already + ' already made' : '') + '.' + (seen.seen ? ' ' + esc(seen.names.join(', ')) : ' Nothing is waiting there: check that the mailbox is the newest version and that the file is in Admin / Planner Sync.') + '</p>' : '') + (list.length ? list.map((h) => '<p><b>' + esc(h.title) + '</b><br><a href="' + esc(h.form) + '" target="_blank">Open the quiz</a> · ' +
      (h.note ? esc(h.note) + '. ' : '') + 'Make its Classroom draft from the Homework tab' + '</p>').join('') :
      '<p class="muted">Nothing new. At home, ask Claude: "make homework for 10C2 due Friday".</p>') + '<div class="row"><button id="mClose">Close</button></div>');
    $('mClose').onclick = closeModal;
  }).catch((e) => {
    // an error stays on screen (the autosave "Saved" message used to cover it up)
    status('Homework not made');
    modal('<h3>Homework quizzes: not made</h3><p>' + esc(String(e.message || e).replace(/^Error:\s*/, '')) + '</p><div class="row"><button id="mClose">Close</button></div>');
    $('mClose').onclick = closeModal;
  });
});
// Make next day (Patryk 2026-10-08): one click sends the next school day's lessons to Claude, each with
// its checklist, the class notes and the books, plus that day's kit and printing for reference.
$('mkDay').onclick = async () => {
  if (!S.data || !S.data.classes) return;
  if (S.dirty) await save();
  const d = P.nextSchoolDay(S.data, new Date());
  const mon = P.mondayOf(d), day = (d.getDay() + 6) % 7;
  // the same week the planner shows: saved, or a Planner.xlsx week as an editable week, or the plan
  const week = P.iso(mon) === S.week.monday ? S.week : (S.weeks[P.iso(mon)] || P.fromFilled(S.data, mon) || P.autofill(S.data, S.weeks, mon, S.learned));
  const slots = week.slots.filter((s) => s.day === day && !s.double && ['lesson', 'revision'].includes(s.kind));
  const label = P.DAYS[day] + ' ' + d.getDate() + ' ' + d.toLocaleDateString('en-GB', { month: 'short' });
  if (!slots.length) { toast('No lessons to build on ' + label); return; }
  const rows = slots.map((s) => {
    const name = s.kind === 'lesson' ? 'L' + S.data.classes[s.cls].seq[s.i].num + ' ' + S.data.classes[s.cls].seq[s.i].title : P.lessonCell(S.data, s);
    // all ticked: a folder with slides in it may only hold the school's original deck
    return '<label style="display:block;margin:3px 0"><input type="checkbox" class="mdReq" data-p="' + s.period + '"' + (s.own ? '' : ' checked') + '> P' + s.period + ' ' + esc(s.cls) + ' · ' + esc(name) + (s.own ? ' <span class="muted">(you made this)</span>' : s.sameAs ? ' <span class="muted">(reuses ' + esc(s.sameAs.cls) + '\'s)</span>' : s.built === true ? ' <span class="muted">(folder already has slides)</span>' : '') + '</label>';
  }).join('');
  modal('<h3>Make ' + label + '</h3><p class="muted">Ticked lessons go to Claude with their checklists and class notes. At home: "do my planner requests".</p>' + rows +
    '<label>Anything else for the day (optional)</label><input type="text" id="mdNote" placeholder="e.g. 9XS are in the lab, not S8">' +
    '<div class="row"><button class="primary" id="mdGo">Send to Claude</button><button id="mdCancel">Cancel</button></div>');
  $('mdCancel').onclick = closeModal;
  $('mdGo').onclick = () => {
    const pick = new Set([...document.querySelectorAll('.mdReq')].filter((x) => x.checked).map((x) => +x.dataset.p));
    const lessons = slots.filter((s) => pick.has(s.period)).map((s) => ({ when: label + ' P' + s.period, cls: s.cls, prompt: P.buildPrompt(S.data, s, (S.classSettings || {})[s.cls], week) }));
    const kit = P.printList(S.data, week, S.classSettings).filter((x) => x.startsWith(P.DAYS[day] + ' '));
    const text = ['Make my next day: ' + label + '.', $('mdNote').value.trim(), kit.length ? 'Printing that day: ' + kit.join('; ') : ''].filter(Boolean).join(' ');
    if (!lessons.length) { toast('Nothing ticked'); return; }
    closeModal(); status('Sending ' + label + ' to Claude...');
    run('sendRequest', { kind: 'build', text, lessons }).then(() => { status('Sent ' + label + ' to Claude'); toast('Sent. At home say "do my planner requests"'); })
      .catch((e) => status('Not sent: ' + e.message));
  };
};
item('mTheme', () => { store.set('planner-theme', document.body.classList.contains('light') ? 'dark' : 'light'); applyTheme(); });
const HELP = [['J or →', 'next week (next day in Day view)'], ['K or ←', 'previous week (previous day in Day view)'], ['T', 'today'], ['W / D / C', 'week / day / classes view'], ['/', 'find a lesson (when one is selected)'], ['Delete', 'clear the selected lesson'], ['Ctrl+Z', 'undo'], ['Ctrl+S', 'save'], ['Esc', 'close / deselect'], ['?', 'this help']];
const showHelp = () => { modal('<h3>Keyboard shortcuts</h3>' + HELP.map(([k, t]) => '<div style="margin:4px 0"><kbd>' + k + '</kbd> ' + t + '</div>').join('') + '<div class="row"><button id="mClose">Close</button></div>'); $('mClose').onclick = closeModal; };
item('mHelp', showHelp);

/* ----------------------------------------------------------------- toolbar */
$('today').onclick = () => { if (leaveOk()) { const t = todayMidnight(); S.day = Math.min(4, (t.getDay() + 6) % 7); loadWeek(t); markGaps(); render(); } };
// Patryk 2026-10-07: in Day view the arrows move one school day (Fri -> next Mon); in Week view, a week.
function step(dir) {
  if (S.view === 'day') {
    const d = S.day + dir;
    if (d >= 0 && d <= 4) { S.day = d; S.sel = -1; render(); editor(); return; }
    if (!leaveOk()) return;
    S.day = dir > 0 ? 0 : 4;
    loadWeek(P.addDays(S.monday, 7 * dir)); markGaps(); render(); return;
  }
  if (leaveOk()) { loadWeek(P.addDays(S.monday, 7 * dir)); markGaps(); render(); }
}
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('jump').onchange = () => { if ($('jump').value && leaveOk()) { loadWeek(P.parse($('jump').value)); markGaps(); render(); } };
$('vWeek').onclick = () => { S.view = 'week'; render(); editor(); };
$('vDay').onclick = () => { S.view = 'day'; render(); editor(); };
$('vClasses').onclick = () => { S.view = 'classes'; render(); };
function showTab(v) { S.view = v; S.sel = -1; render(); }
$('vHomework').onclick = () => showTab('homework');
$('vTests').onclick = () => showTab('tests');
// Behaviour opens on the selected lesson's class, else the lesson on now
function openBehaviourFor(cls) { S.beh = Object.assign(S.beh || { mode: '+' }, { cls: '', want: cls || '', cl: null }); showTab('behaviour'); }
$('vRituals').onclick = () => showTab('rituals');
$('vBehaviour').onclick = () => { const s = S.sel >= 0 && S.week && S.week.slots[S.sel]; openBehaviourFor(s ? s.cls : ''); };
$('undo').onclick = undo;
$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { status('Importing...'); run('importData', rd.result).then((r) => { toast('Imported ' + r.classes + ' classes'); return run('loadAll'); }).then(onLoad).catch((e) => status('Import failed: ' + e.message)); };
  rd.readAsText(f);
};

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') { closeModal(); menu.classList.remove('on'); if (typing) document.activeElement.blur(); else { S.sel = -1; render(); editor(); } return; }
  if (typing || !S.week) return;
  const k = e.key.toLowerCase();
  if (k === 'j' || e.key === 'ArrowRight') $('next').click();
  else if (k === 'k' || e.key === 'ArrowLeft') $('prev').click();
  else if (k === 't') $('today').click();
  else if (k === 'w') $('vWeek').click();
  else if (k === 'd') $('vDay').click();
  else if (k === 'c') $('vClasses').click();
  else if (e.key === '?') showHelp();
  else if (e.key === '/' && $('q')) { e.preventDefault(); $('q').focus(); }
  else if (e.key === 'Delete' && S.sel >= 0) $('kFree').click();
});
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function onLoad(r) {
  S.data = r.data; S.results = r.results || []; S.weeks = r.weeks || {}; S.learned = r.learned || {}; S.classSettings = r.classSettings || {}; S.added = r.added || []; S.behaviourUrl = r.behaviourUrl || ""; S.gradeBands = r.gradeBands || {};
  if (S.data && S.data.classes) {
    P.applyAdded(S.data, S.added);                                          // lessons he added in the planner
    Object.values(S.weeks).forEach((w) => P.remapWeek(S.data, w));          // same lessons after a data refresh
    // shared lesson state (2026-10-12): one record per lesson; ticks saved inside old weeks move into it once
    S.data.records = r.records || []; P.remapRecords(S.data);
    const mg = P.migrateMarks(S.data, S.weeks);
    if (mg.length) run('saveLessons', S.data.records).then(() => run('saveWeeks', mg)).catch((e) => status('Ticks not moved: ' + e.message));
    S.recSnap = JSON.stringify(S.data.records); S.recSaved = mg.length ? null : S.recSnap;
  }
  if (!S.data) { status('No data yet: More → Import data, pick planner-data.json'); $('grid').innerHTML = ''; editor(); return; }
  if (!S.data.periodTimes || !S.data.filled) { status('Old data file: ask Claude to refresh the planner data, then More → Import data'); return; }
  // Patryk 2026-10-08: open on THIS week (at the weekend, next week); today's day in Day view.
  const t = todayMidnight(), wd = t.getDay();
  if (!S.monday) S.day = wd >= 1 && wd <= 5 ? wd - 1 : 0;
  loadWeek(S.monday || P.mondayOf(wd === 0 ? P.addDays(t, 1) : wd === 6 ? P.addDays(t, 2) : t)); markGaps(); render();
  const sy = r.sync || {};
  if (sy.pulled) toast('New lesson data from home loaded');
  else if (sy.error) status('Home link not working: ' + sy.error);
}
run('loadAll').then(onLoad).catch((e) => status('Could not load: ' + e.message));
</script>
<span class="build-stamp" title="when this copy of the planner was built">{{BUILD_STAMP}}</span>
</body>
