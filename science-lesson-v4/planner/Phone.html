const shortOf = n => (S.students.find(s => s.name === n) || {}).short || n;

/* snackbar with undo */
let snackTimer, snackIds = [];
function snack(text, ids) {
  snackIds = ids || [];

  $('snackUndo').classList.toggle('hidden', !snackIds.length);

  try { S.events = await call('removeMany', S.cls, ids); render(); snack('Undone'); } catch (e) { snack('Undo failed. Check your connection.'); }

function tally() {
  const m = {};
  S.events.forEach(e => { const x = m[e.name] = m[e.name] || { pos:0, neg:0, r:[], why:[] }; if (e.type === '+') x.pos++; else { x.neg++; if (e.type === 'R') x.r.push(e.rule); if (e.rule) x.why.push(e.rule); } });

/* ---------- students ---------- */
function tile(s, pos, style, mini, oneLine) {
  const p = s.short.split(' '), first = p.shift();
  const sup = s.support === 'prompt' ? ' sup-p' : s.support === 'extend' ? ' sup-e' : '';
  const cls = 'tile' + (pos ? ' has' : '') + (S.sel.includes(s.name) ? ' sel' : '') + (S.pop[s.name] ? ' pop' : '') + (mini ? ' mini' : '') + (oneLine ? ' one' : '') + sup;
  // plan seats: first name and initial on one line

  return `<button class="${cls}" data-name="${esc(s.name)}"${style ? ` style="${style}"` : ''}>${inner}</button>`;

// measures the real text so each first name is as big as possible without being cut off
const _mc = document.createElement('canvas').getContext('2d');
function fitName(text, maxW, cap) {
  _mc.font = `800 100px "Atkinson Hyperlegible Next","Atkinson Hyperlegible",Roboto,system-ui,sans-serif`;

function silenceBar() {

}
function currentView() {
  const seated = S.students.some(s => s.x !== null);

}
function renderStudents() {
  const t = tally(), box = $('studs'), view = currentView();
  $('mPlan').setAttribute('aria-pressed', view === 'plan'); $('mNames').setAttribute('aria-pressed', view === 'names');
  $('search').classList.toggle('hidden', view !== 'names');
  if (view === 'plan') {
    const seated = S.students.filter(s => s.x !== null && s.y !== null).map(s => Object.assign({}, s));
    // seat spacing = the usual gap between neighbours (not the smallest, so one misplaced seat can't shrink them all)
    const gaps = [];
    seated.forEach(a => { let best = null; seated.forEach(b => { const d = b.x - a.x; if (d > 2 && Math.abs(a.y - b.y) < 3 && (best === null || d < best)) best = d; }); if (best) gaps.push(best); });
    gaps.sort((a, b) => a - b);

    // push apart any seat that sits too close to the one on its left
    const byRow = {};
    seated.forEach(s => { const k = Math.round(s.y / 4); (byRow[k] = byRow[k] || []).push(s); });
    Object.values(byRow).forEach(r => { r.sort((a, b) => a.x - b.x); for (let i = 1; i < r.length; i++) if (r[i].x - r[i - 1].x < pitch * 0.85) r[i].x = r[i - 1].x + pitch; });

    const W = box.clientWidth || (window.innerWidth - 28);
    const w = W * pitch / 100 * 0.94, h = 46;
    const fs = Math.max(8, Math.min(15, w / 4.4));   // each name is then sized to fit its seat
    // rows keep their order from your plan but are evenly spaced, so seats in rows close together never overlap
    const rowKeys = [...new Set(seated.map(s => Math.round(s.y / 4)))].sort((a, b) => a - b);
    const rowGap = h + 10, H = rowKeys.length * rowGap + 6;
    seated.forEach(s => { s.top = 4 + rowKeys.indexOf(Math.round(s.y / 4)) * rowGap; });
    let html = `<div class="planScroll"><div class="plan" style="width:${W}px;height:${H}px">` + seated.map(s => tile(s, (t[s.name] || {}).pos || 0,
      `left:${W * s.x / 100 - w / 2}px;top:${s.top}px;width:${w}px;height:${h}px;font-size:${fitName(s.short.split(" ")[0], w - 9, 13) * 0.95}px`, false, false)).join('') + `</div><div class="wb" style="width:${W}px">WHITEBOARD</div></div>`;
    html += silenceBar();
    const un = S.students.filter(s => s.x === null || s.y === null);
    if (un.length) html += `<h2>Not on the plan</h2><div class="names">${un.map(s => tile(s, (t[s.name] || {}).pos || 0)).join('')}</div>`;
    box.innerHTML = html;
  } else {
    const q = $('search').value.trim().toLowerCase();
    const list = S.students.filter(s => !q || s.name.toLowerCase().includes(q)).sort((a, b) => a.short.localeCompare(b.short));
    box.innerHTML = list.length ? `<div class="names">${list.map(s => tile(s, (t[s.name] || {}).pos || 0)).join('')}</div>` + silenceBar()

  }
  S.pop = {};
  renderLesson(t);
}
function renderLesson(t) {
  const n = Object.keys(t);
  const det = n.filter(x => t[x].neg >= 2), rep = n.filter(x => t[x].r.length), one = n.filter(x => t[x].neg === 1 && !t[x].r.length);
  let h = '';
  if (det.length) h += `<h2>Detention</h2><ul class="list">${det.map(x => `<li><span class="tag det">DET</span><span class="grow">${esc(x)}</span><span class="soft">${t[x].why.map(r => esc(RULES[r])).join(', ')}</span></li>`).join('')}</ul>`;
  if (rep.length) h += `<h2>Report to me</h2><ul class="list">${rep.map(x => `<li><span class="tag r">R</span><span class="grow">${esc(x)}</span><span class="soft">${t[x].r.map(r => esc(RULES[r])).join(', ')}</span></li>`).join('')}</ul>`;

function setView(v) { S.view = v; LS.set('view', v); renderStudents(); }
$('mPlan').onclick = () => { voteOn(false); setView('plan'); }; $('mNames').onclick = () => { voteOn(false); setView('names'); };
/* ABCD card votes (specs/learning-loop.md M3/M4; Patryk 2026-10-22). Corners match the room: A bottom left,

const voteQs = () => { const d = S.vote.data || {}; return d.mcq && d.mcq.length ? d.mcq : null; };
function splitText(sp, right) {

}

  const V = S.vote, qs = voteQs(), box = $('vote');

  const sp = V.live || (V.saved[V.i] || {}).split || null, pair = sp ? Object.keys(sp).sort() : [];

  const pl = Object.keys(pos).sort((a, b) => pos[b] - pos[a] || a.localeCompare(b));
  const nl = Object.keys(neg).sort((a, b) => neg[b].n - neg[a].n || a.localeCompare(b));
  $('daySum').innerHTML = `<div class="sum"><div class="col"><h3>Positives</h3>${pl.length ? pl.map(n => `<div class="r"><span>${esc(shortOf(n))}</span><b>${pos[n]}</b></div>`).join('') : '<div class="r soft">None</div>'}</div>
    <div class="col"><h3>Negatives</h3>${nl.length ? nl.map(n => `<div class="r"><span>${esc(shortOf(n))}</span><b>${neg[n].n}${neg[n].r ? ' (R)' : ''}${neg[n].n >= 2 ? ' DET' : ''}</b></div>`).join('') : '<div class="r soft">None</div>'}</div></div>`;
  const ev = S.events.slice().reverse();
  const tag = e => e.type === '+' ? '<span class="tag p">+</span>' : e.type === 'R' ? '<span class="tag r">R</span>' : '<span class="tag n">&minus;</span>';
  $('dayList').innerHTML = ev.length ? `<ul class="list">${ev.map(e => `<li><span class="soft">${esc(e.t)}</span>${tag(e)}<span class="grow">${esc(e.name)}${e.type === 'R' ? ` <span class="soft">${esc(RULES[e.rule] || '')}</span>` : ''}</span><button class="x" data-del="${e.id}">Remove</button></li>`).join('')}</ul>` : '<p class="note">Nothing logged today.</p>';
  loadPositives();
}
$('dayList').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const ev = S.events.find(x => String(x.id) === b.dataset.del); if (!ev || !confirm(`Remove this entry for ${ev.name}?`)) return;
  try { S.events = await call('removeMany', S.cls, [Number(b.dataset.del)]); renderDay(); snack('Removed'); } catch (err) { snack('Could not remove.'); }
});
async function loadPositives() {
  $('posList').innerHTML = '<p class="note">Loading</p>';
  try { const r = await call('positivesOver', S.cls, S.days);
    $('posList').innerHTML = r.length ? `<ul class="list">${r.map(x => `<li><span class="tag p">${STAR.replace('<svg', '<svg width="11" height="11"')} ${x.count}</span><span class="grow">${esc(x.name)}</span></li>`).join('')}</ul>` : '<p class="note">No positives in this period.</p>';
  } catch (e) { $('posList').innerHTML = '<p class="note">Could not load.</p>'; }
}
$('ranges').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.days = Number(b.dataset.d); [...$('ranges').children].forEach(x => x.setAttribute('aria-pressed', x === b)); loadPositives(); };

/* ---------- Friday ---------- */
const MAX = 3;
function goalChip(g, f) {
  const lost = g.lost ? ` · ${mmss(g.lost)} lost` : '';
  const sil = g.pct != null ? `Silent ${g.pct}%` : 'No silence data';
  return `<span class="goal ${g.status === 'missed' ? 'missed' : 'hit'}">${sil}${lost}</span>`;   // counts as meeting the goal
}
async function loadFriday() {
  $('fri').innerHTML = '<p class="note">Loading</p>';
  try { S.fri = await call('getFriday'); renderFriday(); } catch (e) { $('fri').innerHTML = '<p class="note">Could not load.</p>'; }
}
function renderFriday() {
  $('fri').innerHTML = S.fri.map(c => {
    const picks = S.picks[c.cls] || [], skipped = !!S.skip[c.cls], open = !!S.open[c.cls] && !skipped;
    const ordered = c.students.slice().sort((a, b) => (b.pos > 0 && !b.recent) - (a.pos > 0 && !a.recent) || b.pos - a.pos || a.name.localeCompare(b.name));
    const body = open ? `<div class="cls-b"><button class="skip" data-skip="${esc(c.cls)}">Skip this class</button>${ordered.map(s => {
      const on = picks.includes(s.name);
      return `<button class="st${on ? ' on' : ''}${s.recent ? ' recent' : ''}" data-pick="${esc(c.cls)}" data-name="${esc(s.name)}"><span class="box"></span>
        <span class="grow">${esc(s.name)}${s.recent ? `<small>Emailed ${esc(s.emailed)}</small>` : ''}</span>${s.pos ? `<span class="tag p">+${s.pos}</span>` : ''}${s.pos && !s.recent ? '<span class="sug">Suggested</span>' : ''}</button>`;
    }).join('')}</div>` : '';
    return `<div class="cls${skipped ? ' skipped' : ''}"><button class="cls-h" data-open="${esc(c.cls)}"><b>${esc(c.cls)}</b>
      <span class="grow">${skipped ? 'Skipped, tap to include' : `${picks.length} of ${MAX} picked`}</span>${goalChip(c.goal, c.fortnight)}</button>${body}</div>`;
  }).join('');
  const total = Object.keys(S.picks).reduce((n, k) => n + (S.skip[k] ? 0 : S.picks[k].length), 0);
  $('makeList').textContent = `Make email list (${total})`; $('makeList').classList.toggle('hidden', !total);
}
$('fri').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) { const c = b.dataset.open; if (S.skip[c]) delete S.skip[c]; else S.open[c] = !S.open[c]; return renderFriday(); }
  if (b.dataset.skip) { S.skip[b.dataset.skip] = true; return renderFriday(); }
  if (b.dataset.pick) {
    const c = b.dataset.pick, n = b.dataset.name, p = S.picks[c] = S.picks[c] || [], i = p.indexOf(n);
    if (i > -1) p.splice(i, 1); else if (p.length >= MAX) snack(`${MAX} already picked. Untick one first.`); else p.push(n);
    renderFriday();
  }
});
$('makeList').onclick = () => {
  const lines = [];
  S.fri.forEach(c => { const p = S.picks[c.cls] || []; if (p.length && !S.skip[c.cls]) { lines.push(c.cls); p.forEach(n => lines.push(n)); lines.push(''); } });
  $('listText').value = lines.join('\n').trim();
  $('fri').classList.add('hidden'); $('makeList').classList.add('hidden'); $('friList').classList.remove('hidden');
};
$('backPick').onclick = () => { $('fri').classList.remove('hidden'); $('friList').classList.add('hidden'); renderFriday(); };
$('copy').onclick = async () => {
  const ta = $('listText');
  try { await navigator.clipboard.writeText(ta.value); snack('Copied'); }
  catch (e) { ta.removeAttribute('readonly'); ta.select(); const ok = document.execCommand('copy'); ta.setAttribute('readonly', ''); snack(ok ? 'Copied' : 'Select the text and copy it'); }
};
$('mark').onclick = async () => {
  const picks = []; Object.keys(S.picks).forEach(c => { if (!S.skip[c]) S.picks[c].forEach(n => picks.push({ cls:c, name:n })); });
  if (!picks.length) return;
  try { await call('markEmailed', picks); snack(`${picks.length} marked as emailed`); S.picks = {}; S.skip = {}; $('backPick').onclick(); loadFriday(); }
  catch (e) { snack('Not saved. Try again.'); }
};

/* ---------- navigation ---------- */
function renderChips() {
  const list = TODAY.length ? TODAY : CLASSES.slice(0, 4);
  const extra = !list.includes(S.cls) && S.cls ? [S.cls] : [];
  $('chips').innerHTML = [...list, ...extra].map(c => `<button class="chip" data-cls="${esc(c)}" aria-pressed="${c === S.cls}">${esc(c)}</button>`).join('')
    + `<button class="chip more" id="more">All classes</button>`;
}
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.id === 'more') return classSheet(); pickClass(b.dataset.cls); });
function pickClass(c) { if (c === S.cls) return; S.sel = []; $('selbar').classList.add('hidden'); $('search').value = ''; loadClass(c); }
let ULHU = null;   // the Ulhu screen, made the first time its tab opens
function setTab(t) {
  S.tab = t;
  document.body.classList.toggle('ulhuOn', t === 'ulhu');
  [['log','tLog','vLog'],['day','tDay','vDay'],['fri','tFri','vFri'],['ulhu','tUlhu','vUlhu']].forEach(([k, b, v]) => { $(b).setAttribute('aria-pressed', t === k); $(v).classList.toggle('hidden', t !== k); });
  $('chips').classList.toggle('hidden', t === 'fri' || t === 'ulhu');
  $('clsTitle').textContent = t === 'fri' ? 'Friday' : t === 'ulhu' ? 'Ulhu' : S.cls;
  if (t === 'ulhu') { window.scrollTo(0, 0); if (!$('ulhu').firstChild) ULHU = GameUI.mount($('ulhu'), call, { wide: false }); else if (ULHU) setTimeout(ULHU.refit, 30); }
  renderSilence();
  if (t === 'log') renderStudents(); if (t === 'day') renderDay(); if (t === 'fri') loadFriday();
}
$('tLog').onclick = () => setTab('log'); $('tDay').onclick = () => setTab('day'); $('tFri').onclick = () => setTab('fri'); $('tUlhu').onclick = () => setTab('ulhu');
// Ulhu's badge on the bottom bar: rituals still to do today, read from the copy the Ulhu screen keeps on the phone (2026-10-26)
function ulhuBadge() {
  let n = 0;
  try { const d = JSON.parse(localStorage.getItem('ulhuD') || 'null'), t = new Date(), today = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    if (d && d.today === today && !d.frozen) n = d.goals.filter((g) => g.kind === 'daily' && g.dueToday && !g.doneToday).length; } catch (e) { n = 0; }
  let b = $('tUlhu').querySelector('.ub'); if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('b'); b.className = 'ub'; $('tUlhu').appendChild(b); } b.textContent = n;
}
ulhuBadge(); window.addEventListener('ulhuchange', ulhuBadge); document.addEventListener('visibilitychange', () => { if (!document.hidden) ulhuBadge(); });
// the link with &tab=ulhu opens straight on Ulhu (for a home-screen shortcut)
try { google.script.url.getLocation((l) => { if (l && l.parameter && l.parameter.tab === 'ulhu') setTab('ulhu'); }); } catch (e) { /* not inside Apps Script */ }
$('refresh').onclick = () => { if (S.tab === 'fri') loadFriday(); else loadClass(S.cls); };
function render() { if (S.tab === 'log') renderStudents(); if (S.tab === 'day') renderDay(); }

// Each class's last loaded data is kept on the phone, so it still shows with no signal.
function cacheKey(c) { return 'class:' + c; }
function queued(c) { return getQueue().filter(q => q.cls === c).flatMap(q => q.names.map(n => ({ id: 'q' + q.ts, t: '', name: n, type: q.type, rule: q.rule || 0, queued: true }))); }
async function loadClass(cls) {
  S.cls = cls; if (S.vote && S.vote.on) loadVote(); $('clsTitle').textContent = cls; $('clsTitle').classList.toggle('clsTitleLong', cls.length > 6); renderChips();
  const cached = (() => { try { return JSON.parse(LS.get(cacheKey(cls)) || 'null'); } catch (e) { return null; } })();
  // show this class straight away (saved copy, or empty), never the previous class's lists
  S.students = cached ? cached.students : []; S.ratio = cached ? cached.ratio : 2.6; S.silence = cached ? cached.silence : null;
  S.events = (cached ? cached.events : []).concat(queued(cls));
  if (cached) render(); else { $('studs').innerHTML = '<p class="note">Loading</p>'; $('lesson').innerHTML = ''; }
  try {
    const d = await call('openClass', cls);
    if (S.cls !== cls) return;
    S.students = d.students; S.ratio = d.ratio; S.silence = d.silence || null; S.events = d.events.concat(queued(cls));
    LS.set(cacheKey(cls), JSON.stringify({ students: d.students, ratio: d.ratio, events: d.events, silence: d.silence || null }));
    render();
  } catch (e) {
    if (cached) snack('No signal: showing the saved copy of this class');
    else $('studs').innerHTML = '<p class="note">No signal and nothing saved for this class yet.</p>';
  }
}
function getQueue() { try { return JSON.parse(LS.get('queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { LS.set('queue', JSON.stringify(q)); }
// Taps the server refused three times while the connection looked fine are set aside here (1.3, 2026-10-29), shown on the
// connection screen with "Try again" and "Forget", so one bad tap can never block the ones behind it.
function getStuck() { try { return JSON.parse(LS.get('stuck') || '[]'); } catch (e) { return []; } }
function setStuck(q) { LS.set('stuck', JSON.stringify(q)); updateDot(); }
let flushing = false;
async function flushQueue() {
  if (flushing) return; const q = getQueue(); if (!q.length) return;
  flushing = true;
  let sent = 0;
  while (getQueue().length) {
    const item = getQueue()[0];
    const looksUp = !NET.down && navigator.onLine;
    try {
      const ev = item.names.length > 1 ? await call('logMany', item.cls, item.names, item.type, item.rule || 0, item.ts, item.id) : await call('logEvent', item.cls, item.names[0], item.type, item.rule || 0, item.ts, item.id);
      setQueue(getQueue().slice(1)); sent++;
      if (item.cls === S.cls) { S.events = ev.concat(queued(S.cls)); render(); }
    } catch (e) {
      if (!looksUp || !navigator.onLine) break;   // no signal (before or during the send): everything waits, nothing counts against the tap
      item.tries = (item.tries || 0) + 1; item.why = String((e && e.message) || e).slice(0, 120);
      const rest = getQueue().slice(1);
      if (item.tries >= 3) { setStuck(getStuck().concat([item])); setQueue(rest); if (item.cls === S.cls) render(); continue; }
      setQueue([item].concat(rest)); break;
    }
  }
  flushing = false;
  if (sent) snack(`${sent} saved tap${sent > 1 ? 's' : ''} sent`);
}
setInterval(flushQueue, 15000);
window.addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  if (S.cls && S.tab !== 'fri') loadClass(S.cls);
  refreshMode(); keepAwake(); flushQueue();
});

/* ---------- settings (Today tab) ---------- */
const PREF = {
  get tap() { return LS.get('tap') || 'pos'; },
  get awake() { return LS.get('awake') || 'on'; },
  get theme() { return LS.get('theme') || 'auto'; }
};
function applyTheme() { document.documentElement.dataset.theme = PREF.theme; }
function updateHint() { $('hint').textContent = PREF.tap === 'pos' ? 'Tap for a positive. Hold for options.' : 'Tap for options. Hold to pick several.'; }
function renderSettings() {
  document.querySelectorAll('[data-set]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(PREF[g.dataset.set] === b.dataset.v))));
}
$('vDay').addEventListener('click', e => {
  const b = e.target.closest('[data-set] button'); if (!b) return;
  const k = b.parentElement.dataset.set; LS.set(k, b.dataset.v); renderSettings();
  if (k === 'theme') applyTheme(); if (k === 'awake') keepAwake(); if (k === 'tap') { updateHint(); S.sel = []; render(); }
});
// keep the screen on while the app is open (if the phone allows it inside Google's page)
let wakeLock = null;
async function keepAwake() {
  const want = PREF.awake === 'on' && document.visibilityState === 'visible', note = $('awakeNote');
  if (!('wakeLock' in navigator)) { if (PREF.awake === 'on') note.textContent = "This browser can't keep the screen on. Set Screen timeout in your phone's Display settings instead."; return; }
  try {
    if (want && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
    note.textContent = '';
  } catch (e) { note.textContent = "Your phone didn't allow this inside Google's page. If the screen still dims, set Screen timeout to 10 minutes in your phone's Display settings."; }
}
// connection dot: green all fine, amber the board isn't open or taps are waiting, red no signal
function dotState() { if (NET.down) return 'red'; if (getQueue().length || getStuck().length || S.boardAge === null || S.boardAge === undefined || S.boardAge > 20) return 'amber'; return 'green'; }
function updateDot() { const d = $('dot'); if (d) d.className = 'dot ' + dotState(); }
function ago(s) { return s < 90 ? `${Math.round(s)} s` : s < 5400 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`; }
const TAP_WORD = { '+': 'positive', '-': 'negative', 'R': 'report to me' };
function stuckLine(t) { const d = new Date(t.ts); return `${t.cls} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${TAP_WORD[t.type] || t.type} for ${t.names.length > 1 ? t.names.length + ' students' : shortOf(t.names[0])}`; }
$('dotBtn').addEventListener('click', () => {
  const q = getQueue().length, st = getStuck(), ba = S.boardAge, live = ba !== null && ba !== undefined && ba <= 20;
  openSheet(`<p class="who">Connection</p><div class="conn">
    <div><i class="dot ${NET.down ? 'red' : 'green'}"></i><b>Phone</b><span>${NET.down ? 'No signal right now' : 'Connected'}</span></div>
    <div><i class="dot ${live ? 'green' : 'amber'}"></i><b>Board</b><span>${ba === null || ba === undefined ? 'Not open yet' : live ? 'Live' : 'Last seen ' + ago(ba) + ' ago'}</span></div>
    <div><i class="dot ${q ? 'amber' : 'green'}"></i><b>Saved taps</b><span>${q ? q + ' waiting to send' : 'None waiting'}</span></div>
    ${st.length ? `<div><i class="dot amber"></i><b>Not sent</b><span>${st.length} tap${st.length > 1 ? 's' : ''} the server refused three times</span></div>` : ''}</div>
    ${st.length ? '<p class="note">' + st.map(stuckLine).map(esc).join('<br>') + (st[0].why ? '<br>Server said: ' + esc(st[0].why) : '') + '</p><div class="row"><button class="cta" data-retry-stuck="1">Try again</button><button data-forget-stuck="1">Forget them</button></div>' : ''}
    ${q ? '<button class="cta" data-flush="1">Send saved taps now</button>' : ''}`);
});
applyTheme(); updateHint(); renderSettings(); keepAwake();

call('init').then(d => {
  RULES = d.rules; CLASSES = d.classes; TODAY = d.today; if (d.limit) LIMIT = d.limit;
  $('when').textContent = `Week ${d.week}, ${new Date().toLocaleDateString('en-GB', { weekday:'long' })}  (app 20, server ${d.version || 'old'})`;
  if (!CLASSES.length) { $('studs').innerHTML = '<p class="note">No classes yet. Import Students.csv into the Students tab.</p>'; return; }
  loadClass(CLASSES.includes(d.active) ? d.active : (TODAY[0] || CLASSES[0]));
  applyMode(d.mode);
}).catch((e) => { $('studs').innerHTML = '<p class="note">Could not connect. Reopen the link.</p>'; showErr('Server: ' + ((e && e.message) || e)); });
setTimeout(() => { if (!$('when').textContent.trim()) showErr('Still waiting for Google after 20 seconds. Tap refresh.'); }, 20000);
</script>
<span class="build-stamp" title="when this copy of the phone page was built">{{BUILD_STAMP}}</span>
</body>
