<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam practice: the front cover and the tick boxes (mock-ups)</title>
<style>
  :root { --navy:#0D1B5E; --gold:#FABB2E; --green:#1B5E20; --grey:#5d6a7f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1b2233; color:#e8edf5; font:15px/1.4 "Trebuchet MS",Trebuchet,system-ui,sans-serif; }
  header { padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#0f1420; position:sticky; top:0; z-index:3; }
  header b { font-size:17px; margin-right:6px; }
  button { font:inherit; padding:8px 12px; border-radius:9px; border:1px solid #3a4661; background:#182134; color:#e8edf5; }
  button[aria-pressed="true"] { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .note { padding:10px 14px; color:#b8c2d6; max-width:1000px; } .note b { color:#fff; }
  #stage { padding:10px; display:flex; justify-content:center; }
  .frame { position:relative; transform-origin:top left; }
  .sheet { width:840px; height:1188px; background:#fff; color:#111; position:relative; padding:44px 48px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.4; }
  .band { background:var(--navy); color:#fff; padding:14px 18px; border-radius:4px; }
  .band h1 { margin:0; font-size:26px; } .band div { color:#dfe6f5; font-size:15px; margin-top:4px; }
  table.box { width:100%; border-collapse:collapse; margin-top:18px; }
  table.box td { border:1.5px solid #111; padding:10px 10px; font-size:15px; } table.box td.l { width:22%; font-weight:700; background:#f2f4f8; }
  h2 { font-size:15px; letter-spacing:.08em; margin:22px 0 6px; text-transform:uppercase; }
  ul { margin:0; padding-left:20px; } li { margin:4px 0; }
  .two { display:flex; gap:24px; } .two > div { flex:1; }
  .chips { display:flex; gap:10px; margin:16px 0; } .chip { border:1.5px solid var(--navy); border-radius:999px; padding:8px 16px; font-weight:700; }
  .big { font-size:20px; } .line { border-bottom:1.5px solid #111; height:34px; }
  .green { border:2px solid var(--green); border-radius:6px; padding:10px 14px; color:var(--green); font-weight:700; margin-top:18px; }
  .grid { width:100%; border-collapse:collapse; margin-top:16px; } .grid td, .grid th { border:1px solid #111; padding:5px 6px; font-size:13px; text-align:center; } .grid th { background:#f2f4f8; }
  .q { margin-top:16px; } .q b { display:block; margin-bottom:4px; }
  .tick { display:flex; align-items:center; gap:10px; margin:8px 0 8px 18px; }
  .sq { display:inline-block; border:1.5px solid #111; background:#fff; flex:none; }
  .foot { position:absolute; left:48px; right:48px; bottom:28px; font-size:12px; color:#666; border-top:1px solid #ccc; padding-top:6px; display:flex; justify-content:space-between; }
  .pagecut { border-top:2px dashed #c33; color:#c33; font-size:12px; text-align:right; margin:16px 0 8px; }
</style>
</head>
<body>
<header>
  <b>Front cover</b><button data-v="A" aria-pressed="true">A exam-board style</button><button data-v="B">B one glance</button><button data-v="C">C slim strip, questions on page 1</button>
  <b style="margin-left:14px">Tick boxes</b><button data-v="T">three sizes</button>
</header>
<div class="note" id="note"></div>
<div id="stage"><div class="frame" id="frame"></div></div>

<script>
(function () {
  'use strict';
  var TITLE = 'P1 Energy: Exam practice', CLS = '10C2', TIER = 'Core', DUE = 'Friday 13 November, 8:00 am', TOTAL = 40, MINS = 40;
  var instr = ['Homework: exam practice from real GCSE exam questions. Work through it at home.', 'Answer all the questions in the spaces provided.', 'You may use a calculator and a ruler.', 'Aim to spend about ' + MINS + ' minutes on it.', 'Then mark it with the mark scheme in green and correct anything you got wrong.'];
  var info = ['The total mark is ' + TOTAL + '.', 'The marks for each question are shown in brackets ( ).', 'The same questions are on the Google Form: put your answers in once you have done the paper.'];
  var foot = '<div class="foot"><span>Beechen Cliff Science · made from real GCSE questions</span><span>' + CLS + ' · ' + TITLE + '</span></div>';
  var V = {
    A: {
      note: '<b>Cover A, exam-board style.</b> Like the front of a real paper: a title band with the subject, class and tier; a name box with the date due; INSTRUCTIONS and INFORMATION side by side in the exam\'s own wording; a "marks by question" strip for the self-mark (a mark record, not a feedback grid). Today\'s cover is this without the band, the due date, the columns or the strip.',
      html: function () {
        var qs = [3, 4, 5, 6, 2, 6, 4, 4, 6];
        return '<div class="sheet"><div class="band"><h1>' + TITLE + ' · ' + TIER + '</h1><div>Physics · ' + CLS + ' · ' + TOTAL + ' marks · about ' + MINS + ' minutes</div></div>' +
          '<table class="box"><tr><td class="l">Name</td><td></td></tr><tr><td class="l">Class</td><td>' + CLS + '</td></tr><tr><td class="l">Due</td><td>' + DUE + '</td></tr><tr><td class="l">Score</td><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;/ ' + TOTAL + '</td></tr></table>' +
          '<div class="two"><div><h2>Instructions</h2><ul>' + instr.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div><div><h2>Information</h2><ul>' + info.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div></div>' +
          '<h2>Marks by question (fill in when you mark it)</h2><table class="grid"><tr><th>Question</th>' + qs.map(function (m, i) { return '<th>' + (i + 1) + '</th>'; }).join('') + '<th>Total</th></tr><tr><td>Available</td>' + qs.map(function (m) { return '<td>' + m + '</td>'; }).join('') + '<td>' + TOTAL + '</td></tr><tr><td>Mine</td>' + qs.map(function () { return '<td>&nbsp;</td>'; }).join('') + '<td>&nbsp;</td></tr></table>' +
          '<div class="green">Mark in green. Correct every wrong answer in green under it. Hand in the paper and do the Form.</div>' + foot + '</div>';
      }
    },
    B: {
      note: '<b>Cover B, one glance.</b> Everything a pupil (or a parent) needs in the first ten seconds: the title, three chips (class, due, marks), one big name line, then four plain numbered steps in your voice, and the green-pen box. No two-column exam wording, no marks strip. The friendliest; the least like an exam.',
      html: function () {
        return '<div class="sheet"><h1 style="font-size:30px;margin:0;color:var(--navy)">' + TITLE + '</h1><div style="color:#444;font-size:17px;margin-top:4px">Physics · ' + TIER + ' paper</div>' +
          '<div class="chips"><span class="chip">' + CLS + '</span><span class="chip">Due ' + DUE + '</span><span class="chip">' + TOTAL + ' marks</span><span class="chip">about ' + MINS + ' min</span></div>' +
          '<div class="big" style="margin-top:28px">Name</div><div class="line"></div>' +
          '<h2 style="margin-top:34px">What to do</h2><ol style="font-size:17px;padding-left:22px"><li>Do the paper at home, on your own, with a calculator and a ruler.</li><li>Answer every question in the space given. Show your working.</li><li>Mark it with the mark scheme in green. Correct anything wrong in green.</li><li>Put your answers into the Google Form on Classroom before it is due.</li></ol>' +
          '<div class="green" style="margin-top:34px">Score: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; / ' + TOTAL + ' &nbsp;&nbsp;&nbsp;&nbsp; Marked in green? &nbsp;<span class="sq" style="width:18px;height:18px;vertical-align:middle"></span></div>' +
          '<p style="color:#666;margin-top:34px">Made from real GCSE exam questions. The marks for each question are shown in brackets.</p>' + foot + '</div>';
      }
    },
    C: {
      note: '<b>Cover C, slim strip.</b> No front page at all: a half-page header on page 1 (title band, a name and score strip, three instruction lines) and the questions start underneath. One sheet fewer per pupil, which matters for 30 copies a week, and nothing for a pupil to lose. Question 1 shows how it joins on.',
      html: function () {
        return '<div class="sheet"><div class="band"><h1>' + TITLE + ' · ' + TIER + '</h1><div>Physics · ' + CLS + ' · ' + TOTAL + ' marks · about ' + MINS + ' minutes · due ' + DUE + '</div></div>' +
          '<table class="box" style="margin-top:12px"><tr><td class="l">Name</td><td></td><td class="l" style="width:14%">Score</td><td style="width:16%">&nbsp;&nbsp;&nbsp;/ ' + TOTAL + '</td></tr></table>' +
          '<ul style="margin:10px 0 0;font-size:14px"><li>Answer every question in the space given. Calculator and ruler allowed. Marks are in brackets.</li><li>Mark it with the mark scheme in green and correct anything wrong.</li><li>Then put your answers into the Google Form.</li></ul>' +
          '<div style="border-top:2px solid var(--navy);margin:16px 0 0"></div>' +
          '<div class="q"><b>Q1.</b>Figure 1 shows a kettle. The kettle has a power of 2 kW and is switched on for 3 minutes.<p style="margin:6px 0">(a) Write down the equation that links energy transferred, power and time.</p><div class="line" style="border-bottom:1px dotted #555;height:28px"></div><p style="text-align:right;margin:4px 0">(1)</p><p style="margin:6px 0">(b) Calculate the energy transferred by the kettle in 3 minutes.</p><div class="line" style="border-bottom:1px dotted #555;height:28px"></div><div class="line" style="border-bottom:1px dotted #555;height:28px"></div><div class="line" style="border-bottom:1px dotted #555;height:28px"></div><p style="text-align:right;margin:4px 0">Energy = __________ J &nbsp;(3)</p><p style="text-align:right;margin:4px 0">(Total 4 marks)</p></div>' +
          '<div class="q"><b>Q2.</b>Which energy store empties as a stretched spring returns to its original length? Tick one box.<div class="tick"><span class="sq" style="width:22px;height:22px"></span> Thermal</div><div class="tick"><span class="sq" style="width:22px;height:22px"></span> Elastic potential</div><div class="tick"><span class="sq" style="width:22px;height:22px"></span> Kinetic</div><p style="text-align:right;margin:4px 0">(1)</p></div>' + foot + '</div>';
      }
    },
    T: {
      note: '<b>Tick boxes, three sizes.</b> You said the multiple-choice tick boxes on printed papers are too small. Today they are small pictures cut from the real paper (about 4 mm). Here the same question at three sizes, drawn by the paper itself instead of cut from the scan: 1 as now, 2 a 6 mm box, 3 an 8 mm box with the option in bigger type. Pick a number.',
      html: function () {
        var opts = ['Thermal', 'Elastic potential', 'Kinetic', 'Chemical'];
        var block = function (n, px, fs) { return '<div class="q"><b>' + n + '</b>Which energy store empties as a stretched spring returns to its original length? Tick <strong>one</strong> box.' + opts.map(function (o) { return '<div class="tick" style="font-size:' + fs + 'px;margin-left:' + (px > 20 ? 24 : 18) + 'px"><span class="sq" style="width:' + px + 'px;height:' + px + 'px"></span> ' + o + '</div>'; }).join('') + '<p style="text-align:right;margin:4px 0">(1)</p></div>'; };
        return '<div class="sheet">' + block('1 as now (about 4 mm, cut from the paper)', 15, 15) + block('2 a 6 mm box, drawn', 23, 15) + block('3 an 8 mm box, drawn, option in bigger type', 30, 17) + '<p style="color:#666;margin-top:20px">A 6 mm box is what AQA prints. The drawn box also fixes the "options run on one line" slip, because each option is its own line.</p>' + foot + '</div>';
      }
    }
  };
  var frame = document.getElementById('frame'), note = document.getElementById('note');
  function fit() { var el = frame.firstChild, w = el ? el.offsetWidth : 840, h = el ? el.offsetHeight : 1188, s = Math.min((window.innerWidth - 20) / w, 1); frame.style.transform = 'scale(' + s + ')'; frame.style.width = w + 'px'; frame.style.height = h + 'px'; document.getElementById('stage').style.height = (h * s + 20) + 'px'; }
  function show(k) { frame.innerHTML = V[k].html(); note.innerHTML = V[k].note; document.querySelectorAll('header button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === k)); }); fit(); }
  document.querySelector('header').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.v); });
  window.addEventListener('resize', fit);
  show('A');
})();
</script>
</body>
</html>
