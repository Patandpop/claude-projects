<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eyes-free behaviour entry (mock-up)</title>
<style>
  :root { --bg:#0e1420; --ink:#e8edf5; --soft:#8a97ad; --card:#182134; --line:#2a3650; --pos:#2fbf71; --neg:#e24b4b; --gold:#e3b341; --blue:#4c8dff; }
  [data-theme="light"] { --bg:#f4f6fa; --ink:#15202e; --soft:#5d6a7f; --card:#ffffff; --line:#d6dce8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.35 "Atkinson Hyperlegible",Roboto,system-ui,sans-serif; overflow:hidden; }
  header { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--card); border-bottom:1px solid var(--line); z-index:5; }
  header b { font-size:18px; } header .sp { flex:1; }
  button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-height:40px; }
  button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .seg { display:flex; gap:4px; } .seg button { padding:6px 10px; min-height:36px; }
  #stage { position:fixed; inset:52px 0 0 0; touch-action:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #ghost { position:absolute; inset:0; padding:14px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; opacity:.25; pointer-events:none; }
  #ghost span { padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-weight:700; }
  #big { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center; padding:20px; }
  #big .name { font-size:min(14vw,64px); font-weight:800; line-height:1.05; }
  #big .sub { color:var(--soft); font-size:18px; margin-top:8px; }
  #big .letters { font-size:28px; letter-spacing:.3em; color:var(--gold); font-weight:800; }
  #list { position:absolute; left:0; right:0; bottom:0; display:none; flex-direction:column; gap:10px; padding:14px; }
  #list button { font-size:28px; font-weight:800; min-height:76px; border-radius:16px; }
  #stage.flash-pos { background:var(--pos); } #stage.flash-neg { background:var(--neg); } #stage.flash-bad { background:#6b2d2d; }
  #stage { transition:background .15s; }
  #panel { position:fixed; inset:52px 0 0 0; background:var(--bg); overflow:auto; padding:14px; display:none; z-index:4; }
  #panel h2 { font-size:17px; margin:18px 0 6px; } #panel p { color:var(--soft); margin:4px 0; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:12px; margin:6px 0; }
  .opt b { min-width:26px; font-size:18px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:10px 14px; border-radius:12px; opacity:0; transition:opacity .2s; z-index:6; max-width:92vw; }
  #toast.show { opacity:1; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--soft); }
  .hint { position:absolute; left:0; right:0; top:10px; text-align:center; color:var(--soft); font-size:14px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <b id="cls">9AS</b><span class="pill" id="phase">idle</span>
  <span class="sp"></span>
  <div class="seg"><button id="bDraw" aria-pressed="true">Blind</button><button id="bTeach">Teach</button><button id="bTry">Try</button><button id="bPicks">Picks</button></div>
  <button id="theme" aria-label="Light or dark">&#9680;</button>
</header>

<div id="stage">
  <div id="ghost"></div>
  <canvas id="ink"></canvas>
  <div class="hint" id="hint">Draw the first letter of a name anywhere. One tap: positive. Two taps: negative. Three: menu. Hold: clear.</div>
  <div id="big"><div class="letters" id="bigLetters"></div><div class="name" id="bigName"></div><div class="sub" id="bigSub"></div></div>
  <div id="list"></div>
</div>

<div id="panel"></div>
<div id="toast"></div>

<script src="../../planner/eyes-free.js"></script>
<script>
(function () {
  'use strict';
  if (!window.EyesFree) { document.body.innerHTML = '<p style="padding:20px">Open this page from the project folder: it needs planner/eyes-free.js next to it.</p>'; return; }
  var E = window.EyesFree, $ = function (id) { return document.getElementById(id); };
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  // made-up class, no real pupils
  var FIRST = ['Alex', 'Alex', 'Ben', 'Cara', 'Dan', 'Dan', 'Eve', 'Finn', 'Gus', 'Hana', 'Ivy', 'Jack', 'Jack', 'Jack', 'Kit', 'Lea', 'Max', 'Nia', 'Omar', 'Pia', 'Ravi', 'Sam', 'Sam', 'Tom', 'Uma', 'Will', 'Zara'];
  var LAST = ['Brown', 'Green', 'Hill', 'Ivers', 'Jones', 'Kay', 'Lake', 'Moss', 'Nash', 'Orr', 'Park', 'Quinn', 'Reed', 'Shaw', 'Tate', 'Underwood', 'Vale', 'West', 'Young', 'Zhou', 'Adams', 'Baker', 'Cole', 'Dale', 'Ellis', 'Ford', 'Gray'];
  var ROSTER = FIRST.map(function (f, i) { return { name: f + ' ' + LAST[i], short: f + ' ' + LAST[i][0] + '.' }; });

  // ---- the picks he can feel (each one is a lettered option in the Picks panel)
  var PICK = { several: LS.get('ef.several') || 'A', commit: LS.get('ef.commit') || 'A', feedback: LS.get('ef.feedback') || 'A' };
  function savePick(k, v) { PICK[k] = v; LS.set('ef.' + k, v); }

  var own = (function () { try { return JSON.parse(LS.get('ef.own') || '[]'); } catch (e) { return []; } })();
  var session = E.createSession(ROSTER, { doubleTapMs: 400 });
  var mode = 'draw';   // draw | teach | try | picks
  var buzz = function (p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 1800); }
  function flash(kind) { var s = $('stage'); s.className = 'flash-' + kind; setTimeout(function () { s.className = ''; }, 260); }
  function show(letters, name, sub) { $('bigLetters').textContent = letters || ''; $('bigName').textContent = name || ''; $('bigSub').textContent = sub || ''; }
  function listShow(cands) {
    var el = $('list'); el.style.display = cands && cands.length ? 'flex' : 'none';
    el.innerHTML = (cands || []).map(function (c) { return '<button data-name="' + c.name.replace(/"/g, '&quot;') + '">' + c.short + '</button>'; }).join('');
  }
  $('list').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    handle(session.choose(b.dataset.name, Date.now()));
  });
  $('ghost').innerHTML = ROSTER.map(function (s) { return '<span>' + s.short + '</span>'; }).join('');

  // ---- what each event looks and feels like
  var pendingPositive = null;   // commit option B: a positive already logged, waiting to see if a second tap turns it
  function handle(ev) {
    if (!ev) return;
    $('phase').textContent = session.state().phase;
    if (ev.type === 'picked') { show(session.state().letters.map(function (l) { return l[0]; }).join(' '), ev.student.short, 'tap once: positive, twice: negative'); listShow(null); buzz(15); }
    if (ev.type === 'narrow') {
      show(ev.letters.map(function (l) { return l.join('/'); }).join(' '), ev.count + ' pupils', 'draw the surname initial');
      buzz([15, 40, 15]);
      if (PICK.several !== 'A') listShow(E.rank(session.state().cands, session.state().recent).slice(0, 4));
    }
    if (ev.type === 'choose') { show(session.state().letters.map(function (l) { return l.join('/'); }).join(' '), '', 'tap the name'); listShow(ev.cands); buzz([15, 40, 15]); }
    if (ev.type === 'nobody') { show(ev.letters.join(' '), 'nobody', 'no pupil starts like that'); flash('bad'); buzz(180); }
    if (ev.type === 'tap') {
      if (PICK.commit === 'B' && ev.count === 1) { pendingPositive = ev.student; flash('pos'); buzz(30); show('', ev.student.short, 'positive (tap again within 0.4 s to make it a negative)'); }
      else show('', ev.student.short, ev.count === 1 ? 'positive...' : ev.count === 2 ? 'negative...' : 'menu...');
    }
    if (ev.type === 'log') {
      var pos = ev.kind === '+';
      if (PICK.commit === 'B' && pos && pendingPositive) { pendingPositive = null; show('', ev.student.short, 'positive logged'); }
      else { flash(pos ? 'pos' : 'neg'); buzz(pos ? 30 : [30, 60, 30]); show('', ev.student.short, pos ? 'positive logged' : 'negative logged'); }
      if (PICK.commit === 'B' && !pos) { pendingPositive = null; toast('The positive became a negative'); }
      listShow(null); setTimeout(function () { if (session.state().phase === 'idle') show('', '', ''); }, 1200);
    }
    if (ev.type === 'menu') { show('', ev.student.short, 'the full menu would open here'); buzz([30, 30, 30, 30, 30]); listShow(null); }
    if (ev.type === 'expired') { show('', '', ''); listShow(null); toast('Nothing logged: the pick timed out'); }
    if (ev.type === 'cleared') { show('', '', ''); listShow(null); buzz(10); toast('Cleared'); }
    $('phase').textContent = session.state().phase;
  }

  // ---- ink and pointer handling
  var cv = $('ink'), cx = cv.getContext('2d'), strokes = [], cur = null;
  function size() { var r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  size(); window.addEventListener('resize', size);
  function draw() {
    cx.clearRect(0, 0, cv.width, cv.height); cx.lineWidth = 7; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold');
    strokes.concat(cur ? [cur] : []).forEach(function (s) { cx.beginPath(); s.forEach(function (p, i) { if (i) cx.lineTo(p.x, p.y); else cx.moveTo(p.x, p.y); }); cx.stroke(); });
  }
  var recogniseNow = function (st) {
    if (mode === 'teach') return teachGot(st);
    if (mode === 'try') return tryGot(st);
    var r = E.recognise(st, { letters: session.alphabet(), own: own });
    handle(session.letter(r, Date.now()));
  };
  var input = E.createInput({
    onLetter: function (st, t) { strokes = []; draw(); recogniseNow(st); },
    onTap: function (t) { if (mode === 'draw') handle(session.tap(Date.now())); },   // the session runs on the wall clock
    onHold: function (t) { strokes = []; cur = null; draw(); if (mode === 'draw') handle(session.cancel()); }
  });
  var stage = $('stage');
  stage.addEventListener('pointerdown', function (e) { if (mode === 'picks') return; stage.setPointerCapture(e.pointerId); cur = [{ x: e.clientX, y: e.clientY - 52 }]; input.down(e.clientX, e.clientY, e.timeStamp); draw(); });
  stage.addEventListener('pointermove', function (e) { if (!cur) return; cur.push({ x: e.clientX, y: e.clientY - 52 }); input.move(e.clientX, e.clientY, e.timeStamp); draw(); });
  stage.addEventListener('pointerup', function (e) { if (!cur) return; strokes.push(cur); cur = null; input.up(e.timeStamp); draw(); });
  stage.addEventListener('pointercancel', function () { cur = null; draw(); });
  setInterval(function () { var t = performance.now(); input.tick(t); if (mode === 'draw') handle(session.tick(Date.now())); if (!input.pending() && !cur && strokes.length) { strokes = []; draw(); } }, 80);

  // ---- Teach: his own hand, three goes per letter of this class
  var teach = null;
  function teachStart() {
    var letters = E.alphabet(ROSTER, 'first').concat(E.alphabet(ROSTER, 'last')).filter(function (l, i, a) { return a.indexOf(l) === i; });
    teach = { letters: letters, i: 0, go: 1 };
    teachShow();
  }
  function teachShow() {
    if (teach.i >= teach.letters.length) { show('', 'Taught', own.length + ' drawings kept on this phone'); teach = null; return; }
    show('', teach.letters[teach.i], 'draw it (' + teach.go + ' of 3)');
  }
  function teachGot(st) {
    if (!teach) return;
    own = E.addOwn(own, teach.letters[teach.i], st, 3); LS.set('ef.own', JSON.stringify(own));
    buzz(15);
    if (++teach.go > 3) { teach.go = 1; teach.i++; }
    teachShow();
  }
  // ---- Try: it names a pupil, he draws, it keeps score
  var trial = null;
  function tryStart() { trial = { n: 0, hit: 0 }; tryNext(); }
  function tryNext() {
    var st = ROSTER[Math.floor(Math.random() * ROSTER.length)], ini = E.initialsOf(st.name);
    var several = E.candidates(ROSTER, [ini.first]).length > 1;
    trial.target = st; trial.want = several ? [ini.first, ini.last] : [ini.first]; trial.got = [];
    show(trial.hit + ' / ' + trial.n, st.short, several ? 'draw ' + ini.first + ' then ' + ini.last : 'draw ' + ini.first);
  }
  function tryGot(st) {
    var r = E.recognise(st, { letters: trial.got.length ? E.alphabet(E.candidates(ROSTER, [trial.want[0]]), 'last') : E.alphabet(ROSTER, 'first'), own: own });
    var want = trial.want[trial.got.length], got = r.letters[0] ? r.letters[0].letter : '?';
    trial.got.push(got);
    if (got !== want) { trial.n++; flash('bad'); buzz(120); toast('Read as ' + got + ' (wanted ' + want + ')'); return tryNext(); }
    if (trial.got.length < trial.want.length) { buzz(15); $('bigSub').textContent = 'now ' + trial.want[1]; return; }
    trial.n++; trial.hit++; flash('pos'); buzz(30); tryNext();
  }

  // ---- panel with the picks
  function picksHTML() {
    var sel = function (k, v) { return 'aria-pressed="' + (PICK[k] === v) + '" data-pick="' + k + '" data-v="' + v + '"'; };
    return '<h2>1. When the first letter fits several pupils</h2>' +
      '<div class="opt"><b>A</b><div>Nothing shows but a count. You draw the surname initial without looking (my pick: it stays eyes-free).</div><button ' + sel('several', 'A') + '>A</button></div>' +
      '<div class="opt"><b>B</b><div>The matching names appear big at once; you glance and tap one. You can still draw the surname letter instead.</div><button ' + sel('several', 'B') + '>B</button></div>' +
      '<h2>2. How a tap becomes a positive</h2>' +
      '<div class="opt"><b>A</b><div>Tap, then 0.4 s of nothing: one positive is saved (one trip to the server; the buzz comes after the pause). A second tap inside the pause makes it a negative instead.</div><button ' + sel('commit', 'A') + '>A</button></div>' +
      '<div class="opt"><b>B</b><div>The positive is saved and buzzes the instant you tap. A second tap within 0.4 s undoes it and saves a negative (two trips).</div><button ' + sel('commit', 'B') + '>B</button></div>' +
      '<h2>3. How you get into Blind mode on the real phone page</h2>' +
      '<div class="opt"><b>A</b><div>A third button beside Plan and Names: "Blind". The seating plan stays underneath, faint (my pick).</div></div>' +
      '<div class="opt"><b>B</b><div>No button: drawing a letter anywhere on the Plan or Names screen that is not a tap on a seat counts. Seats still work as now.</div></div>' +
      '<div class="opt"><b>C</b><div>Blind is the whole Lesson tab when the phone is in your pocket orientation (upside down); the right way up shows the plan.</div></div>' +
      '<h2>4. The buzzes (feel them in Blind: they are already on)</h2>' +
      '<p>Pupil found: one tiny buzz. Several pupils: two tiny buzzes. Positive: one short. Negative: short, long, short. Nobody: one long. Menu: five quick. Say if any should change.</p>' +
      '<h2>What is built behind this page</h2><p>The letter reader, the pupil matching and the tap rules are the real code (planner/eyes-free.js, 55 checks). "Teach" keeps your own letters on this phone and they win over the built-in ones. "Try" scores how often it reads you right: do 20 and tell me the score.</p>' +
      '<div class="row"><button id="wipeOwn">Forget my taught letters</button><span class="pill">' + own.length + ' kept</span></div>';
  }
  function setMode(m) {
    mode = m; session.cancel(); strokes = []; draw(); show('', '', ''); listShow(null);
    ['bDraw', 'bTeach', 'bTry', 'bPicks'].forEach(function (id) { $(id).setAttribute('aria-pressed', String(id === { draw: 'bDraw', teach: 'bTeach', try: 'bTry', picks: 'bPicks' }[m])); });
    $('panel').style.display = m === 'picks' ? 'block' : 'none';
    $('hint').style.display = m === 'draw' ? '' : 'none';
    if (m === 'picks') $('panel').innerHTML = picksHTML();
    if (m === 'teach') teachStart();
    if (m === 'try') tryStart();
    if (m === 'draw') show('', '', '');
  }
  $('bDraw').onclick = function () { setMode('draw'); }; $('bTeach').onclick = function () { setMode('teach'); }; $('bTry').onclick = function () { setMode('try'); }; $('bPicks').onclick = function () { setMode('picks'); };
  $('panel').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'wipeOwn') { own = []; LS.set('ef.own', '[]'); toast('Forgotten'); $('panel').innerHTML = picksHTML(); return; }
    if (b.dataset.pick) { savePick(b.dataset.pick, b.dataset.v); $('panel').innerHTML = picksHTML(); }
  });
  $('theme').onclick = function () { var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; LS.set('ef.theme', t); draw(); };
  document.documentElement.dataset.theme = LS.get('ef.theme') || 'dark';
  setMode('draw');
})();
</script>
</body>
</html>
