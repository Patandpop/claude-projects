<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn slides: six dual-coding layouts (mock-ups)</title>
<style>
  :root { --navy:#0D1B5E; --navy2:#152347; --gold:#FABB2E; --yellow:#FFD60A; --bg:#EDF2FA; --learn:#F9A825; --ink:#1A1A2E; --grey:#5d6a7f; --green:#2E7D32; --red:#C62828; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1b2233; color:#e8edf5; font:15px/1.4 "Trebuchet MS",Trebuchet,system-ui,sans-serif; }
  header { padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#0f1420; position:sticky; top:0; z-index:3; }
  header b { font-size:17px; margin-right:6px; }
  button { font:inherit; padding:8px 12px; border-radius:9px; border:1px solid #3a4661; background:#182134; color:#e8edf5; }
  button[aria-pressed="true"] { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .note { padding:10px 14px; color:#b8c2d6; max-width:1100px; } .note b { color:#fff; }
  .tools { padding:0 14px 8px; display:flex; gap:8px; }
  #stage { padding:10px; display:flex; justify-content:center; }
  .frame { position:relative; transform-origin:top left; }
  .slide { width:1333px; height:750px; background:var(--bg); position:relative; overflow:hidden; color:var(--ink); font-family:"Trebuchet MS",Trebuchet,sans-serif; }
  .nav { display:flex; height:55px; } .nav div { flex:1; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; background:var(--navy2); letter-spacing:.04em; }
  .nav div.on { background:var(--learn); color:#111; font-weight:700; font-size:15px; }
  .acc { height:4px; background:var(--gold); }
  .bar { margin-top:12px; height:38px; background:var(--learn); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
  .foot { position:absolute; left:0; right:0; bottom:0; height:35px; background:var(--navy); color:#fff; display:flex; align-items:center; padding:0 14px; font-size:15px; } .foot b { margin-right:8px; } .foot i { color:#dfe6f5; }
  .body { position:absolute; left:45px; right:45px; top:121px; bottom:47px; }
  .k { color:var(--navy); font-weight:800; border-bottom:3px solid var(--gold); }
  .write { position:absolute; left:0; right:0; bottom:0; height:62px; background:#fff; border:2px solid var(--navy); border-radius:4px; display:flex; align-items:center; gap:14px; padding:0 16px; font-size:19px; }
  .write .pen { width:38px; height:38px; border-radius:50%; background:var(--navy); color:var(--yellow); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none; }
  .write .lab { font-size:12px; letter-spacing:.1em; color:var(--grey); width:90px; line-height:1.1; }
  .chips { position:absolute; right:0; top:-34px; display:flex; gap:6px; }
  .chip { background:var(--navy); color:#fff; font-weight:700; font-size:13px; padding:3px 10px; border-radius:6px; }
  .pic { background:#fff; border:2px solid var(--gold); border-radius:4px; position:relative; overflow:hidden; }
  .pic svg { width:100%; height:100%; display:block; }
  .cap { position:absolute; left:0; right:0; bottom:0; background:rgba(13,27,94,.9); color:#fff; font-size:14px; padding:5px 10px; }
  .card { background:#fff; border:2px solid var(--gold); border-radius:4px; padding:10px 14px; font-size:18px; }
  .card h4 { margin:0 0 4px; font-size:13px; letter-spacing:.1em; color:var(--grey); font-weight:700; }
  .navyh { background:var(--navy); color:#fff; font-weight:700; font-size:20px; padding:8px 14px; border:2px solid var(--gold); border-bottom:0; border-radius:4px 4px 0 0; }
  .navyb { background:#fff; border:2px solid var(--gold); border-top:0; border-radius:0 0 4px 4px; padding:12px 14px; font-size:19px; line-height:1.45; }
  .navyb p { margin:0 0 10px; }
  .line { position:absolute; height:2px; background:var(--navy); transform-origin:left center; }
  .dot { position:absolute; width:14px; height:14px; border-radius:50%; background:var(--yellow); border:3px solid var(--navy); transform:translate(-50%,-50%); }
  .dim { opacity:.15; } .step-on { opacity:1; } .fade { transition:opacity .35s; }
  .dots { position:absolute; right:340px; top:-30px; display:flex; gap:6px; } .dots i { width:12px; height:12px; border-radius:50%; background:#c5cde0; } .dots i.on { background:var(--navy); }
  .big { font-size:30px; line-height:1.3; font-weight:400; }
  .node { position:absolute; background:#fff; border:2px solid var(--navy); border-radius:30px; padding:8px 16px; font-size:17px; font-weight:700; color:var(--navy); transform:translate(-50%,-50%); white-space:nowrap; }
  .node.c { background:var(--navy); color:var(--yellow); font-size:24px; padding:14px 26px; border-color:var(--gold); }
  .spoke { position:absolute; height:3px; background:var(--navy); transform-origin:left center; }
  .spoke span { position:absolute; top:-22px; left:50%; transform:translateX(-50%); background:var(--bg); font-size:13px; color:var(--grey); padding:0 4px; white-space:nowrap; }
  .arrow { font-size:60px; color:var(--navy); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<header>
  <b>Learn, six layouts</b>
  <button data-v="A" aria-pressed="true">A notes around a picture</button><button data-v="B">B write this, see this</button><button data-v="C">C one idea</button><button data-v="D">D build it up</button><button data-v="E">E concept map</button><button data-v="F">F cause and effect</button>
</header>
<div class="note" id="note"></div>
<div class="tools" id="tools"></div>
<div id="stage"><div class="frame" id="frame"></div></div>

<script>
(function () {
  'use strict';
  // one worked topic for all six: changing state (9AS), so the layouts can be compared like for like
  var PART = function (kind, w, h) {
    var dots = '', n = kind === 'solid' ? 20 : kind === 'liquid' ? 18 : 9, r = 11;
    for (var i = 0; i < n; i++) {
      var cx, cy;
      if (kind === 'solid') { cx = 40 + (i % 5) * 30; cy = 40 + Math.floor(i / 5) * 30; }
      else if (kind === 'liquid') { cx = 38 + (i % 6) * 29 + ((i * 7) % 11) - 5; cy = 70 + Math.floor(i / 6) * 31 + ((i * 5) % 7) - 3; }
      else { cx = 30 + ((i * 53) % 150); cy = 30 + ((i * 37) % 110); }
      dots += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (kind === 'gas' ? '#4c8dff' : kind === 'liquid' ? '#2b6cd9' : '#0D1B5E') + '"/>';
      if (kind === 'gas') dots += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + ((i % 2) ? 22 : -18)) + '" y2="' + (cy + ((i % 3) ? -16 : 14)) + '" stroke="#4c8dff" stroke-width="3"/>';
    }
    return '<svg viewBox="0 0 200 170" style="width:' + (w || '100%') + ';height:' + (h || '100%') + '"><rect x="8" y="8" width="184" height="154" rx="6" fill="#f7f9fd" stroke="#0D1B5E" stroke-width="3"/>' + dots + '</svg>';
  };
  var chrome = function (body, bar) {
    return '<div class="slide"><div class="nav"><div>DO NOW</div><div>ENGAGE</div><div class="on">LEARN</div><div>BUILD</div><div>APPLY</div><div>REVIEW</div></div><div class="acc"></div>' +
      '<div class="bar">' + bar + '</div><div class="body">' + body + '</div><div class="foot"><b>Learning objective:</b><i>Explain changes of state using the particle model</i></div></div>';
  };
  var chips = '<div class="chips"><span class="chip">melting</span><span class="chip">boiling</span><span class="chip">internal energy</span></div>';
  var write = function (t) { return '<div class="write"><div class="pen">WRITE</div><div class="lab">IN YOUR BOOK</div><div>' + t + '</div></div>'; };
  var step = 0;
  var V = {
    A: {
      note: '<b>A, notes around a picture.</b> The picture is the slide: one big diagram in the middle, three short notes placed around it, each joined by a line to the part it explains. Different from the labelled picture you already have (that names parts); these are the explanations, in full sentences with the key word underlined. One line at the bottom says what pupils copy.',
      html: function () {
        return chrome('<div style="position:relative;height:100%">' + chips +
          '<div class="pic" style="position:absolute;left:330px;top:40px;width:560px;height:430px;padding:10px"><div style="display:flex;gap:10px;height:100%">' + PART('solid') + PART('liquid') + PART('gas') + '</div><div class="cap">Heating a substance: solid, liquid, gas</div></div>' +
          '<div class="card" style="position:absolute;left:0;top:60px;width:300px"><h4>1</h4>In a <span class="k">solid</span> the particles vibrate in fixed places. Heating makes them vibrate more.</div>' +
          '<div class="card" style="position:absolute;right:0;top:40px;width:300px"><h4>2</h4>At the <span class="k">melting point</span> the particles have enough energy to slide past each other.</div>' +
          '<div class="card" style="position:absolute;right:0;top:300px;width:300px"><h4>3</h4>At the <span class="k">boiling point</span> they break free and move apart: a gas.</div>' +
          '<div class="line" style="left:300px;top:110px;width:70px"></div><div class="dot" style="left:372px;top:110px"></div>' +
          '<div class="line" style="left:830px;top:95px;width:160px"></div><div class="dot" style="left:830px;top:95px"></div>' +
          '<div class="line" style="left:850px;top:355px;width:140px"></div><div class="dot" style="left:850px;top:355px"></div>' +
          write('Heating gives the particles more energy: they vibrate, then slide, then break free.') + '</div>', 'LEARN · CHANGING STATE');
      }
    },
    B: {
      note: '<b>B, write this, see this.</b> Two columns with one job each: the left is exactly what goes in the book (three sentences, key words bold, nothing else on the slide to copy), the right is the picture with a caption he talks from. The picture is always on the right at this size, in every lesson, so pupils know where to look.',
      html: function () {
        return chrome('<div style="position:relative;height:100%">' + chips + '<div style="display:flex;gap:18px;height:470px">' +
          '<div style="flex:1"><div class="navyh">In your book</div><div class="navyb" style="height:calc(100% - 44px)"><p><b>1.</b> Heating a substance gives its particles more <span class="k">internal energy</span>.</p><p><b>2.</b> At the <span class="k">melting point</span> the particles gain enough energy to slide past each other: the solid becomes a liquid.</p><p><b>3.</b> At the <span class="k">boiling point</span> the particles break free of each other: the liquid becomes a gas.</p><p style="color:var(--grey);font-size:15px;margin-top:14px">The temperature stays the same while a substance melts or boils: the energy is breaking bonds, not speeding particles up.</p></div></div>' +
          '<div class="pic" style="width:520px;padding:10px"><div style="display:flex;gap:8px;height:100%">' + PART('solid') + PART('liquid') + PART('gas') + '</div><div class="cap">Same particles, more energy, further apart</div></div></div>' +
          write('The three numbered sentences on the left.') + '</div>', 'LEARN · CHANGING STATE');
      }
    },
    C: {
      note: '<b>C, one idea.</b> One slide, one idea, said once: a single big sentence across the top with its key words underlined, the picture under it on the left, and two small cards on the right, "Why" and "Example". Nothing is split across two slides; the next idea gets its own slide like this. For the lessons where the text was too much.',
      html: function () {
        return chrome('<div style="position:relative;height:100%">' + chips +
          '<div class="card big" style="margin-bottom:16px">While a substance <span class="k">melts</span> or <span class="k">boils</span>, its temperature does not change: the energy is used to break the bonds between particles.</div>' +
          '<div style="display:flex;gap:18px;height:330px"><div class="pic" style="flex:1.3;padding:10px 10px 36px"><svg viewBox="0 0 400 220" style="width:100%;height:100%"><line x1="40" y1="190" x2="380" y2="190" stroke="#0D1B5E" stroke-width="3"/><line x1="40" y1="190" x2="40" y2="20" stroke="#0D1B5E" stroke-width="3"/><polyline points="40,180 110,120 190,120 260,50 350,50" fill="none" stroke="#2b6cd9" stroke-width="5"/><text x="150" y="110" font-size="14" fill="#0D1B5E" font-weight="bold">melting: flat</text><text x="300" y="42" font-size="14" fill="#0D1B5E" font-weight="bold">boiling: flat</text><text x="190" y="212" font-size="13" fill="#5d6a7f">time (heating steadily)</text><text x="12" y="105" font-size="13" fill="#5d6a7f" transform="rotate(-90 12 105)">temperature</text></svg><div class="cap">Heating curve: the flat parts are the changes of state</div></div>' +
          '<div style="flex:1;display:flex;flex-direction:column;gap:12px"><div class="card" style="flex:1"><h4>WHY</h4>Bonds between particles take energy to break. Until they are broken, the particles do not move faster, so the thermometer does not rise.</div><div class="card" style="flex:1"><h4>EXAMPLE</h4>Ice at 0 °C stays at 0 °C while it melts, even over a flame.</div></div></div>' +
          write('The big sentence, then sketch the heating curve with the two flat parts labelled.') + '</div>', 'LEARN · CHANGING STATE · 1 of 3');
      }
    },
    D: {
      note: '<b>D, build it up.</b> The diagram is drawn in three clicks, and each click adds one sentence under it, so the explanation and the picture grow together and pupils draw along. Press "Next click". The dots top right show how many steps there are. Best for processes and diagrams with parts.',
      tools: '<button id="next">Next click</button><button id="reset">Start again</button>',
      html: function () {
        return chrome('<div style="position:relative;height:100%">' + chips + '<div class="dots"><i class="on"></i><i></i><i></i></div>' +
          '<div style="display:flex;gap:18px;height:470px"><div class="pic" style="flex:1.1;padding:12px"><div style="display:flex;gap:10px;height:100%"><div class="fade step-on" data-s="0" style="flex:1">' + PART('solid') + '</div><div class="fade dim" data-s="1" style="flex:1">' + PART('liquid') + '</div><div class="fade dim" data-s="2" style="flex:1">' + PART('gas') + '</div></div><div class="cap">Draw each box as it appears</div></div>' +
          '<div style="flex:1;display:flex;flex-direction:column;gap:10px"><div class="card fade step-on" data-s="0" style="flex:1"><h4>1 SOLID</h4>Particles in fixed places, touching, <span class="k">vibrating</span>. Strong bonds hold the shape.</div><div class="card fade dim" data-s="1" style="flex:1"><h4>2 LIQUID</h4>Heated past the <span class="k">melting point</span>, the particles slide past each other. Still touching, no fixed shape.</div><div class="card fade dim" data-s="2" style="flex:1"><h4>3 GAS</h4>Heated past the <span class="k">boiling point</span>, they break free and spread out, moving fast in all directions.</div></div></div>' +
          write('The three boxes and one sentence under each.') + '</div>', 'LEARN · CHANGING STATE');
      }
    },
    E: {
      note: '<b>E, concept map.</b> The key term in the middle, four short branches with a joining word on each line ("needs", "happens at"), and a small picture in the corner. Good for a summary Learn at the end of a topic, or for a term with several ideas hanging off it. Pupils copy the map, not sentences.',
      html: function () {
        var sp = function (x, y, len, ang, word) { return '<div class="spoke" style="left:' + x + 'px;top:' + y + 'px;width:' + len + 'px;transform:rotate(' + ang + 'deg)"><span>' + word + '</span></div>'; };
        return chrome('<div style="position:relative;height:100%">' + chips +
          sp(600, 240, 300, -35, 'needs') + sp(600, 240, 300, 35, 'happens at') + sp(600, 240, 300, 145, 'does not change') + sp(600, 240, 300, 215, 'particles') +
          '<div class="node c" style="left:600px;top:240px">CHANGE OF STATE</div>' +
          '<div class="node" style="left:860px;top:68px">energy in (heating) or out (cooling)</div><div class="node" style="left:860px;top:412px">melting point, boiling point</div>' +
          '<div class="node" style="left:340px;top:412px">temperature while it happens</div><div class="node" style="left:340px;top:68px">same particles, further apart or closer</div>' +
          '<div class="pic" style="position:absolute;right:0;bottom:80px;width:230px;height:150px;padding:6px">' + PART('liquid') + '</div>' +
          write('Copy the map. Add one example of your own on a fifth branch.') + '</div>', 'LEARN · CHANGING STATE · SUMMARY');
      }
    },
    F: {
      note: '<b>F, cause and effect.</b> Two pictures side by side with an arrow, "before" and "after", and one "because" line under the arrow. For any Learn where the idea is a change: heating, a force, a reaction. The pictures are the same size every time, so lessons look the same across topics.',
      html: function () {
        return chrome('<div style="position:relative;height:100%">' + chips + '<div style="display:flex;gap:14px;height:360px;align-items:stretch">' +
          '<div class="pic" style="flex:1;padding:10px"><div style="position:absolute;left:10px;top:8px;font-size:13px;letter-spacing:.1em;color:var(--grey)">BEFORE: ICE AT 0 °C</div><div style="height:100%;padding-top:22px">' + PART('solid') + '</div><div class="cap">Particles fixed, vibrating</div></div>' +
          '<div class="arrow" style="width:140px;flex-direction:column"><div>→</div><div style="font-size:15px;color:var(--grey);margin-top:-14px">heat energy in</div></div>' +
          '<div class="pic" style="flex:1;padding:10px"><div style="position:absolute;left:10px;top:8px;font-size:13px;letter-spacing:.1em;color:var(--grey)">AFTER: WATER AT 0 °C</div><div style="height:100%;padding-top:22px">' + PART('liquid') + '</div><div class="cap">Particles sliding past each other</div></div></div>' +
          '<div class="card" style="margin-top:16px;font-size:21px"><b style="color:var(--navy)">Because</b> the energy breaks the bonds holding the particles in place, the solid <span class="k">melts</span>. The temperature stays at 0 °C until all the ice has gone.</div>' +
          write('Both pictures, the arrow, and the "because" sentence.') + '</div>', 'LEARN · CHANGING STATE');
      }
    }
  };
  var frame = document.getElementById('frame'), note = document.getElementById('note'), tools = document.getElementById('tools'), cur = 'A';
  function fit() { var el = frame.firstChild, w = el ? el.offsetWidth : 1333, h = el ? el.offsetHeight : 750, s = Math.min((window.innerWidth - 20) / w, 1); frame.style.transform = 'scale(' + s + ')'; frame.style.width = w + 'px'; frame.style.height = h + 'px'; document.getElementById('stage').style.height = (h * s + 20) + 'px'; }
  function next() { step = Math.min(step + 1, 2); frame.querySelectorAll('[data-s]').forEach(function (el) { el.classList.toggle('dim', Number(el.dataset.s) > step); }); frame.querySelectorAll('.dots i').forEach(function (d, i) { d.classList.toggle('on', i <= step); }); }
  function show(k) {
    cur = k; step = 0; frame.innerHTML = V[k].html(); note.innerHTML = V[k].note; tools.innerHTML = V[k].tools || '';
    document.querySelectorAll('header button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === k)); });
    var n = document.getElementById('next'), r = document.getElementById('reset'); if (n) n.onclick = next; if (r) r.onclick = function () { show(k); };
    fit();
  }
  document.querySelector('header').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(b.dataset.v); });
  frame.addEventListener('click', function () { if (document.getElementById('next')) next(); });
  window.addEventListener('resize', fit);
  show('A');
})();
</script>
</body>
</html>
